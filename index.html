<style>
:root{
  --teal:#3AA094; --teal2:#00AE9C; --teal-soft:#e3f3f1; --navy:#172334; --ink:#000924;
  --gray:#F2F1F1; --line:#dde2e6; --muted:#5d6b7a; --white:#fff;
  --red:#c8463d; --red-soft:#fbe9e7; --amber:#c98a12; --amber-soft:#fdf3dc; --blue:#2c6fb7; --blue-soft:#e6effa;
  --r:12px; --sh:0 1px 2px rgba(23,35,52,.06),0 4px 14px rgba(23,35,52,.06);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--gray);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Chakra Petch","DM Sans",sans-serif;margin:0;color:var(--navy);letter-spacing:.2px}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
.mono{font-family:"JetBrains Mono",monospace;font-size:.92em}
button,input,select{font:inherit;color:inherit}
a{color:var(--teal)}

/* Header */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px}
.top .back{background:rgba(255,255,255,.08);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
.top .logo{height:20px;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-family:"Chakra Petch";font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:#BACAD3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ic{background:rgba(255,255,255,.08);border:0;color:#fff;height:38px;padding:0 12px;border-radius:10px;cursor:pointer;font-size:13px;flex:none}
.modebar{font-size:12px;padding:5px 16px;text-align:center}
.modebar.local{background:var(--amber-soft);color:#7a5408}
.modebar.cloud{background:var(--teal-soft);color:#1d6b62}

main{width:100%;padding:16px 16px calc(28px + var(--safe-b))}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.kpi{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid #e9ecef}
.card.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.click:active{transform:scale(.99)}
.card .sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.dark{background:var(--navy)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--teal);padding:8px 10px;min-height:auto}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

label.f{display:block;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select{margin-top:4px}
input.in,select.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:44px;font-size:16px}
input.in:focus,select.in:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--teal-soft);color:#1d6b62}
.b-warn{background:var(--amber-soft);color:#7a5408}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:#eceff1;color:#4a5866}

.kpi .card{padding:14px}
.kpi .v{font-family:"Chakra Petch";font-size:26px;color:var(--navy);line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid #e9ecef;background:#fff;box-shadow:var(--sh)}
table.t{width:100%;min-width:680px;border-collapse:collapse;font-size:14px}
table.t th{position:sticky;top:0;background:#f7f8f9;text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid #f0f2f4;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.hl td{background:#fffaf0}
.pos{color:#1d7a46;font-weight:700}.neg{color:var(--red);font-weight:700}

.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Leitor */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px}.chk[hidden],[hidden]{display:none!important}
.cam{position:relative;background:#0d1622;border-radius:var(--r);overflow:hidden;height:36vh;min-height:220px;max-height:420px}
.cam video{width:100%;height:100%;object-fit:cover;display:none}
.cam.live video{display:block}
.cam .guide{position:absolute;left:4%;top:27.5%;width:92%;height:45%;display:none;pointer-events:none;transition:left .16s ease-out,top .16s ease-out,width .16s ease-out,height .16s ease-out}
.guide.lock i{border-color:#7CFFB2;border-width:4px}
.guide.lock .laser{display:none}
.guide.lock{background:rgba(124,255,178,.10);border-radius:10px}
.cam.live .guide{display:block}
.guide i{position:absolute;width:26px;height:26px;border:3px solid var(--teal2)}
.guide i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.guide i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.guide i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.guide i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.laser{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 10px #ff4d4d;opacity:.85}
.cam.hit .guide i{border-color:#7CFFB2}
.cam.hit::after{content:"";position:absolute;inset:0;background:rgba(0,174,156,.28);animation:fl .3s forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.camtools{position:absolute;top:10px;right:10px;display:none;gap:8px}
.cam.live .camtools{display:flex}
.camtools button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:15px;cursor:pointer;backdrop-filter:blur(4px)}
.camtools button.on{background:var(--teal)}
.caminfo{position:absolute;left:10px;bottom:8px;right:10px;color:#e8f1f4;font-size:12px;font-family:"JetBrains Mono",monospace;text-shadow:0 1px 2px #000;display:none}
.cam.live .caminfo{display:block}
.camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#BACAD3;text-align:center;padding:18px}
.cam.live .camoff{display:none}
.fast{border:2px solid var(--teal)}
.fast.ok{border-color:#9fd9d1;background:#f4fbfa}
.fast .fd{font-size:16px;display:block}
.qrow{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-top:10px}
.stp{border:1px solid var(--line);background:#fff;border-radius:12px;font-size:28px;font-weight:700;cursor:pointer;color:var(--navy)}
.qty.bump{animation:bp .25s}
@keyframes bp{50%{transform:scale(1.06);background:var(--teal-soft)}}
.gtag{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#1d6b62;background:var(--teal-soft);border-radius:6px;padding:1px 7px;letter-spacing:.2px}
.res .d .gtag{display:inline-block;color:#1d6b62;font-size:11px;margin-left:0}
.ov.full{align-items:stretch;justify-content:stretch}
.ov.full .md{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0;display:flex;flex-direction:column;padding-top:calc(14px + var(--safe-t))}
.lslist{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.lsh{position:sticky;top:0;z-index:1;background:var(--navy);color:#fff;font-family:"Chakra Petch";font-size:13px;padding:6px 10px;border-radius:8px;margin:10px 0 6px}
.res.done{opacity:.6}
.tabs button small{opacity:.7;font-weight:500}
.task{border:2px solid var(--teal);background:linear-gradient(180deg,#fff,#f3fbfa)}
.round-dot.big{width:54px;height:54px;font-size:20px;border-radius:14px}
.bars{display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding-top:6px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:none}
.bar .bf{width:70%;border-radius:6px 6px 2px 2px;min-height:2px}
.bar .bv{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:3px;white-space:nowrap}
.bar .bl{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.ecol{display:grid;grid-template-columns:minmax(150px,2fr) minmax(90px,1.4fr) 70px minmax(80px,1fr) auto;gap:6px;align-items:center;margin-top:6px}
.ecol.head{margin-top:10px}
.ecol .in{min-height:38px;padding:6px 8px;font-size:14px}
pre.prev{background:#0d1622;color:#cfe;padding:12px;border-radius:10px;overflow:auto;font-size:12px;font-family:"JetBrains Mono",monospace;white-space:pre;margin:8px 0 0}
.adj.ent{border-left:5px solid #1d7a46}.adj.sai{border-left:5px solid var(--red)}
.ptabs button{font-size:14px;padding:9px 14px}
.etgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.etq{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:12px;text-align:center;break-inside:avoid}
.etq b{display:block;font-size:14px}.etq svg{max-width:100%;height:auto;margin-top:6px}
@media print{ .top,#modebar,.noprint,.toast{display:none!important} body,html{background:#fff} main{padding:0} .etgrid{grid-template-columns:repeat(3,1fr);gap:6px} .etq{border:1px dashed #bbb;border-radius:0;page-break-inside:avoid} }
.results{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.res{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.res:active{background:var(--teal-soft)}
.res .d{flex:1;min-width:0}
.res .d b{display:block;font-weight:600;font-size:14px}
.res .d span{font-size:12px;color:var(--muted)}
.lanc{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #f0f2f4}
.lanc:last-child{border-bottom:0}
.lanc .d{flex:1;min-width:0}
.lanc .d b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc .q{font-family:"Chakra Petch";font-size:18px;color:var(--navy);white-space:nowrap}
.x{border:0;background:#f3f4f5;color:var(--red);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:16px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(9,15,24,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
@media(min-width:700px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:92vh;overflow:auto;animation:up .18s}
@media(min-width:700px){.md{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.qty{font-family:"Chakra Petch";font-size:34px!important;text-align:center;height:68px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;height:44px;font-weight:700;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:80;box-shadow:var(--sh);font-weight:500;max-width:92vw;animation:up .2s}
.toast.err{background:var(--red)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.hint{background:var(--blue-soft);color:#21507f;border-radius:10px;padding:10px 12px;font-size:13px}
.warnbox{background:var(--amber-soft);color:#6d4b07;border-radius:10px;padding:10px 12px;font-size:13px}
.round-dot{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:"Chakra Petch";font-weight:700;color:#fff;background:var(--teal);flex:none}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 6px}
textarea.in{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:"JetBrains Mono",monospace;font-size:12px}
.sec-title{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.sec-title h2{flex:1}
</style>
</head>

function codeStr(v){
  if(v==null) return '';
  if(typeof v==='number') return Number.isInteger(v)? v.toFixed(0) : String(v);
  let s=String(v).trim();
  if(/^\d+(\.\d+)?e\+\d+$/i.test(s)) s=Number(s).toFixed(0);
  return s;
}
function parseNum(v){
  if(typeof v==='number') return v;
  let s=String(v??'').trim().replace(/\s/g,'');
  if(!s) return 0;
  if(s.includes(',') && s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
const eanKey = s => String(s||'').replace(/\D/g,'').replace(/^0+/,'');
function toast(msg,err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------------- modal ---------------- */
function modal(html,{onOpen,dismiss,cls=''}={}){
  closeModal();
  if(dismiss===undefined) dismiss=!/<form|<input|<select|<textarea/i.test(html);
  const ov=document.createElement('div'); ov.className='ov '+cls; ov.id='ov';
  ov.innerHTML=`<div class="md">${html}</div>`;
  let downFora=false;
  ov.addEventListener('pointerdown',e=>{ downFora=(e.target===ov); });
  if(dismiss) ov.addEventListener('click',e=>{ if(e.target===ov && downFora) closeModal(); });
  document.body.appendChild(ov);
  onOpen && onOpen(ov);
  return ov;
}
let modalCloseCb=null;
function closeModal(){ const o=$('#ov'); if(o){ o.remove(); const cb=modalCloseCb; modalCloseCb=null; cb&&cb(); } }
function ask(msg,{ok='Confirmar',danger=false,title='Confirmar'}={}){
  return new Promise(res=>{
    let done=false;
    modal(`<h2>${esc(title)}</h2><p class="muted">${msg}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mNo">Cancelar</button><button class="btn ${danger?'red':''}" id="mOk">${esc(ok)}</button></div>`,
      {onOpen:o=>{ $('#mNo',o).onclick=()=>{done=true;closeModal();res(false)}; $('#mOk',o).onclick=()=>{done=true;closeModal();res(true)}; }});
    modalCloseCb=()=>{ if(!done) res(false); };
  });
}
function askText(title,{label='',value='',type='text',placeholder='',inputmode=''}={}){
  return new Promise(res=>{
    let done=false;
    modal(`<h2>${esc(title)}</h2><label class="f" style="margin-top:12px">${esc(label)}<input class="in" id="mTx" type="${type}" ${inputmode?`inputmode="${inputmode}"`:''} value="${esc(value)}" placeholder="${esc(placeholder)}"></label><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mNo">Cancelar</button><button class="btn" id="mOk">OK</button></div>`,
      {onOpen:o=>{ const i=$('#mTx',o); setTimeout(()=>i.focus(),60);
        const go=()=>{done=true;const v=i.value;closeModal();res(v)};
        i.onkeydown=e=>{ if(e.key==='Enter') go(); };
        $('#mNo',o).onclick=()=>{done=true;closeModal();res(null)}; $('#mOk',o).onclick=go; }});
    modalCloseCb=()=>{ if(!done) res(null); };
  });
}

/* =====================================================================
   CAMADA DE DADOS — Firestore (vários aparelhos) ou local (1 aparelho)
   ===================================================================== */
const Store = {
  mode:'local', fs:null, mem:null, subs:{},
  cfg(){ return LS.get('cvinv_fbcfg') || FIREBASE_CONFIG; },
  async init(){
    const cfg=this.cfg();
    if(cfg && cfg.projectId){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
        if(!firebase.apps.length) firebase.initializeApp(cfg);
        this.fs=firebase.firestore();
        try{ await this.fs.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('persistência offline',e.code); }
        this.mode='cloud';
      }catch(e){ console.error(e); toast('Sem conexão com o Firebase — usando modo local',true); }
    }
    if(this.mode==='local'){
      window.addEventListener('storage',e=>{ if(e.key==='cvinv_db'){ this.mem=null; Object.keys(this.subs).forEach(c=>this._emit(c)); } });
    }
  },
  _db(){ if(!this.mem){ this.mem=LS.get('cvinv_db',{})||{}; } return this.mem; },
  _save(){ try{ localStorage.setItem('cvinv_db',JSON.stringify(this.mem)); }catch(e){ toast('Memória do aparelho cheia',true); } },
  _rows(col,field,val){ const c=this._db()[col]||{}; let r=Object.entries(c).map(([id,d])=>({id,...d})); if(field) r=r.filter(x=>x[field]===val); return r; },
  _emit(col){ (this.subs[col]||[]).forEach(s=>s.cb(this._rows(col,s.field,s.val))); },
  async list(col,field,val){
    if(this.mode==='cloud'){ let q=this.fs.collection(col); if(field) q=q.where(field,'==',val); const s=await q.get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
    return this._rows(col,field,val);
  },
  async get(col,id){
    if(this.mode==='cloud'){ const d=await this.fs.collection(col).doc(id).get(); return d.exists?{id:d.id,...d.data()}:null; }
    const d=(this._db()[col]||{})[id]; return d?{id,...d}:null;
  },
  async set(col,id,data){
    if(this.mode==='cloud'){ this.fs.collection(col).doc(id).set(data,{merge:true}).catch(e=>toast('Erro ao salvar: '+e.code,true)); return id; }
    const db=this._db(); db[col]=db[col]||{}; db[col][id]={...(db[col][id]||{}),...data}; this._save(); this._emit(col); return id;
  },
  async add(col,data){
    if(this.mode==='cloud'){ const ref=this.fs.collection(col).doc(); ref.set(data).catch(e=>toast('Erro ao salvar: '+e.code,true)); return ref.id; } // sem await: funciona offline
    return this.set(col,uid(),data);
  },
  async del(col,id){
    if(this.mode==='cloud'){ this.fs.collection(col).doc(id).delete().catch(e=>toast('Erro ao excluir: '+e.code,true)); return; }
    const db=this._db(); if(db[col]) delete db[col][id]; this._save(); this._emit(col);
  },
  async addMany(col,arr,onProg){
    if(this.mode==='cloud'){
      for(let i=0;i<arr.length;i+=400){ const b=this.fs.batch(); arr.slice(i,i+400).forEach(d=>b.set(this.fs.collection(col).doc(),d)); await b.commit(); onProg&&onProg(Math.min(i+400,arr.length)); }
      return;
    }
    const db=this._db(); db[col]=db[col]||{}; arr.forEach(d=>db[col][uid()]=d); this._save(); this._emit(col);
  },
  async delMany(col,ids){
    if(this.mode==='cloud'){ for(let i=0;i<ids.length;i+=400){ const b=this.fs.batch(); ids.slice(i,i+400).forEach(id=>b.delete(this.fs.collection(col).doc(id))); await b.commit(); } return; }
    const db=this._db(); ids.forEach(id=>{ if(db[col]) delete db[col][id]; }); this._save(); this._emit(col);
  },
  watch(col,cb,field,val){
    if(this.mode==='cloud'){
      let q=this.fs.collection(col); if(field) q=q.where(field,'==',val);
      return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>{ console.error(e); toast('Erro de sincronização: '+e.code,true); });
    }
    const s={cb,field,val}; (this.subs[col]=this.subs[col]||[]).push(s);
    setTimeout(()=>cb(this._rows(col,field,val)),0);
    return ()=>{ this.subs[col]=(this.subs[col]||[]).filter(x=>x!==s); };
  },
  watchDoc(col,id,cb){
    if(this.mode==='cloud') return this.fs.collection(col).doc(id).onSnapshot(d=>cb(d.exists?{id:d.id,...d.data()}:null));
    const s={cb:rows=>cb(rows.find(r=>r.id===id)||null)}; (this.subs[col]=this.subs[col]||[]).push(s);
    setTimeout(()=>s.cb(this._rows(col)),0);
    return ()=>{ this.subs[col]=(this.subs[col]||[]).filter(x=>x!==s); };
  }
};

function indexProdutos(){
  S.idxEan=new Map(); S.idxCod=new Map();
  S.produtos.forEach(p=>{ if(p.ean) String(p.ean).split(/[;,\s]+/).forEach(e=>{ const k=eanKey(e); if(k) S.idxEan.set(k,p); }); if(p.codigo) S.idxCod.set(norm(p.codigo),p); });
}
function findExact(code){
  const c=String(code||'').trim(); if(!c) return null;
  return S.idxEan.get(eanKey(c)) || S.idxCod.get(norm(c)) || null;
}
function search(q,limit=40){
  const n=norm(q); if(!n) return [];
  const words=n.split(/\s+/);
  const out=[];
  for(const p of S.produtos){
    const hay=p._h || (p._h=norm(p.descricao)+' '+norm(p.codigo)+' '+String(p.ean||'')+' '+norm(p.grupo)+' '+norm(p.subgrupo));
    if(words.every(w=>hay.includes(w))){ out.push(p); if(out.length>=limit) break; }
  }
  return out;
}

/* ---------------- cálculo do inventário ---------------- */
const GSEM='SEM GRUPO';
const gLbl=p=>(p.grupo||GSEM)+(p.subgrupo?' › '+p.subgrupo:'');
const byGrupo=(a,b)=>((a.grupo?0:1)-(b.grupo?0:1))||String(a.grupo||'').localeCompare(String(b.grupo||''),'pt-BR')||String(a.subgrupo||'').localeCompare(String(b.subgrupo||''),'pt-BR')||String(a.descricao).localeCompare(String(b.descricao),'pt-BR');
function grupos(list){ const m=new Map(); list.forEach(p=>{ const g=p.grupo||GSEM; if(!m.has(g)) m.set(g,new Map()); const sm=m.get(g); const sg=p.subgrupo||''; sm.set(sg,(sm.get(sg)||0)+1); });
  return [...m.entries()].sort((a,b)=>(a[0]===GSEM)-(b[0]===GSEM)||a[0].localeCompare(b[0],'pt-BR')).map(([g,sm])=>({g,n:[...sm.values()].reduce((x,y)=>x+y,0),subs:[...sm.keys()].filter(Boolean).sort((a,b)=>a.localeCompare(b,'pt-BR'))})); }
function calc(){ return calcFrom(S.produtos,S.lanc); }
function calcFrom(produtos,lanc){
  const map=new Map();
  produtos.forEach(p=>map.set(String(p.codigo),{codigo:String(p.codigo),descricao:p.descricao,ean:p.ean||'',unidade:p.unidade||'',grupo:p.grupo||'',subgrupo:p.subgrupo||'',custo:Number(p.custo)||0,estoque:Number(p.estoque)||0,novo:!!p.novo,c:[0,0,0],n:[0,0,0]}));
  lanc.forEach(l=>{
    let r=map.get(String(l.codigo));
    if(!r){ r={codigo:String(l.codigo),descricao:l.descricao||'(sem cadastro)',ean:'',unidade:l.unidade||'',grupo:'',subgrupo:'',custo:0,estoque:0,novo:true,c:[0,0,0],n:[0,0,0]}; map.set(r.codigo,r); }
    const i=(l.rodada||1)-1; r.c[i]=r3(r.c[i]+Number(l.qtd||0)); r.n[i]++;
  });
  const rows=[...map.values()].map(r=>{
    const d12=!eq(r.c[0],r.c[1]);
    let final=null,status;
    if(!d12){ final=r.c[0]; status='ok'; }
    else if(r.n[2]>0){ final=r.c[2]; status='3a'; }
    else status='pendente';
    const dif= final==null?null:r3(final-r.estoque);
    return {...r,d12,final,status,dif};
  }).sort(byGrupo);
  const t={
    itens:rows.length, div12:rows.filter(r=>r.d12).length, pend:rows.filter(r=>r.status==='pendente').length,
    ent:rows.filter(r=>r.dif>0.0004), sai:rows.filter(r=>r.dif<-0.0004), novos:rows.filter(r=>r.novo).length,
    semDif:rows.filter(r=>r.dif!=null && eq(r.dif,0)).length
  };
  t.qEnt=r3(t.ent.reduce((s,r)=>s+r.dif,0)); t.qSai=r3(t.sai.reduce((s,r)=>s-r.dif,0));
  t.vEnt=Math.round(t.ent.reduce((s,r)=>s+r.dif*r.custo,0)*100)/100; t.vSai=Math.round(t.sai.reduce((s,r)=>s-r.dif*r.custo,0)*100)/100;
  return {rows,t};
}
function roundStats(rod){
  const L=S.lanc.filter(l=>l.rodada===rod);
  const itens=new Set(L.map(l=>String(l.codigo)));
  const pessoas={};
  L.forEach(l=>{ pessoas[l.contador||'?']=(pessoas[l.contador||'?']||0)+1; });
  return {lanc:L.length,itens:itens.size,pessoas};
}

      <div class="row"><div class="round-dot" style="background:var(--navy)">${esc((e.fantasia||e.razao||'?').slice(0,1).toUpperCase())}</div>
      <div style="flex:1;min-width:0"><h3>${esc(e.fantasia||e.razao)}</h3><div class="sub">${esc(e.razao||'')}${e.cnpj?' · '+esc(e.cnpj):''}</div></div></div>

};
function empresaForm(e={},depois){
  const f=(k,l,t='text',ph='',extra='')=>`<label class="f">${l}<input class="in" name="${k}" type="${t}" value="${esc(e[k]||'')}" placeholder="${ph}" ${extra}></label>`;
  modal(`<h2>${e.id?'Editar empresa':'Nova empresa'}</h2>
    <div class="card" style="margin-top:10px;background:var(--gray)"><div class="row" style="align-items:flex-end">
      <label class="f" style="flex:1;min-width:200px">CNPJ<input class="in" id="eCnpj" inputmode="numeric" maxlength="18" autocomplete="off" placeholder="00.000.000/0000-00" value="${esc(mascaraCnpj(e.cnpj||''))}"></label>
      <button type="button" class="btn" id="eBusca">🔎 Buscar dados</button>
      <button type="button" class="btn sec" id="eCart">📄 Ler cartão CNPJ (PDF)</button><input type="file" id="eCartF" accept="application/pdf,.pdf" hidden></div>
      <div class="small muted" id="eMsg" style="margin-top:6px">Digite o CNPJ: ao completar os 14 números, razão social, nome fantasia, endereço e contato são preenchidos sozinhos.</div></div>
    <form id="fEmp" class="fgrid" style="margin-top:12px">
    ${f('fantasia','Nome fantasia *','text','Mercado Exemplo','required')}${f('razao','Razão social')}
    ${f('endereco','Endereço')}${f('bairro','Bairro')}${f('cidade','Cidade')}${f('uf','UF','text','PB','maxlength="2"')}${f('cep','CEP','text','','inputmode="numeric"')}
    ${f('telefone','Telefone','tel')}${f('email','E-mail','email')}${f('responsavel','Responsável')}
    ${e.id?'':f('pin','Seu PIN de gestor (4 a 6 números) *','password','••••','inputmode="numeric" pattern="\\d{4,6}" required')}
    ${e.id?'':'<div class="hint" style="grid-column:1/-1">Você será o primeiro gestor. Depois, no Painel → Usuários, cadastre os outros gestores e os contadores, cada um com o seu PIN.</div>'}
    <div class="row" style="grid-column:1/-1;justify-content:flex-end"><button type="button" class="btn sec" id="cEmp">Cancelar</button><button class="btn">Salvar</button></div></form>`,
  {onOpen:o=>{
    const msg=(t,err)=>{ const m=$('#eMsg',o); m.innerHTML=t; m.style.color=err?'var(--red)':''; };
    const preenche=d=>{ const F=$('#fEmp',o); Object.entries(d).forEach(([k,v])=>{ const i=F.querySelector(`[name=${k}]`); if(i && v && (!i.value||k!=='responsavel')) i.value=v; }); if(!F.querySelector('[name=fantasia]').value && d.razao) F.querySelector('[name=fantasia]').value=tit(d.razao); };
    const busca=async(cnpj)=>{ const c=String(cnpj||$('#eCnpj',o).value).replace(/\D/g,'');
      if(!cnpjValido(c)) return msg('CNPJ inválido — confira os números.',true);
      $('#eCnpj',o).value=cnpjFmt(c); msg('Buscando dados na Receita…');
      const d=await buscarCnpj(c);
      if(!d) return msg('Não consegui buscar agora (sem internet ou serviço fora do ar). Preencha à mão.',true);
      preenche({...d,cep:mascaraCep(d.cep),telefone:mascaraFone(d.telefone)}); msg(`✓ Dados preenchidos${d.situacao?' · situação: <b>'+esc(d.situacao)+'</b>':''}. Confira antes de salvar.`); };
    $('#eBusca',o).onclick=()=>busca();
    let ultimo='';
    aplicaMascara($('#eCnpj',o),mascaraCnpj,v=>{ const d=v.replace(/\D/g,''); if(d.length===14 && d!==ultimo){ ultimo=d; if(cnpjValido(d)) busca(d); else msg('CNPJ inválido — confira os números.',true); } });
    const fT=$('#fEmp [name=telefone]',o); if(fT){ aplicaMascara(fT,mascaraFone); fT.value=mascaraFone(fT.value); }
    const fC=$('#fEmp [name=cep]',o); if(fC){ aplicaMascara(fC,mascaraCep); fC.value=mascaraCep(fC.value); }
    $('#eCnpj',o).onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); busca(); } };
    $('#eCart',o).onclick=()=>$('#eCartF',o).click();
    $('#eCartF',o).onchange=async ev=>{ const file=ev.target.files[0]; ev.target.value=''; if(!file) return; msg('Lendo o cartão CNPJ…');
      try{ const d=await lerCartaoCnpj(file); if(!d) return msg('Não consegui ler o cartão. Digite o CNPJ.',true); $('#eCnpj',o).value=d.cnpj; preenche(d); await busca(d.cnpj); }catch(err){ console.error(err); msg('Não consegui ler o PDF. Digite o CNPJ.',true); } };
    $('#cEmp',o).onclick=closeModal;
    $('#fEmp',o).onsubmit=async ev=>{ ev.preventDefault();
      const d=Object.fromEntries(new FormData(ev.target).entries()); d.uf=(d.uf||'').toUpperCase(); d.cnpj=cnpjFmt($('#eCnpj',o).value);
      if(d.cnpj && !cnpjValido(d.cnpj)) return toast('CNPJ inválido',true);
      const id=e.id||uid();
      if(!e.id){ if(!/^\d{4,6}$/.test(d.pin)) return toast('PIN deve ter de 4 a 6 números',true);
        const u={id:uid(),nome:d.responsavel||'Gestor',pin:d.pin,perfil:'gestor',podeEncerrar:true,criadoEm:now()}; delete d.pin;
        d.usuarios=[u]; d.criadoEm=now(); LS.set('cvinv_me_'+id,u.id); }
      d.atualizadoEm=now();
      await Store.set('empresas',id,d); closeModal(); toast('Empresa salva'); if(depois) depois(); else render(); }; }});
}

  const e=S.empresa; header(e.fantasia||e.razao,'Todos os inventários',{right:'<button class="ic" id="hPainel">📊 Painel</button>'});
  $('#hPainel').onclick=()=>go('painel');

  const invs=(await Store.list('inventarios','empresaId',e.id)).sort((a,b)=>String(b.criadoEm).localeCompare(String(a.criadoEm)));
  app.innerHTML=`<div class="stack">
    <div class="row between"><h1>Inventários</h1><button class="btn" id="nInv">+ Novo inventário</button></div>
    ${invs.length?`<div class="grid">${invs.map(i=>`<div class="card click" data-id="${i.id}">
      <div class="row between"><h3>${esc(i.nome)}</h3>${i.status==='finalizado'?'<span class="badge b-gray">Finalizado</span>':'<span class="badge b-ok">Em contagem</span>'}</div>
      <div class="sub">${dBR(i.data)} · ${fmt(i.totalProdutos||0)} produtos na base</div>
      <div class="row small" style="margin-top:8px;gap:6px">${[1,2,3].map(r=>{const st=(i.rodadas||{})['r'+r]||'bloqueada';return `<span class="badge ${RLBL[st][1]}">${r}ª ${RLBL[st][0].toLowerCase()}</span>`}).join('')}</div></div>`).join('')}</div>`
      :`<div class="card empty"><h2>Nenhum inventário ainda</h2><p>Crie um inventário e importe a planilha de estoque.</p></div>`}</div>`;
  $('#nInv').onclick=async ()=>{ const u=await exigir(ehGestor,'Novo inventário','Só gestores criam inventários'); if(u) novoInventario(); };
  app.querySelectorAll('.card[data-id]').forEach(c=>c.onclick=()=>openInv(invs.find(x=>x.id===c.dataset.id)));
};
function openInv(inv,next='invhome'){
  clearSubs(); S.inv=inv; S.produtos=[]; S.lanc=[]; indexProdutos();
  const P='inventarios/'+inv.id;
  S.unsub.push(Store.watchDoc('inventarios',inv.id,d=>{ if(!d) return; const old=S.inv; S.inv=d;
    if(S.view==='contar' && S.rodada && d.rodadas['r'+S.rodada]!=='aberta'){ toast('O gestor encerrou a '+RNOME[S.rodada]); stopScanner(); S.view='invhome'; S.stack=S.stack.filter(v=>v!=='contar'); render(); return; }
    if(['gestor','confronto','resultado','invhome'].includes(S.view) && JSON.stringify(old)!==JSON.stringify(d)) render(); }));
  S.unsub.push(Store.watch(P+'/produtos',rows=>{ S.produtos=rows; indexProdutos(); refreshLive(); }));
  S.unsub.push(startLancWatch());
  go(next);
}
let lancMode=null;
function startLancWatch(gestor=false){
  const P='inventarios/'+S.inv.id+'/lancamentos';
  lancMode=gestor?'all':'dev';
  return gestor ? Store.watch(P,rows=>{ S.lanc=rows; refreshLive(); })
                : Store.watch(P,rows=>{ S.lanc=rows; refreshLive(); },'device',DEV);
}
function useGestorLanc(){
  if(lancMode==='all') return;
  const i=S.unsub.length-1; try{ S.unsub[i](); }catch(e){}
  S.unsub[i]=startLancWatch(true);
}
let liveT=null;
function refreshLive(){ clearTimeout(liveT); liveT=setTimeout(()=>{ if(['contar','gestor','confronto','resultado','lancamentos'].includes(S.view)) (V[S.view+'_refresh']||V[S.view])(); },150); }

  const R=i.rodadas||{};
  const fin=i.status==='finalizado';
  $('#app').innerHTML=`<div class="stack">
    ${fin?'<div class="warnbox">Este inventário foi finalizado. A contagem está encerrada; o relatório continua disponível na área do gestor.</div>':''}
    <div class="grid">
      ${[1,2,3].map(r=>{ const st=R['r'+r]||'bloqueada'; const ok=st==='aberta'&&!fin;
        return `<div class="card"><div class="row"><div class="round-dot" style="background:${ok?'var(--teal)':'#9aa6b2'}">${r}ª</div><div style="flex:1"><h3>${RNOME[r]}</h3><div class="sub">${r<3?'Contagem cega da loja inteira':'Recontagem só dos itens divergentes'}${nomesEscala(i,r).length?' · Escala: '+esc(nomesEscala(i,r).join(', ')):''}</div></div><span class="badge ${RLBL[st][1]}">${RLBL[st][0]}</span></div>
        <button class="btn block big" style="margin-top:12px" data-r="${r}" ${ok?'':'disabled'}>${ok?'Começar a contar':'Indisponível'}</button></div>`; }).join('')}
      <div class="card"><div class="row"><div class="round-dot" style="background:var(--navy)">G</div><div style="flex:1"><h3>Área do gestor</h3><div class="sub">Importar planilha, abrir/fechar contagens, confronto, divergências e relatório</div></div></div>
        <button class="btn dark block big" style="margin-top:12px" id="bGest">Entrar com PIN</button></div>
    </div>
    <div class="hint">Contagem cega: quem conta não vê o estoque do sistema nem o que outra pessoa contou. A 1ª e a 2ª contagens devem ser feitas por pessoas diferentes.</div>
    <div class="row"><span class="spacer"></span><button class="btn ${fin?'':'red'}" id="bEncH">${fin?'Iniciar novo inventário':'Encerrar inventário e iniciar novo'}</button></div></div>`;
  $('#bEncH').onclick=encerrarFluxo;
  $('#app').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>startCount(+b.dataset.r));
  $('#bGest').onclick=gestorLogin;
};
async function startCount(r){
  if(!S.produtos.length && r<3){ const ok=await ask('A planilha de estoque ainda não foi importada. Sem ela, todo produto bipado terá que ser cadastrado na hora. Continuar mesmo assim?',{ok:'Continuar'}); if(!ok) return; }
  const esc_=escalaDe(S.inv,r);
  if(esc_.length && !(S.me && esc_.includes(S.me.id))){ if(!await ask(`A ${RNOME[r]} foi escalada para <b>${esc(nomesEscala(S.inv,r).join(', '))}</b>. Contar mesmo assim?`,{ok:'Contar mesmo assim'})) return; }
  if(S.me){ S.contador=S.me.nome; }
  else { const nome=await askText('Quem está contando?',{label:'Seu nome',value:S.contador,placeholder:'Ex.: Maria'});
    if(!nome||!nome.trim()) return;
    S.contador=nome.trim(); LS.set('cvinv_nome',S.contador); }
  if(r<=2){ const outra=S.lanc.some(l=>l.device===DEV && l.rodada===(r===1?2:1));
    if(outra){ const ok=await ask(`Este aparelho já tem lançamentos na ${RNOME[r===1?2:1]}. Para a contagem ser cega, a ${RNOME[r]} deve ser feita por outra pessoa. Continuar?`,{ok:'Continuar'}); if(!ok) return; } }
  S.rodada=r; S.pend=null; S.lastUm=null; go('contar');
}
async function gestorLogin(){
  const u=await exigir(ehGestor,'Área do gestor','Esse PIN não é de um gestor'); if(!u) return;
  useGestorLanc(); go('gestor');
}

/* ---------- TELA DE CONTAGEM (contador) ---------- */
V.contar = ()=>{
  const r=S.rodada;
  header(RNOME[r],'Contador: '+S.contador);
  const modo=LS.get('cvinv_modo','qtd'), auto=LS.get('cvinv_auto',true);
  const lista3 = r===3 ? `<div class="card"><div class="sec-title"><h2>Itens para recontar</h2><span class="badge b-warn" id="c3n"></span></div>
    <div class="sub">Conte a quantidade total de cada item na loja inteira. Se não encontrar, registre zero.</div><div id="l3" style="margin-top:8px"></div></div>`:'';
  $('#app').innerHTML=`<div class="stack">
    <div class="row" style="gap:8px">
      <div class="seg" id="seg"><button data-m="qtd" class="${modo==='qtd'?'on':''}">Bipar + quantidade</button><button data-m="um" class="${modo==='um'?'on':''}">Cada bipe = 1</button></div>
      <label class="small muted chk" id="autoW" ${modo==='um'?'hidden':''}><input type="checkbox" id="auto" ${auto?'checked':''}> Confirmar ao bipar o próximo</label><label class="small muted chk"><input type="checkbox" id="azoom" ${LS.get('cvinv_autozoom',false)?'checked':''}> Zoom automático</label>
    </div>
    <div class="cam" id="cam">
      <video id="vid" playsinline muted autoplay></video>
      <div class="guide" id="guide"><i></i><i></i><i></i><i></i><div class="laser"></div></div>
      <div class="camtools"><button id="bTorch" hidden aria-label="Lanterna">🔦</button><button id="bZoom" hidden>1x</button><button id="bCamOff" aria-label="Desligar câmera">✕</button></div>
      <div class="caminfo" id="camInfo"></div>
      <div class="camoff" id="camOff"><button class="btn" id="bCam">📷 Ligar leitor de código de barras</button><button class="btn ghost" id="bFoto" style="color:#BACAD3;margin-top:6px">📸 ou ler por foto</button><div class="small" style="margin-top:4px">Leitor Bluetooth ou coletor de dados também funcionam: é só bipar.</div></div>
      <input type="file" id="fotoIn" accept="image/*" capture="environment" hidden>
    </div>
    <div class="card fast" id="fast" hidden></div>
    <div class="card">
      <button class="btn dark block" id="bLista" style="margin-bottom:12px">📋 Ver lista de produtos por grupo</button>
      <label class="f">Ou digite o código, o código de barras, parte da descrição ou o grupo
      <input class="in" id="q" autocomplete="off" autocapitalize="off" enterkeyhint="search" placeholder="Ex.: 7891000 ou arroz 5kg"></label>
      <div class="results" id="res"></div>
      <button class="btn sec block" style="margin-top:10px" id="bNovo">+ Produto não está na lista? Cadastrar agora</button>
    </div>
    ${lista3}
    <div class="card" style="padding:0"><div class="row between" style="padding:14px 14px 6px"><h2>Meus lançamentos</h2><span class="badge b-blue" id="myN"></span></div><div id="my"></div></div>
  </div>`;
  $('#seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(S.pend) confirmPending(); LS.set('cvinv_modo',b.dataset.m); S.lastUm=null;
    $('#seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); $('#autoW').hidden=b.dataset.m==='um'; renderFast(); });
  $('#auto').onchange=e=>LS.set('cvinv_auto',e.target.checked);
  $('#azoom').onchange=e=>LS.set('cvinv_autozoom',e.target.checked);
  $('#bCam').onclick=startScanner; $('#bCamOff').onclick=stopScanner;
  $('#bFoto').onclick=()=>$('#fotoIn').click();
  $('#fotoIn').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; lerFoto(f); };
  if(camEnv().inApp) setTimeout(()=>camHelp({name:'INAPP'}),300);
  $('#bTorch').onclick=toggleTorch; $('#bZoom').onclick=cycleZoom;
  const q=$('#q');
  q.oninput=()=>showResults(q.value);
  q.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=q.value.trim(); if(!v) return;
    const p=findExact(v); if(p){ q.value=''; showResults(''); setPending(p,'tecl'); return; }
    const rs=search(v); if(rs.length===1){ q.value=''; showResults(''); setPending(rs[0],'tecl'); return; }
    if(!rs.length){ beep(false); q.value=''; showResults(''); novoProduto(/^\d{6,}$/.test(v)?{ean:v}:{descricao:v}); } } };
  $('#bNovo').onclick=()=>novoProduto({});
  $('#bLista').onclick=abrirLista;
  getDetector().then(warmUp).catch(()=>{});
  renderFast();
  V.contar_refresh();
};
function showResults(v){
  const box=$('#res'); if(!box) return;
  if(!v.trim()){ box.innerHTML=''; return; }
  const rs=search(v,30);
  box.innerHTML = rs.length ? rs.map(p=>`<div class="res" data-c="${esc(p.codigo)}"><div class="d"><b>${esc(p.descricao)}</b><span class="mono">${esc(p.codigo)}${p.ean?' · '+esc(p.ean):''}</span><span class="gtag">${esc(gLbl(p))}</span></div><span class="badge b-gray">${esc(p.unidade||'UN')}</span></div>`).join('')
    : `<div class="empty small">Nada encontrado para “${esc(v)}”.</div>`;
  box.querySelectorAll('.res').forEach(el=>el.onclick=()=>{ const p=S.idxCod.get(norm(el.dataset.c)); $('#q').value=''; box.innerHTML=''; setPending(p,'tecl'); });
}
V.contar_refresh = ()=>{
  const my=$('#my'); if(!my) return;
  const r=S.rodada;
  const mine=S.lanc.filter(l=>l.rodada===r && l.device===DEV).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
  $('#myN').textContent=mine.length+' lançamento(s)';
  my.innerHTML = mine.length ? mine.slice(0,200).map(l=>`<div class="lanc"><div class="d"><b>${esc(l.descricao)}</b><span class="small muted mono">${esc(l.codigo)} · ${new Date(l.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="q">${fmt(l.qtd)} <small class="muted">${esc(l.unidade||'')}</small></div><button class="x" data-del="${l.id}" aria-label="Excluir">✕</button></div>`).join('')
    : '<div class="empty small">Nenhum lançamento ainda. Bipe ou busque um produto.</div>';
  my.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ const l=mine.find(x=>x.id===b.dataset.del); if(await ask(`Excluir o lançamento de ${fmt(l.qtd)} ${esc(l.unidade||'')} de <b>${esc(l.descricao)}</b>?`,{ok:'Excluir',danger:true,title:'Excluir lançamento'})){ Store.del('inventarios/'+S.inv.id+'/lancamentos',l.id); toast('Lançamento excluído'); } });
  if(r===3){
    const l3=$('#l3'); const div=S.inv.divergentes||[];
    const done=new Set(S.lanc.filter(l=>l.rodada===3 && l.device===DEV).map(l=>String(l.codigo)));
    $('#c3n').textContent=`${div.filter(c=>done.has(String(c))).length} de ${div.length}`;
    l3.innerHTML = div.map(c=>{ const p=S.idxCod.get(norm(c))||{codigo:c,descricao:'(produto)'}; const ok=done.has(String(c));
      return `<div class="res" data-c3="${esc(c)}" style="${ok?'opacity:.55':''}"><div class="d"><b>${ok?'✓ ':''}${esc(p.descricao)}</b><span class="mono">${esc(p.codigo)}${p.ean?' · '+esc(p.ean):''}</span></div><button class="btn sec" style="min-height:36px;padding:6px 10px" data-zero="${esc(c)}">Zero</button></div>`; }).join('') || '<div class="empty small">Nenhum item para recontar.</div>';
    l3.querySelectorAll('[data-c3]').forEach(el=>el.onclick=e=>{ if(e.target.dataset.zero!=null) return; const p=S.idxCod.get(norm(el.dataset.c3)); if(p) setPending(p,'tecl'); });

function jaLancado(p){ return r3(S.lanc.filter(l=>l.rodada===S.rodada && l.device===DEV && String(l.codigo)===String(p.codigo)).reduce((s,l)=>s+Number(l.qtd||0),0)); }
function setPending(p,src='tecl'){
  if(!p) return;
  if(S.rodada===3 && !(S.inv.divergentes||[]).map(String).includes(String(p.codigo))){ beep(false); toast('Este item não está na lista da 3ª contagem',true); return; }

    const tot=jaLancado(p)+1;
    Promise.resolve(lancar(p,1,true)).then(id=>{ S.lastUm={p,id,tot}; renderFast(); });

  }
  if(S.pend && String(S.pend.p.codigo)===String(p.codigo)){ S.pend.q=r3(S.pend.q+1); renderFast(); flashQty(); return; }
  if(S.pend){ if(LS.get('cvinv_auto',true)) confirmPending(); else { S.pend=null; } }

  } else if(S.lastUm && LS.get('cvinv_modo','qtd')==='um'){

    $('#fU',el).onclick=()=>{ if(S.lastUm && S.lastUm.id){ Store.del('inventarios/'+S.inv.id+'/lancamentos',S.lastUm.id); toast('Último bipe desfeito'); } S.lastUm=null; renderFast(); };
  } else { el.hidden=true; el.innerHTML=''; }

/* =====================================================================
   LEITOR DE CÓDIGO DE BARRAS — rápido
   1) Usa o leitor nativo do aparelho (BarcodeDetector / ML Kit no Android).
   2) Onde não existe (iPhone), usa ZXing-C++ compilado em WebAssembly.
   3) Lê só a faixa central da imagem, só formatos de varejo, com foco contínuo,
      lanterna e zoom; valida o dígito verificador do EAN para não ler errado.
   ===================================================================== */
const FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];
let DET=null, DET_KIND='';
async function getDetector(){
  if(DET) return DET;
  try{
    if('BarcodeDetector' in window){
      const sup=await window.BarcodeDetector.getSupportedFormats();
      const f=FORMATS.filter(x=>sup.includes(x));
      if(f.includes('ean_13')){ DET=new window.BarcodeDetector({formats:f}); DET_KIND='nativo'; return DET; }
    }
  }catch(e){}
  // 1º tenta o leitor que vai junto com o app (pasta libs); se não estiver no servidor, busca na internet (jsDelivr)
  let local=!!window.BarcodeDetectionAPI;
  if(!local){ try{ await loadScript('https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/ponyfill.js'); }catch(e){} }
  const API=window.BarcodeDetectionAPI;
  if(!API) throw new Error('Leitor não carregou (pasta libs ausente e sem internet)');
  let wasmLocal=false;
  try{ const r=await fetch(new URL('libs/zxing_reader.wasm',location.href).href,{method:'HEAD',cache:'no-store'}); wasmLocal=r.ok; }catch(e){}
  if(wasmLocal){ try{ API.setZXingModuleOverrides({locateFile:(path,prefix)=>path.endsWith('.wasm')?new URL('libs/zxing_reader.wasm',location.href).href:prefix+path}); }catch(e){} }
  else console.warn('libs/zxing_reader.wasm não encontrado no servidor — usando o da internet');
  DET=new API.BarcodeDetector({formats:FORMATS}); DET_KIND='ZXing';
  return DET;
}
let warmed=false;
async function warmUp(d){ if(warmed) return; warmed=true; try{ const c=document.createElement('canvas'); c.width=c.height=16; await d.detect(c); }catch(e){} }
function gtinOk(s){ if(!/^\d{8,14}$/.test(s)) return false; const d=s.split('').map(Number); const chk=d.pop(); let sum=0; d.reverse().forEach((n,i)=>sum+=n*(i%2===0?3:1)); return (10-sum%10)%10===chk; }
const Cam={stream:null,track:null,on:false,cv:null,cx:null,caps:{},zoom:1,torch:false,last:{c:'',t:0},ms:0};
function camEnv(){
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const inApp=/FBAN|FBAV|Instagram|WhatsApp|Telegram|Line\/|LinkedInApp|GSA\//i.test(ua);
  const standalone=window.navigator.standalone===true || matchMedia('(display-mode: standalone)').matches;
  return {ios,inApp,standalone};
}
function camHelp(err){
  const {ios,inApp}=camEnv();
  const name=(err&&err.name)||String(err||'');
  let motivo='', passos='';
  if(!window.isSecureContext){ motivo='O app não está aberto num endereço seguro (https).'; passos='Abra pelo link https:// do GitHub Pages, não pelo arquivo baixado.'; }
  else if(inApp){ motivo='O app foi aberto dentro do WhatsApp, Instagram ou outro app, que bloqueiam a câmera.'; passos='Toque nos três pontinhos ou no ícone de compartilhar e escolha <b>Abrir no Safari</b> (ou no Chrome).'; }
  else if(name==='LEITOR'){ motivo='O leitor de código de barras não carregou.'; passos='Confira se a pasta <b>libs</b> foi enviada ao GitHub junto com os outros arquivos e recarregue a página.'; }
  else if(name==='NotAllowedError'||name==='SecurityError'){
    motivo='A permissão da câmera foi negada.';
    passos= ios ? `<ol style="padding-left:18px;margin:6px 0">
      <li>No Safari, toque em <b>aA</b> (ou no ícone à esquerda do endereço) → <b>Ajustes do Site</b> → <b>Câmera</b> → <b>Permitir</b>.</li>
      <li>Se não aparecer: <b>Ajustes</b> do iPhone → <b>Apps</b> → <b>Safari</b> → <b>Câmera</b> → <b>Perguntar</b> ou <b>Permitir</b>.</li>
      <li>Se ainda bloquear: <b>Ajustes → Tempo de Uso → Restrições de Conteúdo e Privacidade → Apps Permitidos</b> e verifique se a <b>Câmera</b> está ligada.</li>
      <li>Com o app instalado na Tela de Início, o iPhone pode perguntar de novo: toque em <b>Permitir</b>.</li></ol>`
      : 'Toque no cadeado ao lado do endereço → <b>Permissões</b> → <b>Câmera</b> → <b>Permitir</b>. Depois recarregue.';
  }
  else if(name==='NotReadableError'||name==='AbortError'){ motivo='A câmera está sendo usada por outro app.'; passos='Feche o app da câmera, o WhatsApp ou chamadas de vídeo e tente de novo.'; }
  else if(name==='NotFoundError'||name==='OverconstrainedError'){ motivo='Não encontrei uma câmera traseira disponível.'; passos='Tente de novo; se persistir, use a leitura por foto.'; }
  else if(name==='SEM_API'){ motivo='Este navegador não libera a câmera para páginas.'; passos= ios?'Abra no <b>Safari</b> (iOS 14.3 ou mais novo).':'Abra no <b>Chrome</b>.'; }
  else { motivo='Não foi possível abrir a câmera.'; passos='Tente de novo ou use a leitura por foto.'; }
  modal(`<h2>Câmera indisponível</h2><p>${motivo}</p><div class="hint" style="margin-top:8px">${passos}</div>
    <p class="small muted" style="margin-top:10px">Código técnico: <span class="mono">${esc(name||'?')}</span>${err&&err.message?' · '+esc(err.message):''}</p>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="hcF" style="flex:1">📸 Ler por foto</button><button class="btn" id="hcT" style="flex:1">Tentar de novo</button></div>`,
  {onOpen:o=>{ $('#hcT',o).onclick=()=>{ closeModal(); startScanner(); }; $('#hcF',o).onclick=()=>{ closeModal(); $('#fotoIn').click(); }; }});
}
async function startScanner(){
  const btn=$('#bCam');
  const reset=()=>{ if(btn){ btn.disabled=false; btn.textContent='📷 Ligar leitor de código de barras'; } };
  if(!window.isSecureContext) return camHelp({name:'INSEGURO'});
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camHelp({name:'SEM_API'});
  if(btn){ btn.disabled=true; btn.textContent='Abrindo câmera…'; }
  // 1) pede a câmera primeiro (no iPhone o pedido precisa sair logo após o toque)
  let st=null;
  const tries=[
    {audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},
    {audio:false,video:{facingMode:'environment'}},
    {audio:false,video:true}
  ];
  let lastErr=null;
  for(const c of tries){
    try{ st=await navigator.mediaDevices.getUserMedia(c); break; }
    catch(e){ lastErr=e; if(e.name==='NotAllowedError'||e.name==='SecurityError') break; }
  }
  if(!st){ reset(); console.error(lastErr); return camHelp(lastErr); }
  if(S.view!=='contar' || !$('#vid')){ st.getTracks().forEach(t=>t.stop()); return; }
  // 2) depois carrega o leitor
  try{ const det=await getDetector(); warmUp(det); }
  catch(e){ st.getTracks().forEach(t=>t.stop()); reset(); return camHelp({name:'LEITOR',message:e.message}); }
  Cam.stream=st; Cam.track=st.getVideoTracks()[0];
  const v=$('#vid'); v.setAttribute('playsinline',''); v.muted=true; v.srcObject=st;
  try{ await v.play(); }catch(e){}
  Cam.caps=Cam.track.getCapabilities?Cam.track.getCapabilities():{};
  if(Cam.caps.focusMode && Cam.caps.focusMode.includes('continuous')){ try{ await Cam.track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){} }

/* plano B: ler o código a partir de uma foto (funciona mesmo quando a câmera ao vivo é bloqueada) */
async function lerFoto(file){
  if(!file) return;
  let det; try{ det=await getDetector(); }catch(e){ return camHelp({name:'LEITOR',message:e.message}); }
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
    const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
    for(const rot of [0,90]){
      const s=Math.min(1,1800/Math.max(img.width,img.height)); const w=Math.round(img.width*s), h=Math.round(img.height*s);
      if(rot){ c.width=h; c.height=w; x.translate(h/2,w/2); x.rotate(Math.PI/2); x.drawImage(img,-w/2,-h/2,w,h); x.setTransform(1,0,0,1,0,0); }
      else { c.width=w; c.height=h; x.drawImage(img,0,0,w,h); }
      const res=await det.detect(c);
      const b=res.find(b=>b.rawValue && (!['ean_13','ean_8','upc_a'].includes(b.format) || gtinOk(String(b.rawValue))));
      if(b){ URL.revokeObjectURL(img.src); handleCode(String(b.rawValue),'foto'); return; }
    }
    URL.revokeObjectURL(img.src); beep(false); toast('Não encontrei código de barras na foto. Tente mais perto e com o código reto.',true);
  }catch(e){ console.error(e); toast('Não consegui ler a foto',true); }
}
function nextFrame(v){ return new Promise(res=>{ if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(()=>res()); else requestAnimationFrame(()=>res()); }); }
async function scanLoop(v){
  let frame=0;
  Cam.lockUntil=0; Cam.miss=0; Cam.lastHit=performance.now();
  setGuide(null,v);
  while(Cam.on){
    await nextFrame(v);
    if(!Cam.on) break;
    if($('#ov') || v.readyState<2 || !v.videoWidth) continue;
    frame++;
    const vw=v.videoWidth, vh=v.videoHeight, now=performance.now();
    // Estratégia: faixa central na maioria dos quadros (rápido); imagem inteira a cada 3 quadros
    // ou enquanto um código está sendo acompanhado (efeito "vai buscar o código").
    const full = now<Cam.lockUntil || frame%3===0;
    let sx,sy,sw,sh,max;
    if(full){ sx=0; sy=0; sw=vw; sh=vh; max=1600; }
    else { sw=Math.round(vw*0.92); sh=Math.round(Math.min(vh*0.45, vw*0.62)); sx=(vw-sw)/2; sy=(vh-sh)/2; max=1100; }
    const sc=Math.min(1,max/Math.max(sw,sh));
    const cw=Math.round(sw*sc), ch=Math.round(sh*sc);
    if(Cam.cv.width!==cw) Cam.cv.width=cw; if(Cam.cv.height!==ch) Cam.cv.height=ch;
    Cam.cx.drawImage(v,sx,sy,sw,sh,0,0,cw,ch);
    const t0=performance.now();
    let res=[];
    try{ res=await DET.detect(Cam.cv); Cam.stat.frames++; }catch(e){ Cam.stat.err++; Cam.stat.lastErr=String(e&&e.message||e).slice(0,60); continue; }
    const ms=performance.now()-t0; Cam.ms=Cam.ms?Cam.ms*.85+ms*.15:ms;
    let hit=null;
    for(const b of res){
      const c=String(b.rawValue||'').trim(); if(!c) continue;
      if(['ean_13','ean_8','upc_a'].includes(b.format) && !gtinOk(c)) continue;
      hit={c,b}; break;
    }
    if(hit){
      // posição do código na imagem de vídeo
      const bb=boxOf(hit.b);
      const r={x:sx+bb.x/sc, y:sy+bb.y/sc, w:bb.w/sc, h:bb.h/sc};
      Cam.lockUntil=performance.now()+700; Cam.lastHit=performance.now(); Cam.miss=0;
      setGuide(r,v);
      autoZoom(r.w/vw);
      onScan(hit.c);
    } else {
      Cam.miss++;
      if(performance.now()>Cam.lockUntil && Cam.locked) setGuide(null,v);
      if(performance.now()-Cam.lastHit>2500) autoZoom(null);
    }
  }
}
function boxOf(b){
  if(b.cornerPoints && b.cornerPoints.length){ const xs=b.cornerPoints.map(p=>p.x), ys=b.cornerPoints.map(p=>p.y); const x=Math.min(...xs), y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}; }
  const r=b.boundingBox||{x:0,y:0,width:0,height:0}; return {x:r.x,y:r.y,w:r.width,h:r.height};
}
/* move o quadro verde: r = retângulo em pixels do vídeo; null = volta ao centro */
function setGuide(r,v){
  const g=$('#guide'), cam=$('#cam'); if(!g||!cam||!v||!v.videoWidth) return;
  const ew=cam.clientWidth, eh=cam.clientHeight, vw=v.videoWidth, vh=v.videoHeight;
  const k=Math.max(ew/vw,eh/vh), ox=(ew-vw*k)/2, oy=(eh-vh*k)/2;
  let x,y,w,h;
  if(r){
    // código de barras é fino: garante altura mínima e uma margem em volta
    let rh=Math.max(r.h, r.w*0.38), ry=r.y-(rh-r.h)/2;
    const pad=r.w*0.08;
    x=(r.x-pad)*k+ox; y=(ry-pad)*k+oy; w=(r.w+pad*2)*k; h=(rh+pad*2)*k;
    x=Math.max(4,Math.min(x,ew-40)); y=Math.max(4,Math.min(y,eh-30)); w=Math.min(w,ew-x-4); h=Math.min(h,eh-y-4);
    Cam.locked=true; g.classList.add('lock');
  } else {
    w=ew*0.92; h=Math.min(eh*0.45, ew*0.62*(eh/ew)); x=(ew-w)/2; y=(eh-h)/2;
    Cam.locked=false; g.classList.remove('lock');
  }
  g.style.left=x+'px'; g.style.top=y+'px'; g.style.width=w+'px'; g.style.height=h+'px';
}
/* zoom automático (aparelhos que permitem controlar o zoom pelo navegador) */
let zoomBusy=false;
async function autoZoom(frac){
  if(!LS.get('cvinv_autozoom',false) || !Cam.track || !Cam.caps.zoom || Cam.caps.zoom.max<1.8 || zoomBusy) return;
  const zmin=Math.max(1,Cam.caps.zoom.min||1), zmax=Math.min(3,Cam.caps.zoom.max);
  let z=Cam.zoom;
  if(frac==null){ if(Cam.zoom<2 && Cam.miss>45){ z=Math.min(2,zmax); Cam.miss=0; } else if(Cam.zoom>=2 && Cam.miss>90){ z=zmin; Cam.miss=0; } }
  else if(frac<0.22 && Cam.zoom<zmax) z=Math.min(zmax,Cam.zoom*1.5);
  else if(frac>0.75 && Cam.zoom>zmin) z=Math.max(zmin,Cam.zoom/1.5);
  z=Math.round(z*10)/10; if(z===Cam.zoom) return;
  zoomBusy=true;
  try{ await Cam.track.applyConstraints({advanced:[{zoom:z}]}); Cam.zoom=z; const b=$('#bZoom'); if(b) b.textContent=(Math.round(z*10)/10)+'x'; }catch(e){}
  setTimeout(()=>zoomBusy=false,600);
}
function diag(soTexto){
  const inf=$('#camInfo'); const v=$('#vid'); if(!inf||!Cam.on){ clearInterval(Cam.diagT); return; }
  const agora=performance.now();
  if(!soTexto){ Cam.stat.fps=Cam.stat.frames/((agora-Cam.stat.t)/1000); Cam.stat.frames=0; Cam.stat.t=agora; }
  const fps=Cam.stat.fps||0;
  inf.innerHTML=`${Cam.stat.ultimo?`<b>✓ ${esc(Cam.stat.ultimo)}</b><br>`:''}${DET_KIND} · ${v?v.videoWidth+'×'+v.videoHeight:''} · ${fps.toFixed(0)} leituras/s · ${Math.round(Cam.ms||0)} ms · ${esc(Cam.teste)}${Cam.stat.err?` · <span style="color:#ff9b9b">erros: ${Cam.stat.err} (${esc(Cam.stat.lastErr)})</span>`:''}`;
}
/* autoteste: desenha um EAN-13 conhecido e verifica se o leitor deste aparelho decodifica */
async function autoteste(){
  try{
    if(!await carregaJsBarcode()){ Cam.teste='autoteste indisponível'; return; }
    const c=document.createElement('canvas'); JsBarcode(c,'7896006711155',{format:'EAN13',width:3,height:90,margin:20,background:'#fff'});
    const t0=performance.now(); const r=await DET.detect(c); const ok=r.some(x=>x.rawValue==='7896006711155');
    Cam.teste= ok ? `autoteste OK (${Math.round(performance.now()-t0)} ms)` : 'autoteste FALHOU (leitor não decodificou)';
  }catch(e){ Cam.teste='autoteste ERRO: '+String(e&&e.message||e).slice(0,60); }
}
function onScan(code){
  const t=Date.now();
  if(code===Cam.last.c && t-Cam.last.t<1300){ Cam.last.t=t; return; }
  Cam.last={c:code,t};
  const cam=$('#cam'); if(cam){ cam.classList.remove('hit'); void cam.offsetWidth; cam.classList.add('hit'); }
  Cam.stat.ultimo=code; diag(true);
  handleCode(code,'cam');
}
async function toggleTorch(){ if(!Cam.track) return; Cam.torch=!Cam.torch; try{ await Cam.track.applyConstraints({advanced:[{torch:Cam.torch}]}); $('#bTorch').classList.toggle('on',Cam.torch); }catch(e){ toast('Lanterna indisponível',true); } }
async function cycleZoom(){ if(!Cam.track||!Cam.caps.zoom) return; const max=Cam.caps.zoom.max; const opts=[1,2,3].filter(z=>z<=max); const i=opts.indexOf(Math.round(Cam.zoom)); Cam.zoom=opts[(i+1)%opts.length]; try{ await Cam.track.applyConstraints({advanced:[{zoom:Math.max(Cam.caps.zoom.min||1,Cam.zoom)}]}); $('#bZoom').textContent=Cam.zoom+'x'; }catch(e){} }

/* leitor Bluetooth / coletor de dados (modo teclado): digita muito rápido e termina com Enter */
const WEDGE={buf:'',t:0,target:null,before:''};
document.addEventListener('keydown',e=>{
  if(S.view!=='contar' || $('#ov')) return;
  const t=performance.now();
  if(e.key==='Enter'){
    const isScan=WEDGE.buf.length>=6 && (t-WEDGE.t)<80;
    const code=WEDGE.buf; WEDGE.buf='';
    if(isScan && (WEDGE.target===$('#fQ') || !WEDGE.target || WEDGE.target.id!=='q')){
      e.preventDefault(); e.stopPropagation();
      // se a pessoa digitou algo logo antes do bipe, separa o código do que foi digitado
      let c=code, pre='';
      if(!findExact(c)){ for(const n of [13,12,14,8]){ const tail=code.slice(-n); if(code.length>n && gtinOk(tail) && findExact(tail)){ c=tail; pre=code.slice(0,-n); break; } } }
      const tg=WEDGE.target;
      if(tg && 'value' in tg){ tg.value=WEDGE.before+pre; if(tg.id==='fQ' && S.pend && tg.value.trim()!=='') S.pend.q=parseNum(tg.value); }
      handleCode(c,'leitor');
    }
    return;
  }
  if(e.key.length!==1 || e.ctrlKey || e.metaKey || e.altKey) return;
  if(t-WEDGE.t>45 || !WEDGE.buf){ WEDGE.buf=''; WEDGE.target=e.target; WEDGE.before=(e.target && 'value' in e.target)?e.target.value:''; }
  WEDGE.buf+=e.key; WEDGE.t=t;
},true);

function mapping(rows,fname){
  const head=rows[0].map(h=>String(h).trim());
  const auto={}; const used=new Set();
  COLS.forEach(([k,,re])=>{ const i=head.findIndex((h,ix)=>!used.has(ix) && re.test(norm(h))); if(i>=0){ auto[k]=i; used.add(i); } });
  const opts=sel=>`<option value="">— não tem —</option>`+head.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h||'Coluna '+(i+1))}</option>`).join('');
  const box=$('#map');
  box.innerHTML=`<div class="card stack"><h2>Conferir colunas — ${esc(fname)}</h2><div class="small muted">${fmt(rows.length-1)} linhas encontradas. Confirme qual coluna é cada informação.</div>
    <div class="fgrid">${['codigo','descricao','ean','estoque','unidade','grupo','subgrupo','custo'].map(k=>COLS.find(c=>c[0]===k)).map(([k,l])=>`<label class="f">${l}${k==='codigo'||k==='descricao'?' *':''}<select class="in" data-k="${k}">${opts(auto[k])}</select></label>`).join('')}</div>
    <div id="prev"></div><div class="row"><span class="spacer"></span><button class="btn" id="bImp">Importar produtos</button></div></div>`;
  const get=()=>{ const m={}; box.querySelectorAll('[data-k]').forEach(s=>m[s.dataset.k]=s.value===''?null:+s.value); return m; };
  const build=()=>{ const m=get(); const out=[]; const seen=new Set(); let dup=0, vaz=0;
    rows.slice(1).forEach(r=>{ const cod=m.codigo!=null?codeStr(r[m.codigo]):''; const desc=m.descricao!=null?String(r[m.descricao]).trim():'';
      if(!cod||!desc){ vaz++; return; } const k=norm(cod); if(seen.has(k)){ dup++; return; } seen.add(k);
      out.push({codigo:cod,descricao:desc,ean:m.ean!=null?codeStr(r[m.ean]):'',estoque:m.estoque!=null?r3(parseNum(r[m.estoque])):0,unidade:m.unidade!=null?String(r[m.unidade]).trim().toUpperCase():'UN',grupo:m.grupo!=null?String(r[m.grupo]).trim().toUpperCase():'',subgrupo:m.subgrupo!=null?String(r[m.subgrupo]).trim().toUpperCase():'',custo:m.custo!=null?r3(parseNum(r[m.custo])):0,novo:false}); });
    return {out,dup,vaz}; };
  const prev=()=>{ const {out,dup,vaz}=build();
    $('#prev').innerHTML=`<div class="small ${dup||vaz?'warnbox':'hint'}">${fmt(out.length)} produtos válidos${dup?` · ${dup} código(s) repetido(s) ignorado(s)`:''}${vaz?` · ${vaz} linha(s) sem código ou descrição ignorada(s)`:''}</div>
    <div class="tbl-wrap" style="margin-top:8px"><table class="t"><thead><tr><th>Código</th><th>Descrição</th><th>Cód. barras</th><th class="n">Estoque</th><th>Un</th><th>Grupo</th><th>Subgrupo</th><th class="n">Custo</th></tr></thead><tbody>${out.slice(0,6).map(p=>`<tr><td class="mono">${esc(p.codigo)}</td><td>${esc(p.descricao)}</td><td class="mono">${esc(p.ean)}</td><td class="n">${fmt(p.estoque)}</td><td>${esc(p.unidade)}</td><td>${esc(p.grupo)}</td><td>${esc(p.subgrupo)}</td><td class="n">${p.custo?brl(p.custo):''}</td></tr>`).join('')}</tbody></table></div>`; };
  box.querySelectorAll('[data-k]').forEach(s=>s.onchange=prev); prev();
  $('#bImp').onclick=async()=>{
    const m=get(); if(m.codigo==null||m.descricao==null) return toast('Escolha as colunas de código e descrição',true);
    const {out}=build(); if(!out.length) return toast('Nenhum produto válido',true);
    if(S.lanc.length) return toast('Já existem lançamentos — não é possível substituir',true);
    const btn=$('#bImp'); btn.disabled=true; btn.textContent='Importando…';
    try{
      const col='inventarios/'+S.inv.id+'/produtos';
      if(S.produtos.length){ const ids=(await Store.list(col)).map(p=>p.id); await Store.delMany(col,ids); }
      await Store.addMany(col,out,n=>btn.textContent=`Importando… ${n}/${out.length}`);
      await Store.set('inventarios',S.inv.id,{totalProdutos:out.length,importadoEm:now(),arquivo:fname});
      toast(fmt(out.length)+' produtos importados');
      if(S.stack[S.stack.length-1]==='gestor') back(); else { S.view='invhome'; render(); }
    }catch(err){ console.error(err); toast('Erro ao importar: '+(err.message||err),true); btn.disabled=false; btn.textContent='Importar produtos'; }
  };
}

function resumoGrupos(rows){
  const out=[]; const add=(o,r)=>{ o.itens++; if(r.dif!=null&&eq(r.dif,0)) o.ok++; if(r.d12) o.div++; if(r.status==='pendente') o.pend++; if(r.dif>0.0004) o.ent++; if(r.dif<-0.0004) o.sai++; };
  const z=(g,sub)=>({g,sub,itens:0,ok:0,div:0,pend:0,ent:0,sai:0});
  grupos(rows).forEach(x=>{ const tot=z(x.g,''); const subs=new Map(x.subs.map(sg=>[sg,z(x.g,sg)]));
    rows.filter(r=>(r.grupo||GSEM)===x.g).forEach(r=>{ add(tot,r); if(r.subgrupo&&subs.has(r.subgrupo)) add(subs.get(r.subgrupo),r); });
    out.push(tot); subs.forEach(v=>out.push(v)); });
  return out;
}

/* =====================================================================
   CNPJ — busca automática dos dados (BrasilAPI / CNPJ.ws) e leitura do cartão CNPJ
   ===================================================================== */
function cnpjValido(c){
  c=String(c||'').replace(/\D/g,''); if(c.length!==14 || /^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+=+c[i]*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return calc(12)===+c[12] && calc(13)===+c[13];
}
const cnpjFmt=c=>{ c=String(c||'').replace(/\D/g,''); return c.length===14?c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):c; };
function mascaraCnpj(v){ const d=String(v||'').replace(/\D/g,'').slice(0,14); let o=d.slice(0,2); if(d.length>2) o+='.'+d.slice(2,5); if(d.length>5) o+='.'+d.slice(5,8); if(d.length>8) o+='/'+d.slice(8,12); if(d.length>12) o+='-'+d.slice(12,14); return o; }
function mascaraFone(v){ const d=String(v||'').replace(/\D/g,'').slice(0,11); if(d.length<=2) return d.length?'('+d:''; if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`; if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; }
function mascaraCep(v){ const d=String(v||'').replace(/\D/g,'').slice(0,8); return d.length>5?d.slice(0,5)+'-'+d.slice(5):d; }
function aplicaMascara(inp,fn,onDone){ inp.addEventListener('input',()=>{ const pos=inp.selectionStart, antes=inp.value.length; inp.value=fn(inp.value); const dif=inp.value.length-antes; try{ inp.setSelectionRange(pos+dif,pos+dif); }catch(e){} onDone&&onDone(inp.value); }); }
const tit=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
async function buscarCnpj(cnpj){
  const c=String(cnpj).replace(/\D/g,'');
  try{
    const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+c); if(r.ok){ const j=await r.json();
      return {razao:j.razao_social||'',fantasia:j.nome_fantasia||'',cidade:tit(j.municipio),uf:j.uf||'',telefone:j.ddd_telefone_1||'',email:(j.email||'').toLowerCase(),
        endereco:[[j.descricao_tipo_de_logradouro,j.logradouro].filter(Boolean).join(' '),j.numero].filter(Boolean).join(', '),bairro:tit(j.bairro),cep:j.cep||'',situacao:j.descricao_situacao_cadastral||''}; }
  }catch(e){}
  try{
    const r=await fetch('https://publica.cnpj.ws/cnpj/'+c); if(r.ok){ const j=await r.json(); const e=j.estabelecimento||{};
      return {razao:j.razao_social||'',fantasia:e.nome_fantasia||'',cidade:(e.cidade&&e.cidade.nome)||'',uf:(e.estado&&e.estado.sigla)||'',telefone:(e.ddd1||'')+(e.telefone1||''),email:(e.email||'').toLowerCase(),
        endereco:[[e.tipo_logradouro,e.logradouro].filter(Boolean).join(' '),e.numero].filter(Boolean).join(', '),bairro:e.bairro||'',cep:e.cep||'',situacao:e.situacao_cadastral||''}; }
  }catch(e){}
  return null;
}
async function lerCartaoCnpj(file){
  if(!/pdf/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('Envie o cartão CNPJ em PDF (o que a Receita gera). Foto não dá para ler — digite o CNPJ.',true); return null; }
  if(!window.pdfjsLib){ try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); }catch(e){ toast('Sem internet para ler o PDF',true); return null; } }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let txt=''; for(let i=1;i<=Math.min(pdf.numPages,2);i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); txt+=tc.items.map(x=>x.str).join('\n')+'\n'; }
  const m=txt.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/);
  if(!m){ toast('Não encontrei o CNPJ no PDF',true); return null; }
  const linhas=txt.split('\n').map(s=>s.trim()).filter(Boolean);
  const depois=rot=>{ const i=linhas.findIndex(l=>norm(l).startsWith(norm(rot))); return i>=0?linhas[i+1]||'':''; };
  return {cnpj:m[0],razao:depois('NOME EMPRESARIAL'),fantasia:depois('TÍTULO DO ESTABELECIMENTO').replace(/^\*+$/,''),cidade:tit(depois('MUNICÍPIO')),uf:depois('UF').slice(0,2)};
}

async function encerrarFluxo(){
  const u=await exigir(podeEnc,'Encerrar inventário','Você não tem permissão para encerrar o inventário'); if(!u) return;

  if(inv.status==='finalizado'){ const {rows}=calcFrom(S.produtos,await Store.list('inventarios/'+inv.id+'/lancamentos')); return novoInventario(rows); }
  const L=await Store.list('inventarios/'+inv.id+'/lancamentos');

  if(abertas.length) msg+=`<br><br>⚠ Ainda há contagem aberta (${abertas.map(r=>r+'ª').join(', ')}). Ela será encerrada.`;

async function finalizarInv(inv,rows,t,L,u){
  const R={...(inv.rodadas||{})}; [1,2,3].forEach(r=>{ if(R['r'+r]==='aberta') R['r'+r]='fechada'; });
  const k=await salvarHistorico(inv,rows,t,L);
  await Store.set('inventarios',inv.id,{status:'finalizado',finalizadoEm:now(),finalizadoPor:u?u.nome:'',rodadas:R,kpis:k});
  S.hist=null;
}
function rowsToItens(rows){ return rows.map(r=>({k:r.codigo,d:r.descricao,g:r.grupo,s:r.subgrupo,u:r.unidade,b:r.ean,e:r.estoque,c1:r.c[0],c2:r.c[1],c3:r.n[2]?r.c[2]:null,f:r.final,x:r.dif,v:r.custo||0,nv:r.novo?1:0})); }
async function salvarHistorico(inv,rows,t,L){
  const itens=rowsToItens(rows); const P=1500; let partes=0;
  for(let i=0;i<itens.length||i===0;i+=P){ await Store.set('historico',inv.id+'_'+partes,{empresaId:inv.empresaId,invId:inv.id,parte:partes,dados:JSON.stringify(itens.slice(i,i+P))}); partes++; if(!itens.length) break; }
  const cont={}; (L||[]).forEach(l=>{ cont[l.contador||'?']=(cont[l.contador||'?']||0)+1; });
  return {itens:t.itens,ok:t.semDif,div12:t.div12,pend:t.pend,novos:t.novos,nEnt:t.ent.length,nSai:t.sai.length,qEnt:t.qEnt,qSai:t.qSai,vEnt:t.vEnt,vSai:t.vSai,
    acuracia:t.itens?r3(t.semDif/t.itens*100):0,lanc:(L||[]).length,contadores:cont,partes};
}

async function carregarHist(force){
  if(S.hist && S.hist.emp===S.empresa.id && !force) return S.hist;
  const invs=(await Store.list('inventarios','empresaId',S.empresa.id)).filter(i=>i.status==='finalizado')
    .sort((a,b)=>String(a.data||'').localeCompare(String(b.data||''))||String(a.criadoEm).localeCompare(String(b.criadoEm)));
  const parts=await Store.list('historico','empresaId',S.empresa.id);
  const by={}; parts.forEach(p=>{ (by[p.invId]=by[p.invId]||[]).push(p); });
  for(const inv of invs){
    const np=inv.kpis&&inv.kpis.partes;
    const ps=(by[inv.id]||[]).filter(p=>np==null||p.parte<np).sort((a,b)=>a.parte-b.parte);
    if(!ps.length || !inv.kpis){
      const prods=await Store.list('inventarios/'+inv.id+'/produtos'); const L=await Store.list('inventarios/'+inv.id+'/lancamentos');
      const {rows,t}=calcFrom(prods,L); inv.kpis=await salvarHistorico(inv,rows,t,L); await Store.set('inventarios',inv.id,{kpis:inv.kpis}); inv.itens=rowsToItens(rows);
    } else inv.itens=ps.flatMap(p=>{ try{ return JSON.parse(p.dados); }catch(e){ return []; } });
  }
  S.hist={emp:S.empresa.id,invs}; return S.hist;
}
function barras(dados,{fmtV=v=>fmt(v),cor='var(--teal)',alto=150}={}){
  if(!dados.length) return '<div class="empty small">Sem dados ainda</div>';
  const max=Math.max(...dados.map(d=>Math.abs(d.v)),1); const w=Math.max(28,Math.min(70,Math.floor(640/dados.length)));
  return `<div class="bars" style="height:${alto+44}px">${dados.map(d=>`<div class="bar" style="width:${w}px" title="${esc(d.l)}: ${esc(fmtV(d.v))}"><span class="bv">${esc(fmtV(d.v))}</span><div class="bf" style="height:${Math.max(2,Math.round(Math.abs(d.v)/max*alto))}px;background:${d.c||cor}"></div><span class="bl">${esc(d.l)}</span></div>`).join('')}</div>`;
}

/* =====================================================================
   EXPORTAÇÃO DOS AJUSTES PARA O ERP
   ===================================================================== */
const ERP_CAMPOS={codigo:'Código do produto',ean:'Código de barras',descricao:'Descrição',qtd:'Quantidade do ajuste',unidade:'Unidade',grupo:'Grupo',subgrupo:'Subgrupo',custo:'Custo unitário',valor:'Valor do ajuste',estoque:'Estoque do sistema',contagem:'Contagem final',tipo:'Tipo de movimento (E/S)',data:'Data do inventário',documento:'Documento / nome do inventário',constante:'Texto fixo'};
const ERP_NUM=new Set(['qtd','custo','valor','estoque','contagem']);
const ERP_DEF={formato:'csv',sep:';',dec:',',casas:3,cab:true,codif:'utf8',crlf:true,sinal:'positivo',dataFmt:'dd/mm/aaaa',codE:'E',codS:'S',arquivo:'ajuste_{tipo}_{data}',fixoSemVirgula:false,
  colunas:[{c:'codigo',t:'CODIGO',w:14},{c:'ean',t:'EAN',w:14},{c:'descricao',t:'DESCRICAO',w:40},{c:'qtd',t:'QUANTIDADE',w:12},{c:'unidade',t:'UN',w:3}]};
function erpCfg(){ return {...ERP_DEF,...(S.empresa.erp||{}),colunas:((S.empresa.erp&&S.empresa.erp.colunas)||ERP_DEF.colunas).map(c=>({...c}))}; }
function dataFmt(iso,f){ const [y,m,d]=String(iso||new Date().toISOString().slice(0,10)).slice(0,10).split('-'); return ({'dd/mm/aaaa':`${d}/${m}/${y}`,'aaaa-mm-dd':`${y}-${m}-${d}`,'ddmmaaaa':`${d}${m}${y}`,'aaaammdd':`${y}${m}${d}`,'dd.mm.aaaa':`${d}.${m}.${y}`})[f]||`${d}/${m}/${y}`; }
function erpValor(r,col,tipo,cfg){
  const q=Math.abs(r.dif||0);
  switch(col.c){
    case 'codigo': return r.codigo; case 'ean': return r.ean||''; case 'descricao': return r.descricao||''; case 'unidade': return r.unidade||'';
    case 'grupo': return r.grupo||''; case 'subgrupo': return r.subgrupo||'';
    case 'qtd': return (tipo==='S'&&cfg.sinal==='negativo')?-q:q;
    case 'custo': return r.custo||0; case 'valor': return r3(q*(r.custo||0))*((tipo==='S'&&cfg.sinal==='negativo')?-1:1);
    case 'estoque': return r.estoque; case 'contagem': return r.final;
    case 'tipo': return tipo==='E'?cfg.codE:cfg.codS; case 'data': return dataFmt(S.inv.data,cfg.dataFmt);
    case 'documento': return S.inv.nome||''; case 'constante': return col.fixo||'';
  } return '';
}
function erpNum(v,cfg,fixo){ const c=Math.max(0,Math.min(6,+cfg.casas||0)); let s=Number(v||0).toFixed(c); if(fixo&&cfg.fixoSemVirgula) return s.replace('.',''); return cfg.dec===','?s.replace('.',','):s; }
function erpLinhas(lista,tipo,cfg){
  const fixo=cfg.formato==='fixo';
  const sep=cfg.sep==='tab'?'\t':cfg.sep;
  const linhas=[];
  if(cfg.cab && !fixo) linhas.push(cfg.colunas.map(c=>c.t||c.c).join(sep));
  lista.forEach(r=>{
    const cel=cfg.colunas.map(col=>{
      const v=erpValor(r,col,tipo,cfg); const num=ERP_NUM.has(col.c);
      let s=num?erpNum(v,cfg,fixo):String(v??'');
      if(fixo){ const w=+col.w||10; if(num){ const neg=s.startsWith('-'); s=s.replace('-',''); s=(neg?'-':'')+s.padStart(w-(neg?1:0),'0'); } else s=s.padEnd(w,' '); return s.slice(0,w); }
      if(!num && (s.includes(sep)||s.includes('"')||s.includes('\n'))) s='"'+s.replace(/"/g,'""')+'"';
      return s; });
    linhas.push(fixo?cel.join(''):cel.join(sep));
  });
  return linhas;
}
function bytesAnsi(str){ const map={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
  const out=new Uint8Array(str.length); for(let i=0;i<str.length;i++){ const ch=str[i], c=str.charCodeAt(i); out[i]= c<256&&!(c>=0x80&&c<0xA0) ? c : (map[ch]||0x3F); } return out; }
function baixar(nome,conteudo,mime){
  const blob=conteudo instanceof Blob?conteudo:new Blob([conteudo],{type:mime||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
}
function nomeArquivoErp(cfg,tipo,ext){ const n=(cfg.arquivo||'ajuste_{tipo}_{data}').replace('{tipo}',tipo==='E'?'entrada':'saida').replace('{data}',dataFmt(S.inv.data,'aaaammdd')).replace('{empresa}',S.empresa.fantasia||'').replace(/[^\w\-]+/g,'_'); return n+'.'+ext; }
function exportarErp(tipo){
  const {t}=calc(); const lista=tipo==='E'?t.ent:t.sai; const cfg=erpCfg();
  if(!lista.length) return toast(`Não há itens para ${tipo==='E'?'entrada':'saída'}`,true);
  if(cfg.formato==='xlsx'){
    const aoa=[]; if(cfg.cab) aoa.push(cfg.colunas.map(c=>c.t||c.c));
    lista.forEach(r=>aoa.push(cfg.colunas.map(col=>{ const v=erpValor(r,col,tipo,cfg); return ERP_NUM.has(col.c)?r3(v):v; })));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),tipo==='E'?'Entrada':'Saida'); XLSX.writeFile(wb,nomeArquivoErp(cfg,tipo,'xlsx'));
  } else {
    const txt=erpLinhas(lista,tipo,cfg).join(cfg.crlf?'\r\n':'\n')+(cfg.crlf?'\r\n':'\n');
    const ext=cfg.formato==='fixo'?'txt':(cfg.ext||'csv');
    baixar(nomeArquivoErp(cfg,tipo,ext), cfg.codif==='ansi'?bytesAnsi(txt):'﻿'.slice(cfg.formato==='csv'&&cfg.bom?0:1)+txt, 'text/plain;charset='+(cfg.codif==='ansi'?'windows-1252':'utf-8'));
  }
  toast(`Arquivo de ${tipo==='E'?'entrada':'saída'} gerado (${lista.length} itens)`);
}
