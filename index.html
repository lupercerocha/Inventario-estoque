  topo();
  const head=['Código','Descrição','Grupo','Un','Estoque','Contado','Ajuste'].concat(temCusto?['Custo','Valor']:[]);
  const body=lista.map(r=>[r.codigo,r.descricao,gLbl(r),r.unidade,fmt(r.estoque),fmt(r.final),fmt(Math.abs(r.dif))].concat(temCusto?[brl(r.custo),brl(Math.abs(r.dif)*(r.custo||0))]:[]));
  const qt=r3(lista.reduce((s,r)=>s+Math.abs(r.dif),0)), vt=lista.reduce((s,r)=>s+Math.abs(r.dif)*(r.custo||0),0);
  doc.autoTable({startY:26,theme:'grid',styles:{fontSize:7.5,cellPadding:1.3},headStyles:{fillColor:cor},margin:{left:14,right:14,top:26},head:[head],body,
    foot:[[{content:`Total: ${lista.length} item(ns)`,colSpan:6},fmt(qt)].concat(temCusto?['',brl(vt)]:[])],footStyles:{fillColor:[240,240,240],textColor:20,fontStyle:'bold'},
    columnStyles:{0:{cellWidth:20},2:{cellWidth:30},3:{cellWidth:9},4:{halign:'right',cellWidth:15},5:{halign:'right',cellWidth:15},6:{halign:'right',cellWidth:15,fontStyle:'bold'},7:{halign:'right',cellWidth:17},8:{halign:'right',cellWidth:19}},
    didDrawPage:d=>{ if(d.pageNumber>1) topo(); }});
  let y=doc.lastAutoTable.finalY+24; if(y>H-25){ doc.addPage(); topo(); y=50; }
  doc.setDrawColor(150); doc.setTextColor(70); doc.setFontSize(8.5);
  [['Responsável pelo estoque',14],['Gestor do inventário',110]].forEach(([l,x])=>{ doc.line(x,y,x+80,y); doc.text(l,x+40,y+5,{align:'center'}); });
  const n=doc.internal.getNumberOfPages(); for(let p=1;p<=n;p++){ doc.setPage(p); doc.setFontSize(7.5); doc.setTextColor(120); doc.text('Cultivve Gestão de Projetos · Simplicidade, eficácia e resultado',14,H-7); doc.text(`Página ${p} de ${n}`,W-14,H-7,{align:'right'}); }
  doc.save(fileBase()+(tipo==='E'?'_ajuste_entrada':'_ajuste_saida')+'.pdf');
}
P.erp = async ()=>{
  const b=$('#pBody'); const cfg=erpCfg();
  const sel=(n,opts,v)=>`<select class="in" name="${n}">${opts.map(([k,l])=>`<option value="${k}" ${String(v)===String(k)?'selected':''}>${l}</option>`).join('')}</select>`;
  const colRow=(c,i)=>`<div class="ecol" data-i="${i}"><select class="in" data-f="c">${Object.entries(ERP_CAMPOS).map(([k,l])=>`<option value="${k}" ${c.c===k?'selected':''}>${l}</option>`).join('')}</select>
    <input class="in" data-f="t" placeholder="Título" value="${esc(c.t||'')}"><input class="in" data-f="w" type="number" min="1" placeholder="Larg." value="${esc(c.w||'')}" title="Largura (só no TXT posicional)">
    <input class="in" data-f="fixo" placeholder="Texto fixo" value="${esc(c.fixo||'')}" ${c.c==='constante'?'':'style="visibility:hidden"'}>
    <div class="row" style="gap:4px;flex-wrap:nowrap"><button type="button" class="x" data-up="${i}" style="color:var(--navy)">↑</button><button type="button" class="x" data-dn="${i}" style="color:var(--navy)">↓</button><button type="button" class="x" data-rm="${i}">✕</button></div></div>`;
  b.innerHTML=`<div class="hint">Configure aqui o arquivo que o ERP do cliente importa. O app gera <b>dois arquivos separados</b>: um com o que precisa de <b>entrada</b> e outro com o que precisa de <b>saída</b> de estoque.</div>
  <form id="fErp" class="stack">
    <div class="card"><h3>Formato do arquivo</h3><div class="fgrid" style="margin-top:10px">
      <label class="f">Formato${sel('formato',[['csv','Texto delimitado (CSV/TXT)'],['fixo','TXT posicional (largura fixa)'],['xlsx','Planilha Excel (.xlsx)']],cfg.formato)}</label>
      <label class="f">Separador${sel('sep',[[';','Ponto e vírgula ( ; )'],[',','Vírgula ( , )'],['tab','Tabulação'],['|','Barra vertical ( | )']],cfg.sep)}</label>
      <label class="f">Extensão${sel('ext',[['csv','.csv'],['txt','.txt']],cfg.ext||'csv')}</label>
      <label class="f">Separador decimal${sel('dec',[[',','Vírgula (1,500)'],['.','Ponto (1.500)']],cfg.dec)}</label>
      <label class="f">Casas decimais${sel('casas',[[0,'0'],[1,'1'],[2,'2'],[3,'3'],[4,'4']],cfg.casas)}</label>
      <label class="f">Codificação${sel('codif',[['utf8','UTF-8'],['ansi','ANSI / Windows-1252 (ERPs antigos)']],cfg.codif)}</label>
      <label class="f">Quantidade na saída${sel('sinal',[['positivo','Positiva (ex.: 5)'],['negativo','Negativa (ex.: -5)']],cfg.sinal)}</label>
      <label class="f">Formato da data${sel('dataFmt',[['dd/mm/aaaa','dd/mm/aaaa'],['aaaa-mm-dd','aaaa-mm-dd'],['ddmmaaaa','ddmmaaaa'],['aaaammdd','aaaammdd'],['dd.mm.aaaa','dd.mm.aaaa']],cfg.dataFmt)}</label>
      <label class="f">Código do movimento de entrada<input class="in" name="codE" value="${esc(cfg.codE)}"></label>
      <label class="f">Código do movimento de saída<input class="in" name="codS" value="${esc(cfg.codS)}"></label>
      <label class="f">Nome do arquivo<input class="in" name="arquivo" value="${esc(cfg.arquivo)}"><span class="small muted">use {tipo}, {data}, {empresa}</span></label>
      <div class="stack" style="gap:6px"><label class="chk small"><input type="checkbox" name="cab" ${cfg.cab?'checked':''}> Primeira linha com títulos</label>
        <label class="chk small"><input type="checkbox" name="crlf" ${cfg.crlf?'checked':''}> Quebra de linha Windows (CRLF)</label>
        <label class="chk small"><input type="checkbox" name="fixoSemVirgula" ${cfg.fixoSemVirgula?'checked':''}> TXT posicional sem vírgula (decimais implícitos)</label></div>
    </div></div>
    <div class="card"><div class="row between"><h3>Colunas, na ordem do ERP</h3><button type="button" class="btn sec" id="eAdd">+ Coluna</button></div>
      <div class="ecol head small muted"><span>Campo</span><span>Título</span><span>Largura</span><span>Texto fixo</span><span></span></div>
      <div id="eCols">${cfg.colunas.map(colRow).join('')}</div></div>
    <div class="card"><h3>Prévia — arquivo de saída</h3><pre class="prev" id="ePrev"></pre></div>
    <div class="row"><button type="button" class="btn sec" id="eReset">Voltar ao padrão</button><span class="spacer"></span><button class="btn">Salvar layout</button></div>
  </form>`;
  const ler=()=>{ const f=$('#fErp'); const d=Object.fromEntries(new FormData(f).entries());
    ['cab','crlf','fixoSemVirgula'].forEach(k=>d[k]=!!f.querySelector(`[name=${k}]`).checked); d.casas=+d.casas;
    d.colunas=[...f.querySelectorAll('#eCols .ecol')].map(el=>({c:el.querySelector('[data-f=c]').value,t:el.querySelector('[data-f=t]').value,w:+el.querySelector('[data-f=w]').value||0,fixo:el.querySelector('[data-f=fixo]').value})); return d; };
  const prev=()=>{ const c={...ERP_DEF,...ler()}; const ex=[{codigo:'1002',ean:'7896006741114',descricao:'FEIJAO CARIOCA 1KG',unidade:'UN',grupo:'MERCEARIA',subgrupo:'GRÃOS',estoque:120,final:118,dif:-2,custo:7.49},{codigo:'2001',ean:'',descricao:'TOMATE',unidade:'KG',grupo:'HORTIFRUTI',subgrupo:'LEGUMES',estoque:35.5,final:34.75,dif:-0.75,custo:6.9}];
    const savedInv=S.inv; S.inv=S.inv||{nome:'Inventário exemplo',data:new Date().toISOString().slice(0,10)};
    $('#ePrev').textContent = c.formato==='xlsx' ? '(planilha Excel com as mesmas colunas)\n'+erpLinhas(ex,'S',{...c,formato:'csv',sep:'\t'}).join('\n') : erpLinhas(ex,'S',c).join('\n');
    S.inv=savedInv; };
  const wire=()=>{ const f=$('#fErp');
    f.querySelectorAll('input,select').forEach(x=>{ x.oninput=prev; x.onchange=()=>{ if(x.dataset.f==='c'){ const fx=x.closest('.ecol').querySelector('[data-f=fixo]'); fx.style.visibility=x.value==='constante'?'':'hidden'; } prev(); }; });
    f.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{ x.closest('.ecol').remove(); rewire(); });
    f.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{ const el=x.closest('.ecol'); if(el.previousElementSibling) el.parentNode.insertBefore(el,el.previousElementSibling); rewire(); });
    f.querySelectorAll('[data-dn]').forEach(x=>x.onclick=()=>{ const el=x.closest('.ecol'); if(el.nextElementSibling) el.parentNode.insertBefore(el.nextElementSibling,el); rewire(); }); };
  const rewire=()=>{ wire(); prev(); };
  $('#eAdd').onclick=()=>{ $('#eCols').insertAdjacentHTML('beforeend',colRow({c:'constante',t:'',w:10},Date.now())); rewire(); };
  $('#eReset').onclick=async()=>{ if(await ask('Voltar o layout para o padrão?')){ await Store.set('empresas',S.empresa.id,{erp:null}); S.empresa={...S.empresa,erp:null}; V.painel(); } };
  $('#fErp').onsubmit=async ev=>{ ev.preventDefault(); const d=ler(); if(!d.colunas.length) return toast('Inclua pelo menos uma coluna',true);
    await Store.set('empresas',S.empresa.id,{erp:d}); S.empresa={...S.empresa,erp:d}; toast('Layout do ERP salvo'); };
  rewire();
};

/* ---------- CONFIGURAÇÕES ---------- */
V.config = ()=>{
  header('Configurações','Conexão entre aparelhos');
  const cfg=Store.cfg();
  const link = cfg ? location.origin+location.pathname+'#cfg='+btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))) : '';
  $('#app').innerHTML=`<div class="stack">
    <div class="card stack"><div class="row between"><h2>Firebase (vários celulares)</h2><span class="badge ${Store.mode==='cloud'?'b-ok':'b-warn'}">${Store.mode==='cloud'?'Conectado':'Modo local'}</span></div>
      <div class="small muted">Cole aqui o <b>firebaseConfig</b> do seu projeto (Console do Firebase → Configurações do projeto → Seus apps → Web). Pode colar o trecho inteiro do código.</div>
      <textarea class="in" id="cfgT" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", appId: "..." }'>${cfg?esc(JSON.stringify(cfg,null,2)):''}</textarea>
      <div class="row"><button class="btn" id="cfgS">Salvar e reconectar</button>${LS.get('cvinv_fbcfg')?'<button class="btn sec" id="cfgD">Voltar ao modo local</button>':''}</div></div>
    ${cfg?`<div class="card stack"><h2>Conectar outros celulares</h2><div class="small muted">Envie este link aos contadores (WhatsApp). Ao abrir, o celular já fica conectado à mesma base. Depois é só adicionar à tela inicial.</div>
      <input class="in mono" readonly value="${esc(link)}" id="lnk"><button class="btn sec" id="cp">Copiar link</button></div>`:''}
    <div class="card stack"><h2>Instalar no celular</h2>
      <div class="small"><b>iPhone (Safari):</b> toque em Compartilhar ⬆ → “Adicionar à Tela de Início”.<br><b>Android (Chrome):</b> menu ⋮ → “Instalar app” ou “Adicionar à tela inicial”.</div></div>
    <div class="card small muted">Este aparelho: <span class="mono">${DEV}</span> · versão ${APP_VERSION}</div></div>`;
  $('#cfgS').onclick=()=>{ const c=parseCfg($('#cfgT').value); if(!c) return toast('Não reconheci o firebaseConfig (precisa de apiKey e projectId)',true); LS.set('cvinv_fbcfg',c); toast('Salvo. Reiniciando…'); setTimeout(()=>location.reload(),700); };
  const d=$('#cfgD'); if(d) d.onclick=async()=>{ if(await ask('Desconectar deste Firebase e voltar ao modo local neste aparelho?',{ok:'Voltar ao local'})){ LS.del('cvinv_fbcfg'); location.reload(); } };
  const cp=$('#cp'); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText($('#lnk').value); toast('Link copiado'); }catch(e){ $('#lnk').select(); toast('Selecione e copie o link'); } };
};
function parseCfg(txt){
  txt=String(txt||'');
  try{ const j=JSON.parse(txt); if(j.apiKey&&j.projectId) return j; }catch(e){}
  const o={}; ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{ const m=txt.match(new RegExp(k+'\\s*:\\s*["\\\']([^"\\\']+)["\\\']')); if(m) o[k]=m[1]; });
  return o.apiKey&&o.projectId?o:null;
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
(async function boot(){
  if(location.hash.startsWith('#cfg=')){
    try{ const c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5))))); if(c.apiKey&&c.projectId){ LS.set('cvinv_fbcfg',c); } }catch(e){ console.warn(e); }
    history.replaceState(null,'',location.pathname);
  }
  await Store.init();
  const last=LS.get('cvinv_emp');
  if(last){ const e=await Store.get('empresas',last).catch(()=>null); if(e){ S.empresa=e; S.stack=['empresas']; S.view='inicio'; } }
  render();
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)); }
})();
</script>
