<style>
:root{
  --teal:#3AA094; --teal2:#00AE9C; --teal-soft:#e3f3f1; --navy:#172334; --ink:#000924;
  --gray:#F2F1F1; --line:#dde2e6; --muted:#5d6b7a; --white:#fff;
  --red:#c8463d; --red-soft:#fbe9e7; --amber:#c98a12; --amber-soft:#fdf3dc; --blue:#2c6fb7; --blue-soft:#e6effa;
  --r:12px; --sh:0 1px 2px rgba(23,35,52,.06),0 4px 14px rgba(23,35,52,.06);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--gray);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Chakra Petch","DM Sans",sans-serif;margin:0;color:var(--navy);letter-spacing:.2px}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
.mono{font-family:"JetBrains Mono",monospace;font-size:.92em}
button,input,select{font:inherit;color:inherit}
a{color:var(--teal)}

/* Header */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px}
.top .back{background:rgba(255,255,255,.08);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
.top .logo{height:20px;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-family:"Chakra Petch";font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:#BACAD3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ic{background:rgba(255,255,255,.08);border:0;color:#fff;height:38px;padding:0 12px;border-radius:10px;cursor:pointer;font-size:13px;flex:none}
.modebar{font-size:12px;padding:5px 16px;text-align:center}
.modebar.local{background:var(--amber-soft);color:#7a5408}
.modebar.cloud{background:var(--teal-soft);color:#1d6b62}

main{width:100%;padding:16px 16px calc(28px + var(--safe-b))}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.kpi{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid #e9ecef}
.card.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.click:active{transform:scale(.99)}
.card .sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.dark{background:var(--navy)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--teal);padding:8px 10px;min-height:auto}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

label.f{display:block;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select{margin-top:4px}
input.in,select.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:44px;font-size:16px}
input.in:focus,select.in:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--teal-soft);color:#1d6b62}
.b-warn{background:var(--amber-soft);color:#7a5408}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:#eceff1;color:#4a5866}

.kpi .card{padding:14px}
.kpi .v{font-family:"Chakra Petch";font-size:26px;color:var(--navy);line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid #e9ecef;background:#fff;box-shadow:var(--sh)}
table.t{width:100%;min-width:680px;border-collapse:collapse;font-size:14px}
table.t th{position:sticky;top:0;background:#f7f8f9;text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid #f0f2f4;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.hl td{background:#fffaf0}
.pos{color:#1d7a46;font-weight:700}.neg{color:var(--red);font-weight:700}

.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Leitor */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px}.chk[hidden],[hidden]{display:none!important}
.cam{position:relative;background:#0d1622;border-radius:var(--r);overflow:hidden;height:36vh;min-height:220px;max-height:420px}
.cam video{width:100%;height:100%;object-fit:cover;display:none}
.cam.live video{display:block}
.cam .guide{position:absolute;left:4%;top:27.5%;width:92%;height:45%;display:none;pointer-events:none;transition:left .16s ease-out,top .16s ease-out,width .16s ease-out,height .16s ease-out}
.guide.lock i{border-color:#7CFFB2;border-width:4px}
.guide.lock .laser{display:none}
.guide.lock{background:rgba(124,255,178,.10);border-radius:10px}
.cam.live .guide{display:block}
.guide i{position:absolute;width:26px;height:26px;border:3px solid var(--teal2)}
.guide i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.guide i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.guide i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.guide i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.laser{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 10px #ff4d4d;opacity:.85}
.cam.hit .guide i{border-color:#7CFFB2}
.cam.hit::after{content:"";position:absolute;inset:0;background:rgba(0,174,156,.28);animation:fl .3s forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.camtools{position:absolute;top:10px;right:10px;display:none;gap:8px}
.cam.live .camtools{display:flex}
.camtools button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:15px;cursor:pointer;backdrop-filter:blur(4px)}
.camtools button.on{background:var(--teal)}
.caminfo{position:absolute;left:10px;bottom:8px;right:10px;color:#e8f1f4;font-size:12px;font-family:"JetBrains Mono",monospace;text-shadow:0 1px 2px #000;display:none}
.cam.live .caminfo{display:block}
.camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#BACAD3;text-align:center;padding:18px}
.cam.live .camoff{display:none}
.fast{border:2px solid var(--teal)}
.fast.ok{border-color:#9fd9d1;background:#f4fbfa}
.fast .fd{font-size:16px;display:block}
.qrow{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-top:10px}
.stp{border:1px solid var(--line);background:#fff;border-radius:12px;font-size:28px;font-weight:700;cursor:pointer;color:var(--navy)}
.qty.bump{animation:bp .25s}
@keyframes bp{50%{transform:scale(1.06);background:var(--teal-soft)}}
.results{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.res{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.res:active{background:var(--teal-soft)}
.res .d{flex:1;min-width:0}
.res .d b{display:block;font-weight:600;font-size:14px}
.res .d span{font-size:12px;color:var(--muted)}
.lanc{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #f0f2f4}
.lanc:last-child{border-bottom:0}
.lanc .d{flex:1;min-width:0}
.lanc .d b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc .q{font-family:"Chakra Petch";font-size:18px;color:var(--navy);white-space:nowrap}
.x{border:0;background:#f3f4f5;color:var(--red);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:16px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(9,15,24,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
@media(min-width:700px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:92vh;overflow:auto;animation:up .18s}
@media(min-width:700px){.md{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.qty{font-family:"Chakra Petch";font-size:34px!important;text-align:center;height:68px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;height:44px;font-weight:700;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:80;box-shadow:var(--sh);font-weight:500;max-width:92vw;animation:up .2s}
.toast.err{background:var(--red)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.hint{background:var(--blue-soft);color:#21507f;border-radius:10px;padding:10px 12px;font-size:13px}
.warnbox{background:var(--amber-soft);color:#6d4b07;border-radius:10px;padding:10px 12px;font-size:13px}
.round-dot{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:"Chakra Petch";font-weight:700;color:#fff;background:var(--teal);flex:none}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 6px}
textarea.in{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:"JetBrains Mono",monospace;font-size:12px}
.sec-title{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.sec-title h2{flex:1}
</style>
</head>

/* ---------------- utilidades ---------------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const eq = (a,b)=> Math.abs((a||0)-(b||0)) < 0.0005;
const fmt = n => n==null ? '—' : Number(n).toLocaleString('pt-BR',{maximumFractionDigits:3});
const fmtS = n => n==null ? '—' : (n>0?'+':'')+fmt(n);
const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

const dBR = iso => iso ? new Date(iso+(iso.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR') : '';
const LS = {
  get(k,d=null){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k);}catch(e){} }
};
const DEV = LS.get('cvinv_dev') || (()=>{const d='dv_'+uid(); LS.set('cvinv_dev',d); return d})();
function codeStr(v){
  if(v==null) return '';
  if(typeof v==='number') return Number.isInteger(v)? v.toFixed(0) : String(v);
  let s=String(v).trim();
  if(/^\d+(\.\d+)?e\+\d+$/i.test(s)) s=Number(s).toFixed(0);
  return s;
}
function parseNum(v){
  if(typeof v==='number') return v;
  let s=String(v??'').trim().replace(/\s/g,'');
  if(!s) return 0;
  if(s.includes(',') && s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
const eanKey = s => String(s||'').replace(/\D/g,'').replace(/^0+/,'');
function toast(msg,err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
let actx=null;
function beep(ok=true){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=ok?1100:300; o.connect(g); g.connect(actx.destination); g.gain.value=.08; o.start(); o.stop(actx.currentTime+(ok?.09:.25)); }catch(e){} try{navigator.vibrate&&navigator.vibrate(ok?40:[80,40,80])}catch(e){} }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Falha ao carregar '+src)); document.head.appendChild(s); }); }

/* ---------------- modal ---------------- */
function modal(html,{onOpen,dismiss=true}={}){
  closeModal();
  const ov=document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML=`<div class="md">${html}</div>`;
  if(dismiss) ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
  onOpen && onOpen(ov);
  return ov;
}
let modalCloseCb=null;
function closeModal(){ const o=$('#ov'); if(o){ o.remove(); const cb=modalCloseCb; modalCloseCb=null; cb&&cb(); } }
function ask(msg,{ok='Confirmar',danger=false,title='Confirmar'}={}){
  return new Promise(res=>{
    let done=false;
    modal(`<h2>${esc(title)}</h2><p class="muted">${msg}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mNo">Cancelar</button><button class="btn ${danger?'red':''}" id="mOk">${esc(ok)}</button></div>`,
      {onOpen:o=>{ $('#mNo',o).onclick=()=>{done=true;closeModal();res(false)}; $('#mOk',o).onclick=()=>{done=true;closeModal();res(true)}; }});
    modalCloseCb=()=>{ if(!done) res(false); };
  });
}
function askText(title,{label='',value='',type='text',placeholder='',inputmode=''}={}){
  return new Promise(res=>{
    let done=false;
    modal(`<h2>${esc(title)}</h2><label class="f" style="margin-top:12px">${esc(label)}<input class="in" id="mTx" type="${type}" ${inputmode?`inputmode="${inputmode}"`:''} value="${esc(value)}" placeholder="${esc(placeholder)}"></label><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mNo">Cancelar</button><button class="btn" id="mOk">OK</button></div>`,
      {onOpen:o=>{ const i=$('#mTx',o); setTimeout(()=>i.focus(),60);
        const go=()=>{done=true;const v=i.value;closeModal();res(v)};
        i.onkeydown=e=>{ if(e.key==='Enter') go(); };
        $('#mNo',o).onclick=()=>{done=true;closeModal();res(null)}; $('#mOk',o).onclick=go; }});
    modalCloseCb=()=>{ if(!done) res(null); };
  });
}

/* =====================================================================
   CAMADA DE DADOS — Firestore (vários aparelhos) ou local (1 aparelho)
   ===================================================================== */
const Store = {
  mode:'local', fs:null, mem:null, subs:{},
  cfg(){ return LS.get('cvinv_fbcfg') || FIREBASE_CONFIG; },
  async init(){
    const cfg=this.cfg();
    if(cfg && cfg.projectId){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
        if(!firebase.apps.length) firebase.initializeApp(cfg);
        this.fs=firebase.firestore();
        try{ await this.fs.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('persistência offline',e.code); }
        this.mode='cloud';
      }catch(e){ console.error(e); toast('Sem conexão com o Firebase — usando modo local',true); }
    }
    if(this.mode==='local'){
      window.addEventListener('storage',e=>{ if(e.key==='cvinv_db'){ this.mem=null; Object.keys(this.subs).forEach(c=>this._emit(c)); } });
    }
  },
  _db(){ if(!this.mem){ this.mem=LS.get('cvinv_db',{})||{}; } return this.mem; },
  _save(){ try{ localStorage.setItem('cvinv_db',JSON.stringify(this.mem)); }catch(e){ toast('Memória do aparelho cheia',true); } },
  _rows(col,field,val){ const c=this._db()[col]||{}; let r=Object.entries(c).map(([id,d])=>({id,...d})); if(field) r=r.filter(x=>x[field]===val); return r; },
  _emit(col){ (this.subs[col]||[]).forEach(s=>s.cb(this._rows(col,s.field,s.val))); },
  async list(col,field,val){
    if(this.mode==='cloud'){ let q=this.fs.collection(col); if(field) q=q.where(field,'==',val); const s=await q.get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
    return this._rows(col,field,val);
  },
  async get(col,id){
    if(this.mode==='cloud'){ const d=await this.fs.collection(col).doc(id).get(); return d.exists?{id:d.id,...d.data()}:null; }
    const d=(this._db()[col]||{})[id]; return d?{id,...d}:null;
  },
  async set(col,id,data){
    if(this.mode==='cloud'){ this.fs.collection(col).doc(id).set(data,{merge:true}).catch(e=>toast('Erro ao salvar: '+e.code,true)); return id; }
    const db=this._db(); db[col]=db[col]||{}; db[col][id]={...(db[col][id]||{}),...data}; this._save(); this._emit(col); return id;
  },
  async add(col,data){
    if(this.mode==='cloud'){ const ref=this.fs.collection(col).doc(); ref.set(data).catch(e=>toast('Erro ao salvar: '+e.code,true)); return ref.id; } // sem await: funciona offline
    return this.set(col,uid(),data);
  },
  async del(col,id){
    if(this.mode==='cloud'){ this.fs.collection(col).doc(id).delete().catch(e=>toast('Erro ao excluir: '+e.code,true)); return; }
    const db=this._db(); if(db[col]) delete db[col][id]; this._save(); this._emit(col);
  },
  async addMany(col,arr,onProg){
    if(this.mode==='cloud'){
      for(let i=0;i<arr.length;i+=400){ const b=this.fs.batch(); arr.slice(i,i+400).forEach(d=>b.set(this.fs.collection(col).doc(),d)); await b.commit(); onProg&&onProg(Math.min(i+400,arr.length)); }
      return;
    }
    const db=this._db(); db[col]=db[col]||{}; arr.forEach(d=>db[col][uid()]=d); this._save(); this._emit(col);
  },
  async delMany(col,ids){
    if(this.mode==='cloud'){ for(let i=0;i<ids.length;i+=400){ const b=this.fs.batch(); ids.slice(i,i+400).forEach(id=>b.delete(this.fs.collection(col).doc(id))); await b.commit(); } return; }
    const db=this._db(); ids.forEach(id=>{ if(db[col]) delete db[col][id]; }); this._save(); this._emit(col);
  },
  watch(col,cb,field,val){
    if(this.mode==='cloud'){
      let q=this.fs.collection(col); if(field) q=q.where(field,'==',val);
      return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>{ console.error(e); toast('Erro de sincronização: '+e.code,true); });
    }
    const s={cb,field,val}; (this.subs[col]=this.subs[col]||[]).push(s);
    setTimeout(()=>cb(this._rows(col,field,val)),0);
    return ()=>{ this.subs[col]=(this.subs[col]||[]).filter(x=>x!==s); };
  },
  watchDoc(col,id,cb){
    if(this.mode==='cloud') return this.fs.collection(col).doc(id).onSnapshot(d=>cb(d.exists?{id:d.id,...d.data()}:null));
    const s={cb:rows=>cb(rows.find(r=>r.id===id)||null)}; (this.subs[col]=this.subs[col]||[]).push(s);
    setTimeout(()=>s.cb(this._rows(col)),0);
    return ()=>{ this.subs[col]=(this.subs[col]||[]).filter(x=>x!==s); };
  }
};

const S = {
  view:'empresas', stack:[], empresa:null, inv:null, produtos:[], lanc:[], idxEan:new Map(), idxCod:new Map(),
  unsub:[], contador:LS.get('cvinv_nome',''), rodada:null, gestorOk:{}, scanner:null, scanning:false, lastScan:{c:'',t:0},
  tabRes:'todos', tabLanc:'todas'

function clearSubs(){ S.unsub.forEach(u=>{try{u()}catch(e){}}); S.unsub=[]; }
function go(view,push=true){ if(S.view==='contar' && S.pend) confirmPending(); if(push && S.view!==view){ S.stack.push(S.view); try{history.pushState({v:view},'')}catch(e){} } stopScanner(); S.view=view; render(); window.scrollTo(0,0); }
function backInternal(){ if(S.view==='contar' && S.pend) confirmPending(); stopScanner(); closeModal(); const v=S.stack.pop(); if(!v) return; if(v==='empresas'||v==='inventarios'){ clearSubs(); S.inv=null; lancMode=null; } S.view=v; render(); window.scrollTo(0,0); }
function back(){ if(!S.stack.length) return; try{ history.back(); }catch(e){ backInternal(); } }
window.addEventListener('popstate',()=>{ if(S.stack.length) backInternal(); });

function indexProdutos(){
  S.idxEan=new Map(); S.idxCod=new Map();
  S.produtos.forEach(p=>{ if(p.ean) String(p.ean).split(/[;,\s]+/).forEach(e=>{ const k=eanKey(e); if(k) S.idxEan.set(k,p); }); if(p.codigo) S.idxCod.set(norm(p.codigo),p); });
}
function findExact(code){
  const c=String(code||'').trim(); if(!c) return null;
  return S.idxEan.get(eanKey(c)) || S.idxCod.get(norm(c)) || null;
}
function search(q,limit=40){
  const n=norm(q); if(!n) return [];
  const words=n.split(/\s+/);
  const out=[];
  for(const p of S.produtos){
    const hay=p._h || (p._h=norm(p.descricao)+' '+norm(p.codigo)+' '+String(p.ean||''));
    if(words.every(w=>hay.includes(w))){ out.push(p); if(out.length>=limit) break; }
  }
  return out;
}

/* ---------------- cálculo do inventário ---------------- */
function calc(){
  const map=new Map();
  S.produtos.forEach(p=>map.set(String(p.codigo),{codigo:String(p.codigo),descricao:p.descricao,ean:p.ean||'',unidade:p.unidade||'',estoque:Number(p.estoque)||0,novo:!!p.novo,c:[0,0,0],n:[0,0,0]}));
  S.lanc.forEach(l=>{
    let r=map.get(String(l.codigo));
    if(!r){ r={codigo:String(l.codigo),descricao:l.descricao||'(sem cadastro)',ean:'',unidade:l.unidade||'',estoque:0,novo:true,c:[0,0,0],n:[0,0,0]}; map.set(r.codigo,r); }
    const i=(l.rodada||1)-1; r.c[i]=r3(r.c[i]+Number(l.qtd||0)); r.n[i]++;
  });
  const rows=[...map.values()].map(r=>{
    const d12=!eq(r.c[0],r.c[1]);
    let final=null,status;
    if(!d12){ final=r.c[0]; status='ok'; }
    else if(r.n[2]>0){ final=r.c[2]; status='3a'; }
    else status='pendente';
    const dif= final==null?null:r3(final-r.estoque);
    return {...r,d12,final,status,dif};
  }).sort((a,b)=>String(a.descricao).localeCompare(String(b.descricao),'pt-BR'));
  const t={
    itens:rows.length, div12:rows.filter(r=>r.d12).length, pend:rows.filter(r=>r.status==='pendente').length,
    ent:rows.filter(r=>r.dif>0.0004), sai:rows.filter(r=>r.dif<-0.0004), novos:rows.filter(r=>r.novo).length,
    semDif:rows.filter(r=>r.dif!=null && eq(r.dif,0)).length
  };
  return {rows,t};
}
function roundStats(rod){
  const L=S.lanc.filter(l=>l.rodada===rod);
  const itens=new Set(L.map(l=>String(l.codigo)));
  const pessoas={};
  L.forEach(l=>{ pessoas[l.contador||'?']=(pessoas[l.contador||'?']||0)+1; });
  return {lanc:L.length,itens:itens.size,pessoas};
}

function openInv(inv,next='invhome'){
  clearSubs(); S.inv=inv; S.produtos=[]; S.lanc=[]; indexProdutos();
  const P='inventarios/'+inv.id;
  S.unsub.push(Store.watchDoc('inventarios',inv.id,d=>{ if(!d) return; const old=S.inv; S.inv=d;
    if(S.view==='contar' && S.rodada && d.rodadas['r'+S.rodada]!=='aberta'){ toast('O gestor encerrou a '+RNOME[S.rodada]); stopScanner(); S.view='invhome'; S.stack=S.stack.filter(v=>v!=='contar'); render(); return; }
    if(['gestor','confronto','resultado','invhome'].includes(S.view) && JSON.stringify(old)!==JSON.stringify(d)) render(); }));
  S.unsub.push(Store.watch(P+'/produtos',rows=>{ S.produtos=rows; indexProdutos(); refreshLive(); }));
  S.unsub.push(startLancWatch());
  go(next);
}
let lancMode=null;
function startLancWatch(gestor=false){
  const P='inventarios/'+S.inv.id+'/lancamentos';
  lancMode=gestor?'all':'dev';
  return gestor ? Store.watch(P,rows=>{ S.lanc=rows; refreshLive(); })
                : Store.watch(P,rows=>{ S.lanc=rows; refreshLive(); },'device',DEV);
}
function useGestorLanc(){
  if(lancMode==='all') return;
  const i=S.unsub.length-1; try{ S.unsub[i](); }catch(e){}
  S.unsub[i]=startLancWatch(true);
}
let liveT=null;
function refreshLive(){ clearTimeout(liveT); liveT=setTimeout(()=>{ if(['contar','gestor','confronto','resultado','lancamentos'].includes(S.view)) (V[S.view+'_refresh']||V[S.view])(); },150); }

  $('#app').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>startCount(+b.dataset.r));

async function startCount(r){
  if(!S.produtos.length && r<3){ const ok=await ask('A planilha de estoque ainda não foi importada. Sem ela, todo produto bipado terá que ser cadastrado na hora. Continuar mesmo assim?',{ok:'Continuar'}); if(!ok) return; }

  if(!nome||!nome.trim()) return;
  S.contador=nome.trim(); LS.set('cvinv_nome',S.contador);
  if(r<=2){ const outra=S.lanc.some(l=>l.device===DEV && l.rodada===(r===1?2:1));
    if(outra){ const ok=await ask(`Este aparelho já tem lançamentos na ${RNOME[r===1?2:1]}. Para a contagem ser cega, a ${RNOME[r]} deve ser feita por outra pessoa. Continuar?`,{ok:'Continuar'}); if(!ok) return; } }

}
async function gestorLogin(){

  if(String(pin)!==String(S.empresa.pin)) return toast('PIN incorreto',true);
  S.gestorOk[S.empresa.id]=true; useGestorLanc(); go('gestor');
}

function jaLancado(p){ return r3(S.lanc.filter(l=>l.rodada===S.rodada && l.device===DEV && String(l.codigo)===String(p.codigo)).reduce((s,l)=>s+Number(l.qtd||0),0)); }
function setPending(p,src='tecl'){
  if(!p) return;
  if(S.rodada===3 && !(S.inv.divergentes||[]).map(String).includes(String(p.codigo))){ beep(false); toast('Este item não está na lista da 3ª contagem',true); return; }
  beep(true);
  if(LS.get('cvinv_modo','qtd')==='um'){
    const tot=jaLancado(p)+1;
    Promise.resolve(lancar(p,1,true)).then(id=>{ S.lastUm={p,id,tot}; renderFast(); });
    return;
  }
  if(S.pend && String(S.pend.p.codigo)===String(p.codigo)){ S.pend.q=r3(S.pend.q+1); renderFast(); flashQty(); return; }
  if(S.pend){ if(LS.get('cvinv_auto',true)) confirmPending(); else { S.pend=null; } }
  S.pend={p,q:1,ja:jaLancado(p)};
  renderFast();
  if(src!=='cam'){ const f=$('#fQ'); if(f){ f.focus(); f.select(); } }
  else { const el=$('#fast'); if(el && el.getBoundingClientRect().bottom>innerHeight) el.scrollIntoView({block:'nearest'}); }
}
const openQty=p=>setPending(p,'tecl');

  if(!S.pend) return;

      ${S.pend.ja?`<div class="small muted" style="margin-top:4px">Você já lançou ${fmt(S.pend.ja)} ${esc(un)} deste item nesta contagem — será somado.</div>`:''}
      <div class="qrow"><button class="stp" data-s="-1">−</button><input class="in qty" id="fQ" type="text" inputmode="decimal" autocomplete="off" placeholder="1" value="${S.pend.ed||S.pend.q!==1?esc(fmt(S.pend.q).replace(/\./g,'')):''}"><button class="stp" data-s="1">+</button></div>

    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ const a=Number(b.dataset.a); S.pend.q= a===0?0:r3((S.pend.ed?S.pend.q:0)+a); S.pend.ed=true; f.value=fmt(S.pend.q).replace(/\./g,''); });

function handleCode(code,src){

/* =====================================================================
   LEITOR DE CÓDIGO DE BARRAS — rápido
   1) Usa o leitor nativo do aparelho (BarcodeDetector / ML Kit no Android).
   2) Onde não existe (iPhone), usa ZXing-C++ compilado em WebAssembly.
   3) Lê só a faixa central da imagem, só formatos de varejo, com foco contínuo,
      lanterna e zoom; valida o dígito verificador do EAN para não ler errado.
   ===================================================================== */
const FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];
let DET=null, DET_KIND='';
async function getDetector(){
  if(DET) return DET;
  try{
    if('BarcodeDetector' in window){
      const sup=await window.BarcodeDetector.getSupportedFormats();
      const f=FORMATS.filter(x=>sup.includes(x));
      if(f.includes('ean_13')){ DET=new window.BarcodeDetector({formats:f}); DET_KIND='nativo'; return DET; }
    }
  }catch(e){}
  const API=window.BarcodeDetectionAPI;
  if(!API) throw new Error('Leitor não carregou');
  try{ API.setZXingModuleOverrides({locateFile:(path,prefix)=>path.endsWith('.wasm')?new URL('libs/zxing_reader.wasm',location.href).href:prefix+path}); }catch(e){}
  DET=new API.BarcodeDetector({formats:FORMATS}); DET_KIND='ZXing';
  return DET;
}
let warmed=false;
async function warmUp(d){ if(warmed) return; warmed=true; try{ const c=document.createElement('canvas'); c.width=c.height=16; await d.detect(c); }catch(e){} }
function gtinOk(s){ if(!/^\d{8,14}$/.test(s)) return false; const d=s.split('').map(Number); const chk=d.pop(); let sum=0; d.reverse().forEach((n,i)=>sum+=n*(i%2===0?3:1)); return (10-sum%10)%10===chk; }
const Cam={stream:null,track:null,on:false,cv:null,cx:null,caps:{},zoom:1,torch:false,last:{c:'',t:0},ms:0};
async function startScanner(){
  if(!window.isSecureContext) return toast('A câmera só funciona em endereço HTTPS',true);
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Este navegador não libera a câmera',true);
  const btn=$('#bCam'); if(btn){ btn.disabled=true; btn.textContent='Abrindo câmera…'; }
  try{
    const det=await getDetector(); warmUp(det);
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}});
    if(S.view!=='contar' || !$('#vid')){ st.getTracks().forEach(t=>t.stop()); return; }
    Cam.stream=st; Cam.track=st.getVideoTracks()[0];
    const v=$('#vid'); v.srcObject=st; await v.play().catch(()=>{});
    Cam.caps=Cam.track.getCapabilities?Cam.track.getCapabilities():{};
    if(Cam.caps.focusMode && Cam.caps.focusMode.includes('continuous')){ try{ await Cam.track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){} }
    Cam.zoom=Math.max(1,(Cam.caps.zoom&&Cam.caps.zoom.min)||1); Cam.torch=false;
    $('#bTorch').hidden=!Cam.caps.torch;
    $('#bZoom').hidden=!(Cam.caps.zoom && Cam.caps.zoom.max>=2); $('#bZoom').textContent='1x';
    Cam.cv=document.createElement('canvas'); Cam.cx=Cam.cv.getContext('2d',{willReadFrequently:true});
    Cam.on=true; S.scanning=true; $('#cam').classList.add('live');
    $('#camInfo').textContent='Leitor '+DET_KIND+' · pronto';
    renderFast(); scanLoop(v);
  }catch(e){
    console.error(e); Cam.on=false; S.scanning=false;
    toast(e && e.name==='NotAllowedError'?'Permissão da câmera negada. Libere nas configurações do navegador.':'Não foi possível abrir a câmera',true);
    if(btn){ btn.disabled=false; btn.textContent='📷 Ligar leitor de código de barras'; }
  }
}
function nextFrame(v){ return new Promise(res=>{ if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(()=>res()); else requestAnimationFrame(()=>res()); }); }
async function scanLoop(v){
  let frame=0;
  Cam.lockUntil=0; Cam.miss=0; Cam.lastHit=performance.now();
  setGuide(null,v);
  while(Cam.on){
    await nextFrame(v);
    if(!Cam.on) break;
    if($('#ov') || v.readyState<2 || !v.videoWidth) continue;
    frame++;
    const vw=v.videoWidth, vh=v.videoHeight, now=performance.now();
    // Estratégia: faixa central na maioria dos quadros (rápido); imagem inteira a cada 3 quadros
    // ou enquanto um código está sendo acompanhado (efeito "vai buscar o código").
    const full = now<Cam.lockUntil || frame%3===0;
    let sx,sy,sw,sh,max;
    if(full){ sx=0; sy=0; sw=vw; sh=vh; max=1600; }
    else { sw=Math.round(vw*0.92); sh=Math.round(Math.min(vh*0.45, vw*0.62)); sx=(vw-sw)/2; sy=(vh-sh)/2; max=1100; }
    const sc=Math.min(1,max/Math.max(sw,sh));
    const cw=Math.round(sw*sc), ch=Math.round(sh*sc);
    if(Cam.cv.width!==cw) Cam.cv.width=cw; if(Cam.cv.height!==ch) Cam.cv.height=ch;
    Cam.cx.drawImage(v,sx,sy,sw,sh,0,0,cw,ch);
    const t0=performance.now();
    let res=[];
    try{ res=await DET.detect(Cam.cv); }catch(e){ continue; }
    const ms=performance.now()-t0; Cam.ms=Cam.ms?Cam.ms*.85+ms*.15:ms;
    let hit=null;
    for(const b of res){
      const c=String(b.rawValue||'').trim(); if(!c) continue;
      if(['ean_13','ean_8','upc_a'].includes(b.format) && !gtinOk(c)) continue;
      hit={c,b}; break;
    }
    if(hit){
      // posição do código na imagem de vídeo
      const bb=boxOf(hit.b);
      const r={x:sx+bb.x/sc, y:sy+bb.y/sc, w:bb.w/sc, h:bb.h/sc};
      Cam.lockUntil=performance.now()+700; Cam.lastHit=performance.now(); Cam.miss=0;
      setGuide(r,v);
      autoZoom(r.w/vw);
      onScan(hit.c);
    } else {
      Cam.miss++;
      if(performance.now()>Cam.lockUntil && Cam.locked) setGuide(null,v);
      if(performance.now()-Cam.lastHit>2500) autoZoom(null);
    }
  }
}
function boxOf(b){
  if(b.cornerPoints && b.cornerPoints.length){ const xs=b.cornerPoints.map(p=>p.x), ys=b.cornerPoints.map(p=>p.y); const x=Math.min(...xs), y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}; }
  const r=b.boundingBox||{x:0,y:0,width:0,height:0}; return {x:r.x,y:r.y,w:r.width,h:r.height};
}
/* move o quadro verde: r = retângulo em pixels do vídeo; null = volta ao centro */
function setGuide(r,v){
  const g=$('#guide'), cam=$('#cam'); if(!g||!cam||!v||!v.videoWidth) return;
  const ew=cam.clientWidth, eh=cam.clientHeight, vw=v.videoWidth, vh=v.videoHeight;
  const k=Math.max(ew/vw,eh/vh), ox=(ew-vw*k)/2, oy=(eh-vh*k)/2;
  let x,y,w,h;
  if(r){
    // código de barras é fino: garante altura mínima e uma margem em volta
    let rh=Math.max(r.h, r.w*0.38), ry=r.y-(rh-r.h)/2;
    const pad=r.w*0.08;
    x=(r.x-pad)*k+ox; y=(ry-pad)*k+oy; w=(r.w+pad*2)*k; h=(rh+pad*2)*k;
    x=Math.max(4,Math.min(x,ew-40)); y=Math.max(4,Math.min(y,eh-30)); w=Math.min(w,ew-x-4); h=Math.min(h,eh-y-4);
    Cam.locked=true; g.classList.add('lock');
  } else {
    w=ew*0.92; h=Math.min(eh*0.45, ew*0.62*(eh/ew)); x=(ew-w)/2; y=(eh-h)/2;
    Cam.locked=false; g.classList.remove('lock');
  }
  g.style.left=x+'px'; g.style.top=y+'px'; g.style.width=w+'px'; g.style.height=h+'px';
}
/* zoom automático (aparelhos que permitem controlar o zoom pelo navegador) */
let zoomBusy=false;
async function autoZoom(frac){
  if(!LS.get('cvinv_autozoom',true) || !Cam.track || !Cam.caps.zoom || Cam.caps.zoom.max<1.8 || zoomBusy) return;
  const zmin=Math.max(1,Cam.caps.zoom.min||1), zmax=Math.min(3,Cam.caps.zoom.max);
  let z=Cam.zoom;
  if(frac==null){ if(Cam.zoom<2 && Cam.miss>45){ z=Math.min(2,zmax); Cam.miss=0; } else if(Cam.zoom>=2 && Cam.miss>90){ z=zmin; Cam.miss=0; } }
  else if(frac<0.22 && Cam.zoom<zmax) z=Math.min(zmax,Cam.zoom*1.5);
  else if(frac>0.75 && Cam.zoom>zmin) z=Math.max(zmin,Cam.zoom/1.5);
  z=Math.round(z*10)/10; if(z===Cam.zoom) return;
  zoomBusy=true;
  try{ await Cam.track.applyConstraints({advanced:[{zoom:z}]}); Cam.zoom=z; const b=$('#bZoom'); if(b) b.textContent=(Math.round(z*10)/10)+'x'; }catch(e){}
  setTimeout(()=>zoomBusy=false,600);
}
function onScan(code){
  const t=Date.now();
  if(code===Cam.last.c && t-Cam.last.t<1300){ Cam.last.t=t; return; }
  Cam.last={c:code,t};
  const cam=$('#cam'); if(cam){ cam.classList.remove('hit'); void cam.offsetWidth; cam.classList.add('hit'); }
  const inf=$('#camInfo'); if(inf) inf.textContent=`${code} · leitor ${DET_KIND} · ${Math.round(Cam.ms)} ms/quadro`;
  handleCode(code,'cam');
}
async function toggleTorch(){ if(!Cam.track) return; Cam.torch=!Cam.torch; try{ await Cam.track.applyConstraints({advanced:[{torch:Cam.torch}]}); $('#bTorch').classList.toggle('on',Cam.torch); }catch(e){ toast('Lanterna indisponível',true); } }
async function cycleZoom(){ if(!Cam.track||!Cam.caps.zoom) return; const max=Cam.caps.zoom.max; const opts=[1,2,3].filter(z=>z<=max); const i=opts.indexOf(Math.round(Cam.zoom)); Cam.zoom=opts[(i+1)%opts.length]; try{ await Cam.track.applyConstraints({advanced:[{zoom:Math.max(Cam.caps.zoom.min||1,Cam.zoom)}]}); $('#bZoom').textContent=Cam.zoom+'x'; }catch(e){} }
function pauseScanner(){} function resumeScanner(){}
function stopScanner(){
  Cam.on=false; S.scanning=false;
  if(Cam.stream){ Cam.stream.getTracks().forEach(t=>{ try{t.stop()}catch(e){} }); }
  Cam.stream=null; Cam.track=null;
  const v=$('#vid'); if(v) v.srcObject=null;
  const cam=$('#cam'); if(cam) cam.classList.remove('live');
  const b=$('#bCam'); if(b){ b.disabled=false; b.textContent='📷 Ligar leitor de código de barras'; }

}

/* leitor Bluetooth / coletor de dados (modo teclado): digita muito rápido e termina com Enter */
const WEDGE={buf:'',t:0,target:null,before:''};
document.addEventListener('keydown',e=>{
  if(S.view!=='contar' || $('#ov')) return;
  const t=performance.now();
  if(e.key==='Enter'){
    const isScan=WEDGE.buf.length>=6 && (t-WEDGE.t)<80;
    const code=WEDGE.buf; WEDGE.buf='';
    if(isScan && (WEDGE.target===$('#fQ') || !WEDGE.target || WEDGE.target.id!=='q')){
      e.preventDefault(); e.stopPropagation();
      // se a pessoa digitou algo logo antes do bipe, separa o código do que foi digitado
      let c=code, pre='';
      if(!findExact(c)){ for(const n of [13,12,14,8]){ const tail=code.slice(-n); if(code.length>n && gtinOk(tail) && findExact(tail)){ c=tail; pre=code.slice(0,-n); break; } } }
      const tg=WEDGE.target;
      if(tg && 'value' in tg){ tg.value=WEDGE.before+pre; if(tg.id==='fQ' && S.pend && tg.value.trim()!=='') S.pend.q=parseNum(tg.value); }
      handleCode(c,'leitor');
    }
    return;
  }
  if(e.key.length!==1 || e.ctrlKey || e.metaKey || e.altKey) return;
  if(t-WEDGE.t>45 || !WEDGE.buf){ WEDGE.buf=''; WEDGE.target=e.target; WEDGE.before=(e.target && 'value' in e.target)?e.target.value:''; }
  WEDGE.buf+=e.key; WEDGE.t=t;
},true);

function mapping(rows,fname){
  const head=rows[0].map(h=>String(h).trim());
  const auto={}; const used=new Set();
  COLS.forEach(([k,,re])=>{ const i=head.findIndex((h,ix)=>!used.has(ix) && re.test(norm(h))); if(i>=0){ auto[k]=i; used.add(i); } });
  const opts=sel=>`<option value="">— não tem —</option>`+head.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h||'Coluna '+(i+1))}</option>`).join('');
  const box=$('#map');
  box.innerHTML=`<div class="card stack"><h2>Conferir colunas — ${esc(fname)}</h2><div class="small muted">${fmt(rows.length-1)} linhas encontradas. Confirme qual coluna é cada informação.</div>

    <div id="prev"></div><div class="row"><span class="spacer"></span><button class="btn" id="bImp">Importar produtos</button></div></div>`;
  const get=()=>{ const m={}; box.querySelectorAll('[data-k]').forEach(s=>m[s.dataset.k]=s.value===''?null:+s.value); return m; };
  const build=()=>{ const m=get(); const out=[]; const seen=new Set(); let dup=0, vaz=0;
    rows.slice(1).forEach(r=>{ const cod=m.codigo!=null?codeStr(r[m.codigo]):''; const desc=m.descricao!=null?String(r[m.descricao]).trim():'';
      if(!cod||!desc){ vaz++; return; } const k=norm(cod); if(seen.has(k)){ dup++; return; } seen.add(k);
      out.push({codigo:cod,descricao:desc,ean:m.ean!=null?codeStr(r[m.ean]):'',estoque:m.estoque!=null?r3(parseNum(r[m.estoque])):0,unidade:m.unidade!=null?String(r[m.unidade]).trim().toUpperCase():'UN',novo:false}); });
    return {out,dup,vaz}; };
  const prev=()=>{ const {out,dup,vaz}=build();
    $('#prev').innerHTML=`<div class="small ${dup||vaz?'warnbox':'hint'}">${fmt(out.length)} produtos válidos${dup?` · ${dup} código(s) repetido(s) ignorado(s)`:''}${vaz?` · ${vaz} linha(s) sem código ou descrição ignorada(s)`:''}</div>
    <div class="tbl-wrap" style="margin-top:8px"><table class="t"><thead><tr><th>Código</th><th>Descrição</th><th>Cód. barras</th><th class="n">Estoque</th><th>Un</th></tr></thead><tbody>${out.slice(0,6).map(p=>`<tr><td class="mono">${esc(p.codigo)}</td><td>${esc(p.descricao)}</td><td class="mono">${esc(p.ean)}</td><td class="n">${fmt(p.estoque)}</td><td>${esc(p.unidade)}</td></tr>`).join('')}</tbody></table></div>`; };
  box.querySelectorAll('[data-k]').forEach(s=>s.onchange=prev); prev();
  $('#bImp').onclick=async()=>{
    const m=get(); if(m.codigo==null||m.descricao==null) return toast('Escolha as colunas de código e descrição',true);
    const {out}=build(); if(!out.length) return toast('Nenhum produto válido',true);
    if(S.lanc.length) return toast('Já existem lançamentos — não é possível substituir',true);
    const btn=$('#bImp'); btn.disabled=true; btn.textContent='Importando…';
    try{
      const col='inventarios/'+S.inv.id+'/produtos';
      if(S.produtos.length){ const ids=(await Store.list(col)).map(p=>p.id); await Store.delMany(col,ids); }
      await Store.addMany(col,out,n=>btn.textContent=`Importando… ${n}/${out.length}`);
      await Store.set('inventarios',S.inv.id,{totalProdutos:out.length,importadoEm:now(),arquivo:fname});
      toast(fmt(out.length)+' produtos importados');
      if(S.stack[S.stack.length-1]==='gestor') back(); else { S.view='invhome'; render(); }
    }catch(err){ console.error(err); toast('Erro ao importar: '+(err.message||err),true); btn.disabled=false; btn.textContent='Importar produtos'; }
  };
}

/* ---------- RESULTADO E RELATÓRIO ---------- */
V.resultado = ()=>{
  header('Resultado',S.inv.nome);
  $('#app').innerHTML='<div id="rBody" class="stack"></div>';
  V.resultado_refresh();
};
V.resultado_refresh = ()=>{
  const b=$('#rBody'); if(!b) return;
  const {rows,t}=calc(); const f=S.tabRes;
  const sum=a=>r3(a.reduce((s,r)=>s+Math.abs(r.dif),0));
  const flt={todos:rows,div:rows.filter(r=>r.d12),ent:t.ent,sai:t.sai,pend:rows.filter(r=>r.status==='pendente'),novos:rows.filter(r=>r.novo)}[f]||rows;
  b.innerHTML=`
    ${t.pend?`<div class="warnbox">${t.pend} item(ns) com divergência entre 1ª e 2ª ainda sem 3ª contagem — ficam sem quantidade final.</div>`:''}
    <div class="grid kpi">
      <div class="card"><div class="l">Itens no inventário</div><div class="v">${fmt(t.itens)}</div></div>
      <div class="card"><div class="l">Batem com o estoque</div><div class="v">${fmt(t.semDif)}</div></div>
      <div class="card"><div class="l">Entradas (itens)</div><div class="v pos">${fmt(t.ent.length)}</div></div>
      <div class="card"><div class="l">Saídas (itens)</div><div class="v neg">${fmt(t.sai.length)}</div></div>
      <div class="card"><div class="l">Divergências 1ª×2ª</div><div class="v">${fmt(t.div12)}</div></div>
      <div class="card"><div class="l">Pendentes</div><div class="v">${fmt(t.pend)}</div></div>
    </div>
    <div class="row"><button class="btn" id="rPdf">📄 Relatório em PDF</button><button class="btn dark" id="rXls">📊 Planilha Excel</button></div>
    <div class="tabs">${[['todos','Todos',rows.length],['ent','Entradas',t.ent.length],['sai','Saídas',t.sai.length],['div','Divergentes 1×2',t.div12],['pend','Pendentes',t.pend],['novos','Novos',t.novos]].map(([k,l,n])=>`<button data-t="${k}" class="${f===k?'on':''}">${l} (${n})</button>`).join('')}</div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Código</th><th>Descrição</th><th>Un</th><th class="n">1ª</th><th class="n">2ª</th><th class="n">3ª</th><th class="n">Final</th><th class="n">Estoque</th><th class="n">Diferença</th><th>Ação</th></tr></thead><tbody>
    ${flt.slice(0,3000).map(r=>`<tr class="${r.d12?'hl':''}"><td class="mono">${esc(r.codigo)}</td><td>${esc(r.descricao)}${r.novo?' <span class="badge b-blue">novo</span>':''}</td><td>${esc(r.unidade)}</td>
      <td class="n">${fmt(r.c[0])}</td><td class="n">${fmt(r.c[1])}</td><td class="n">${r.n[2]?fmt(r.c[2]):'—'}</td><td class="n"><b>${fmt(r.final)}</b></td><td class="n">${fmt(r.estoque)}</td>
      <td class="n ${r.dif>0?'pos':r.dif<0?'neg':''}">${r.dif==null?'—':fmtS(r.dif)}</td>
      <td>${r.status==='pendente'?'<span class="badge b-warn">Pendente</span>':r.dif>0.0004?'<span class="badge b-ok">Entrada</span>':r.dif<-0.0004?'<span class="badge b-red">Saída</span>':'<span class="badge b-gray">OK</span>'}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">Nenhum item</td></tr>'}
    </tbody></table></div>
    <div class="hint">Regra: se a 1ª e a 2ª contagens batem, esse é o valor final. Se divergem, vale a 3ª contagem. Produto da base que ninguém encontrou conta como zero (saída de todo o estoque). Diferença = contagem final − estoque do sistema.</div>`;
  b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{ S.tabRes=x.dataset.t; V.resultado_refresh(); });
  $('#rPdf').onclick=gerarPDF; $('#rXls').onclick=gerarExcel;
};
function fileBase(){ return ('inventario_'+(S.empresa.fantasia||'empresa')+'_'+(S.inv.data||'')).replace(/[^\w\-]+/g,'_'); }
function sheet(aoa,widths){ const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=(widths||aoa[0].map((h,i)=>({wch:i===1?44:Math.max(12,String(h).length+2)}))); return ws; }
function gerarExcel(){
  const {rows,t}=calc(); const e=S.empresa,i=S.inv;
  const wb=XLSX.utils.book_new();
  const head=['Código','Descrição','Cód. barras','Unidade','1ª contagem','2ª contagem','3ª contagem','Contagem final','Estoque sistema','Diferença','Ação'];
  const acao=r=>r.status==='pendente'?'PENDENTE':r.dif>0.0004?'ENTRADA':r.dif<-0.0004?'SAÍDA':'OK';
  XLSX.utils.book_append_sheet(wb,sheet([[`Inventário: ${i.nome} — ${e.fantasia||e.razao} — ${dBR(i.data)}`],[],head].concat(rows.map(r=>[r.codigo,r.descricao,r.ean,r.unidade,r.c[0],r.c[1],r.n[2]?r.c[2]:'',r.final??'',r.estoque,r.dif??'',acao(r)])),head.map((h,ix)=>({wch:ix===1?44:14}))),'Contagem completa');
  XLSX.utils.book_append_sheet(wb,sheet([['Código','Descrição','Unidade','1ª','2ª','Diferença','3ª']].concat(rows.filter(r=>r.d12).map(r=>[r.codigo,r.descricao,r.unidade,r.c[0],r.c[1],r3(r.c[1]-r.c[0]),r.n[2]?r.c[2]:'']))),'Divergências 1x2');
  const mov=a=>[['Código','Descrição','Cód. barras','Unidade','Estoque sistema','Contagem final','Quantidade']].concat(a.map(r=>[r.codigo,r.descricao,r.ean,r.unidade,r.estoque,r.final,Math.abs(r.dif)]));
  XLSX.utils.book_append_sheet(wb,sheet(mov(t.ent)),'Entradas');
  XLSX.utils.book_append_sheet(wb,sheet(mov(t.sai)),'Saídas');
  XLSX.utils.book_append_sheet(wb,sheet([['Data/hora','Contagem','Contador','Código','Descrição','Quantidade','Unidade']].concat([...S.lanc].sort((a,b)=>String(a.ts).localeCompare(String(b.ts))).map(l=>[dtBR(l.ts),l.rodada+'ª',l.contador,l.codigo,l.descricao,l.qtd,l.unidade]))),'Lançamentos');
  XLSX.writeFile(wb,fileBase()+'.xlsx'); toast('Planilha gerada');
}
function svgToPng(svg,w,h){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/png')); }; img.onerror=()=>res(null); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }); }
async function gerarPDF(){
  if(!window.jspdf) return toast('Gerador de PDF carregando, tente novamente',true);
  const {rows,t}=calc(); const e=S.empresa,i=S.inv;
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  const logo=await svgToPng(LOGO_SVG('#000924'),884,128);
  const NAVY=[23,35,52], TEAL=[58,160,148];
  const topo=()=>{ doc.setFillColor(...TEAL); doc.rect(0,0,W,2,'F'); if(logo) doc.addImage(logo,'PNG',W-14-44,7,44,6.4);
    doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Relatório de Inventário — Contagem Cega',14,12);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
    doc.text(`${e.fantasia||''}${e.razao&&e.razao!==e.fantasia?' · '+e.razao:''}${e.cnpj?' · CNPJ '+e.cnpj:''}${e.cidade?' · '+e.cidade+(e.uf?'/'+e.uf:''):''}`,14,17.5);
    doc.text(`${i.nome} · Data: ${dBR(i.data)} · Emitido em ${new Date().toLocaleString('pt-BR')}${i.status==='finalizado'?' · FINALIZADO':' · EM ANDAMENTO'}`,14,22); };
  const rodape=()=>{ const n=doc.internal.getNumberOfPages(); for(let p=1;p<=n;p++){ doc.setPage(p); doc.setFontSize(8); doc.setTextColor(120); doc.text('Cultivve Gestão de Projetos · Simplicidade, eficácia e resultado',14,H-7); doc.text(`Página ${p} de ${n}`,W-14,H-7,{align:'right'}); } };
  const num=n=>n==null?'—':fmt(n);
  topo();
  // resumo
  const st=[1,2,3].map(roundStats);
  doc.autoTable({startY:27,theme:'grid',styles:{fontSize:8.5,cellPadding:1.8},headStyles:{fillColor:NAVY},margin:{left:14,right:14},
    head:[['Itens','Batem com estoque','Divergências 1ª×2ª','Pendentes de 3ª','Itens p/ entrada','Itens p/ saída','Novos cadastrados','Lançamentos 1ª / 2ª / 3ª']],
    body:[[t.itens,t.semDif,t.div12,t.pend,t.ent.length,t.sai.length,t.novos,`${st[0].lanc} / ${st[1].lanc} / ${st[2].lanc}`]]});
  const cont=[1,2,3].map(r=>Object.keys(st[r-1].pessoas).join(', ')||'—');
  doc.setFontSize(8.5); doc.setTextColor(70);
  doc.text(`Contadores — 1ª: ${cont[0]}   ·   2ª: ${cont[1]}   ·   3ª: ${cont[2]}`,14,doc.lastAutoTable.finalY+5);
  // contagem completa
  doc.setFontSize(11); doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.text('1. Contagem completa',14,doc.lastAutoTable.finalY+12); doc.setFont('helvetica','normal');
  doc.autoTable({startY:doc.lastAutoTable.finalY+14,theme:'striped',styles:{fontSize:7.5,cellPadding:1.4},headStyles:{fillColor:NAVY,fontSize:7.5},margin:{left:14,right:14,top:28},
    head:[['Código','Descrição','Un','1ª','2ª','3ª','Final','Estoque','Diferença','Ação']],
    body:rows.map(r=>[r.codigo,r.descricao+(r.novo?' (novo)':''),r.unidade,num(r.c[0]),num(r.c[1]),r.n[2]?num(r.c[2]):'—',num(r.final),num(r.estoque),r.dif==null?'—':fmtS(r.dif),r.status==='pendente'?'PENDENTE':r.dif>0.0004?'ENTRADA':r.dif<-0.0004?'SAÍDA':'OK']),
    columnStyles:{0:{cellWidth:24},1:{cellWidth:'auto'},2:{cellWidth:10},3:{halign:'right',cellWidth:16},4:{halign:'right',cellWidth:16},5:{halign:'right',cellWidth:16},6:{halign:'right',cellWidth:18,fontStyle:'bold'},7:{halign:'right',cellWidth:18},8:{halign:'right',cellWidth:19},9:{cellWidth:20}},
    didParseCell:d=>{ if(d.section==='body'){ const r=rows[d.row.index]; if(r.d12) d.cell.styles.fillColor=[255,248,230]; if(d.column.index===8||d.column.index===9){ if(r.dif>0.0004) d.cell.styles.textColor=[29,122,70]; else if(r.dif<-0.0004) d.cell.styles.textColor=[200,70,61]; } } },
    didDrawPage:d=>{ if(d.pageNumber>1) topo(); }});
  const secao=(titulo,arr,cor)=>{
    doc.addPage(); topo();
    doc.setFontSize(11); doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.text(titulo,14,32); doc.setFont('helvetica','normal');
    doc.autoTable({startY:35,theme:'grid',styles:{fontSize:8,cellPadding:1.6},headStyles:{fillColor:cor},margin:{left:14,right:14,top:28},
      head:[['Código','Descrição','Cód. barras','Un','Estoque sistema','Contagem final','Quantidade']],
      body:arr.length?arr.map(r=>[r.codigo,r.descricao+(r.novo?' (novo)':''),r.ean,r.unidade,num(r.estoque),num(r.final),fmt(Math.abs(r.dif))]):[[{content:'Nenhum item',colSpan:7,styles:{halign:'center'}}]],
      columnStyles:{0:{cellWidth:26},2:{cellWidth:34},3:{cellWidth:12},4:{halign:'right',cellWidth:28},5:{halign:'right',cellWidth:28},6:{halign:'right',cellWidth:26,fontStyle:'bold'}},
      didDrawPage:d=>{ if(d.pageNumber>1) topo(); }});
    doc.setFontSize(8.5); doc.setTextColor(70); doc.text(`Total: ${arr.length} item(ns)`,14,doc.lastAutoTable.finalY+5);
  };
  secao('2. Itens que precisam de ENTRADA de estoque (contagem final maior que o sistema)',t.ent,[29,122,70]);
  secao('3. Itens que precisam de SAÍDA de estoque (contagem final menor que o sistema)',t.sai,[200,70,61]);
  if(t.pend){ const pend=rows.filter(r=>r.status==='pendente'); doc.addPage(); topo(); doc.setFontSize(11); doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.text('4. Itens pendentes (divergentes sem 3ª contagem)',14,32); doc.setFont('helvetica','normal');
    doc.autoTable({startY:35,theme:'grid',styles:{fontSize:8},headStyles:{fillColor:[201,138,18]},margin:{left:14,right:14,top:28},head:[['Código','Descrição','Un','1ª','2ª','Estoque']],body:pend.map(r=>[r.codigo,r.descricao,r.unidade,num(r.c[0]),num(r.c[1]),num(r.estoque)])}); }
  // assinaturas
  let y=doc.lastAutoTable.finalY+22; if(y>H-30){ doc.addPage(); topo(); y=50; }
  doc.setDrawColor(150); doc.setTextColor(70); doc.setFontSize(9);
  [['Responsável pela empresa',14],['Gestor do inventário',110],['Cultivve Gestão',206]].forEach(([l,x])=>{ doc.line(x,y,x+78,y); doc.text(l,x+39,y+5,{align:'center'}); });
  rodape();
  doc.save(fileBase()+'.pdf'); toast('PDF gerado');
}

/* ---------- CONFIGURAÇÕES ---------- */
V.config = ()=>{
  header('Configurações','Conexão entre aparelhos');
  const cfg=Store.cfg();
  const link = cfg ? location.origin+location.pathname+'#cfg='+btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))) : '';
  $('#app').innerHTML=`<div class="stack">
    <div class="card stack"><div class="row between"><h2>Firebase (vários celulares)</h2><span class="badge ${Store.mode==='cloud'?'b-ok':'b-warn'}">${Store.mode==='cloud'?'Conectado':'Modo local'}</span></div>
      <div class="small muted">Cole aqui o <b>firebaseConfig</b> do seu projeto (Console do Firebase → Configurações do projeto → Seus apps → Web). Pode colar o trecho inteiro do código.</div>
      <textarea class="in" id="cfgT" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", appId: "..." }'>${cfg?esc(JSON.stringify(cfg,null,2)):''}</textarea>
      <div class="row"><button class="btn" id="cfgS">Salvar e reconectar</button>${LS.get('cvinv_fbcfg')?'<button class="btn sec" id="cfgD">Voltar ao modo local</button>':''}</div></div>
    ${cfg?`<div class="card stack"><h2>Conectar outros celulares</h2><div class="small muted">Envie este link aos contadores (WhatsApp). Ao abrir, o celular já fica conectado à mesma base. Depois é só adicionar à tela inicial.</div>
      <input class="in mono" readonly value="${esc(link)}" id="lnk"><button class="btn sec" id="cp">Copiar link</button></div>`:''}
    <div class="card stack"><h2>Instalar no celular</h2>
      <div class="small"><b>iPhone (Safari):</b> toque em Compartilhar ⬆ → “Adicionar à Tela de Início”.<br><b>Android (Chrome):</b> menu ⋮ → “Instalar app” ou “Adicionar à tela inicial”.</div></div>
    <div class="card small muted">Este aparelho: <span class="mono">${DEV}</span> · versão ${APP_VERSION}</div></div>`;
  $('#cfgS').onclick=()=>{ const c=parseCfg($('#cfgT').value); if(!c) return toast('Não reconheci o firebaseConfig (precisa de apiKey e projectId)',true); LS.set('cvinv_fbcfg',c); toast('Salvo. Reiniciando…'); setTimeout(()=>location.reload(),700); };
  const d=$('#cfgD'); if(d) d.onclick=async()=>{ if(await ask('Desconectar deste Firebase e voltar ao modo local neste aparelho?',{ok:'Voltar ao local'})){ LS.del('cvinv_fbcfg'); location.reload(); } };
  const cp=$('#cp'); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText($('#lnk').value); toast('Link copiado'); }catch(e){ $('#lnk').select(); toast('Selecione e copie o link'); } };
};
function parseCfg(txt){
  txt=String(txt||'');
  try{ const j=JSON.parse(txt); if(j.apiKey&&j.projectId) return j; }catch(e){}
  const o={}; ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{ const m=txt.match(new RegExp(k+'\\s*:\\s*["\\\']([^"\\\']+)["\\\']')); if(m) o[k]=m[1]; });
  return o.apiKey&&o.projectId?o:null;
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
(async function boot(){
  if(location.hash.startsWith('#cfg=')){
    try{ const c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5))))); if(c.apiKey&&c.projectId){ LS.set('cvinv_fbcfg',c); } }catch(e){ console.warn(e); }
    history.replaceState(null,'',location.pathname);
  }
  await Store.init();
  const last=LS.get('cvinv_emp');
  if(last){ const e=await Store.get('empresas',last).catch(()=>null); if(e){ S.empresa=e; S.stack=['empresas']; S.view='inventarios'; } }
  render();
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)); }
})();
</script>
