/* =====================================================================
   CNPJ — busca automática dos dados (BrasilAPI / CNPJ.ws) e leitura do cartão CNPJ
   ===================================================================== */
function cnpjValido(c){
  c=String(c||'').replace(/\D/g,''); if(c.length!==14 || /^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+=+c[i]*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return calc(12)===+c[12] && calc(13)===+c[13];
}
const cnpjFmt=c=>{ c=String(c||'').replace(/\D/g,''); return c.length===14?c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):c; };
function mascaraCnpj(v){ const d=String(v||'').replace(/\D/g,'').slice(0,14); let o=d.slice(0,2); if(d.length>2) o+='.'+d.slice(2,5); if(d.length>5) o+='.'+d.slice(5,8); if(d.length>8) o+='/'+d.slice(8,12); if(d.length>12) o+='-'+d.slice(12,14); return o; }
function mascaraFone(v){ const d=String(v||'').replace(/\D/g,'').slice(0,11); if(d.length<=2) return d.length?'('+d:''; if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`; if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; }
function mascaraCep(v){ const d=String(v||'').replace(/\D/g,'').slice(0,8); return d.length>5?d.slice(0,5)+'-'+d.slice(5):d; }
function aplicaMascara(inp,fn,onDone){ inp.addEventListener('input',()=>{ const pos=inp.selectionStart, antes=inp.value.length; inp.value=fn(inp.value); const dif=inp.value.length-antes; try{ inp.setSelectionRange(pos+dif,pos+dif); }catch(e){} onDone&&onDone(inp.value); }); }
const tit=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
const dataBR=v=>{ const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:(v||''); };
const cnaeFmt=c=>{ const d=String(c||'').replace(/\D/g,'').padStart(7,'0'); return d.length===7?`${d.slice(0,4)}-${d.slice(4,5)}/${d.slice(5)}`:String(c||''); };
async function getJson(url,ms=9000){ try{ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms); const r=await fetch(url,{signal:ctl.signal}); clearTimeout(t); return r.ok?await r.json():null; }catch(e){ return null; } }
/* busca os dados públicos do CNPJ em duas fontes ao mesmo tempo e junta o que cada uma tem */
async function buscarCnpj(cnpj){
  const c=String(cnpj).replace(/\D/g,'');
  const [a,w]=await Promise.all([getJson('https://brasilapi.com.br/api/cnpj/v1/'+c),getJson('https://publica.cnpj.ws/cnpj/'+c)]);
  if(!a && !w) return null;
  const e=(w&&w.estabelecimento)||{};
  const pick=(...v)=>{ for(const x of v){ if(x!=null && String(x).trim()!=='') return x; } return ''; };
  const fone=v=>{ const x=String(v||'').replace(/\D/g,''); return x?mascaraFone(x):''; };
  const ies=(e.inscricoes_estaduais||[]).map(i=>({ie:i.inscricao_estadual,uf:(i.estado&&i.estado.sigla)||'',ativo:i.ativo!==false,atualizado:i.atualizado_em?dataBR(i.atualizado_em):''}));
  const ufE=pick(a&&a.uf,e.estado&&e.estado.sigla);
  const ieUF=ies.find(i=>i.ativo&&i.uf===ufE)||ies.find(i=>i.ativo)||ies[0];
  const cnaeP=a&&a.cnae_fiscal?{codigo:cnaeFmt(a.cnae_fiscal),descricao:a.cnae_fiscal_descricao||''}:(e.atividade_principal?{codigo:cnaeFmt(e.atividade_principal.subclasse||e.atividade_principal.id),descricao:e.atividade_principal.descricao||''}:null);
  let cnaesS=(a&&a.cnaes_secundarios||[]).filter(x=>x&&x.codigo).map(x=>({codigo:cnaeFmt(x.codigo),descricao:x.descricao||''}));
  if(!cnaesS.length) cnaesS=(e.atividades_secundarias||[]).map(x=>({codigo:cnaeFmt(x.subclasse||x.id),descricao:x.descricao||''}));
  let socios=(a&&a.qsa||[]).map(x=>({nome:x.nome_socio||'',qualificacao:x.qualificacao_socio||'',desde:dataBR(x.data_entrada_sociedade),faixa:x.faixa_etaria||'',pais:x.pais||(x.codigo_pais&&String(x.codigo_pais)!=='105'?String(x.codigo_pais):'BRASIL'),representante:x.nome_representante_legal||''}));
  if(!socios.length) socios=((w&&w.socios)||[]).map(x=>({nome:x.nome||'',qualificacao:(x.qualificacao_socio&&x.qualificacao_socio.descricao)||'',desde:dataBR(x.data_entrada),faixa:x.faixa_etaria||'',pais:(x.pais&&x.pais.nome)||'BRASIL',representante:x.nome_representante||''}));
  const simples=w&&w.simples;
  const regime=(a&&Array.isArray(a.regime_tributario)&&a.regime_tributario.length)?a.regime_tributario.slice().sort((x,y)=>(y.ano||0)-(x.ano||0))[0]:null;
  const tipoLog=pick(a&&a.descricao_tipo_de_logradouro,e.tipo_logradouro);
  return {
    razao:pick(a&&a.razao_social,w&&w.razao_social),
    fantasia:pick(a&&a.nome_fantasia,e.nome_fantasia),
    endereco:[tipoLog,pick(a&&a.logradouro,e.logradouro)].filter(Boolean).join(' '),
    numero:String(pick(a&&a.numero,e.numero)),
    complemento:pick(a&&a.complemento,e.complemento),
    bairro:tit(pick(a&&a.bairro,e.bairro)),
    cidade:tit(pick(a&&a.municipio,e.cidade&&e.cidade.nome)),
    uf:ufE,
    cep:pick(a&&a.cep,e.cep),
    telefone:fone(pick(a&&a.ddd_telefone_1,(e.ddd1||'')+(e.telefone1||''))),
    telefone2:fone(pick(a&&a.ddd_telefone_2,(e.ddd2||'')+(e.telefone2||''))),
    email:String(pick(a&&a.email,e.email)).toLowerCase(),
    ie:ieUF?ieUF.ie:'',
    situacao:pick(a&&a.descricao_situacao_cadastral,e.situacao_cadastral),
    receita:{
      abertura:dataBR(pick(a&&a.data_inicio_atividade,e.data_inicio_atividade)),
      situacao:pick(a&&a.descricao_situacao_cadastral,e.situacao_cadastral),
      situacaoData:dataBR(pick(a&&a.data_situacao_cadastral,e.data_situacao_cadastral)),
      motivo:pick(a&&a.descricao_motivo_situacao_cadastral,e.motivo_situacao_cadastral&&e.motivo_situacao_cadastral.descricao,'SEM MOTIVO'),
      tipo:pick(a&&a.descricao_identificador_matriz_filial,e.tipo),
      natureza:pick(a&&a.natureza_juridica,w&&w.natureza_juridica&&w.natureza_juridica.descricao),
      porte:pick(a&&a.porte,a&&a.descricao_porte,w&&w.porte&&w.porte.descricao),
      capital:Number(pick(a&&a.capital_social,w&&w.capital_social,0))||0,
      simples:simples?(simples.simples==='Sim'?'Sim'+(simples.data_opcao_simples?' (desde '+dataBR(simples.data_opcao_simples)+')':''):'Não'):(a&&a.opcao_pelo_simples!=null?(a.opcao_pelo_simples?'Sim':'Não'):''),
      mei:simples?(simples.mei==='Sim'?'Sim':'Não'):(a&&a.opcao_pelo_mei!=null?(a.opcao_pelo_mei?'Sim':'Não'):''),
      regime:regime?`${regime.forma_de_tributacao||''} (${regime.ano||''})`:'',
      municipioIbge:pick(a&&a.codigo_municipio_ibge,e.cidade&&e.cidade.ibge_id),
      enteFederativo:pick(a&&a.ente_federativo_responsavel,w&&w.responsavel_federativo),
      cnae:cnaeP, cnaes:cnaesS, socios, ies,
      consultadoEm:now()
    }
  };
}
async function lerCartaoCnpj(file){
  if(!/pdf/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('Envie o cartão CNPJ em PDF (o que a Receita gera). Foto não dá para ler — digite o CNPJ.',true); return null; }
  if(!window.pdfjsLib){ try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); }catch(e){ toast('Sem internet para ler o PDF',true); return null; } }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let txt=''; for(let i=1;i<=Math.min(pdf.numPages,2);i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); txt+=tc.items.map(x=>x.str).join('\n')+'\n'; }
  const m=txt.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/);
  if(!m){ toast('Não encontrei o CNPJ no PDF',true); return null; }
  const linhas=txt.split('\n').map(s=>s.trim()).filter(Boolean);
  const depois=rot=>{ const i=linhas.findIndex(l=>norm(l).startsWith(norm(rot))); return i>=0?linhas[i+1]||'':''; };
  return {cnpj:m[0],razao:depois('NOME EMPRESARIAL'),fantasia:depois('TÍTULO DO ESTABELECIMENTO').replace(/^\*+$/,''),cidade:tit(depois('MUNICÍPIO')),uf:depois('UF').slice(0,2)};
}

function tarefas(inv,u){
  if(!inv) return [];
  const R=inv.rodadas||{}; const out=[];
  if(u && u.id==='cultivve'){ [1,2,3].forEach(r=>{ if(R['r'+r]==='aberta') out.push({r,escalado:false}); }); return out; }
  [1,2,3].forEach(r=>{ if(R['r'+r]!=='aberta') return; const esc_=escalaDe(inv,r);
    if(esc_.length){ if(u && esc_.includes(u.id)) out.push({r,escalado:true}); }
    else out.push({r,escalado:false}); });
  return out;
}

async function encerrarFluxo(){
  const u=await exigir(podeEnc,'Encerrar inventário','Você não tem permissão para encerrar o inventário'); if(!u) return;
  const inv=S.inv;
  if(inv.status==='finalizado'){ const {rows}=calcFrom(S.produtos,await Store.list('inventarios/'+inv.id+'/lancamentos'),modoDe(inv)); return novoInventario(rows); }
  const L=await Store.list('inventarios/'+inv.id+'/lancamentos');
  const {rows,t}=calcFrom(S.produtos,L,modoDe(inv));
  const R=inv.rodadas||{}; const abertas=[1,2,3].filter(r=>R['r'+r]==='aberta');
  let msg=`<b>${esc(inv.nome)}</b> — ${t.itens} itens · ${t.ent.length} para entrada · ${t.sai.length} para saída.`;
  if(abertas.length) msg+=`<br><br>⚠ Ainda há contagem aberta (${abertas.map(r=>r+'ª').join(', ')}). Ela será encerrada.`;
  if(t.pend) msg+=`<br><br>⚠ Há <b>${t.pend}</b> item(ns) divergente(s) sem 3ª contagem. Eles ficarão sem quantidade final e fora dos ajustes.`;
  msg+=`<br><br>O resultado vai para o histórico e você poderá iniciar um novo inventário em seguida.`;
  if(!await ask(msg,{ok:'Encerrar inventário',danger:true,title:'Encerrar inventário'})) return;
  await finalizarInv(inv,rows,t,L,u);
  toast('Inventário encerrado');
  novoInventario(rows);
}
async function finalizarInv(inv,rows,t,L,u){
  const R={...(inv.rodadas||{})}; [1,2,3].forEach(r=>{ if(R['r'+r]==='aberta') R['r'+r]='fechada'; });
  const k=await salvarHistorico(inv,rows,t,L);
  await Store.set('inventarios',inv.id,{status:'finalizado',finalizadoEm:now(),finalizadoPor:u?u.nome:'',rodadas:R,kpis:k});
  Store.add('inventarios/'+inv.id+'/log',{acao:'Encerrou o inventário',detalhe:`${t.ent.length} entrada(s), ${t.sai.length} saída(s)`,quem:u?u.nome:quem(),ts:now(),device:DEV});
  S.hist=null;
}
function rowsToItens(rows){ return rows.map(r=>({k:r.codigo,d:r.descricao,g:r.grupo,s:r.subgrupo,u:r.unidade,b:r.ean,m:r.marca||'',r:r.referencia||'',e:r.estoque,c1:r.c[0],c2:r.c[1],c3:r.n[2]?r.c[2]:null,f:r.final,x:r.dif,v:r.custo||0,nv:r.novo?1:0})); }
async function salvarHistorico(inv,rows,t,L){
  const itens=rowsToItens(rows); const P=1500; let partes=0;
  for(let i=0;i<itens.length||i===0;i+=P){ await Store.set('historico',inv.id+'_'+partes,{empresaId:inv.empresaId,invId:inv.id,parte:partes,dados:JSON.stringify(itens.slice(i,i+P))}); partes++; if(!itens.length) break; }
  const cont={}; (L||[]).forEach(l=>{ cont[l.contador||'?']=(cont[l.contador||'?']||0)+1; });
  return {itens:t.itens,ok:t.semDif,div12:t.div12,pend:t.pend,novos:t.novos,nEnt:t.ent.length,nSai:t.sai.length,qEnt:t.qEnt,qSai:t.qSai,vEnt:t.vEnt,vSai:t.vSai,
    acuracia:t.itens?r3(t.semDif/t.itens*100):0,lanc:(L||[]).length,contadores:cont,partes};
}

async function carregarHist(force){
  if(S.hist && S.hist.emp===S.empresa.id && !force) return S.hist;
  const invs=(await Store.list('inventarios','empresaId',S.empresa.id)).filter(i=>i.status==='finalizado')
    .sort((a,b)=>String(a.data||'').localeCompare(String(b.data||''))||String(a.criadoEm).localeCompare(String(b.criadoEm)));
  const parts=await Store.list('historico','empresaId',S.empresa.id);
  const by={}; parts.forEach(p=>{ (by[p.invId]=by[p.invId]||[]).push(p); });
  for(const inv of invs){
    const np=inv.kpis&&inv.kpis.partes;
    const ps=(by[inv.id]||[]).filter(p=>np==null||p.parte<np).sort((a,b)=>a.parte-b.parte);
    if(!ps.length || !inv.kpis){
      const prods=await Store.list('inventarios/'+inv.id+'/produtos'); const L=await Store.list('inventarios/'+inv.id+'/lancamentos');
      const {rows,t}=calcFrom(prods,L,modoDe(inv)); inv.kpis=await salvarHistorico(inv,rows,t,L); await Store.set('inventarios',inv.id,{kpis:inv.kpis}); inv.itens=rowsToItens(rows);
    } else inv.itens=ps.flatMap(p=>{ try{ return JSON.parse(p.dados); }catch(e){ return []; } });
  }
  S.hist={emp:S.empresa.id,invs}; return S.hist;
}
function barras(dados,{fmtV=v=>fmt(v),cor='var(--teal)',alto=150}={}){
  if(!dados.length) return '<div class="empty small">Sem dados ainda</div>';
  const max=Math.max(...dados.map(d=>Math.abs(d.v)),1); const w=Math.max(28,Math.min(70,Math.floor(640/dados.length)));
  return `<div class="bars" style="height:${alto+44}px">${dados.map(d=>`<div class="bar" style="width:${w}px" title="${esc(d.l)}: ${esc(fmtV(d.v))}"><span class="bv">${esc(fmtV(d.v))}</span><div class="bf" style="height:${Math.max(2,Math.round(Math.abs(d.v)/max*alto))}px;background:${d.c||cor}"></div><span class="bl">${esc(d.l)}</span></div>`).join('')}</div>`;
}

const ERP_CAMPOS={codigo:'Código do produto',ean:'Código de barras',descricao:'Descrição',qtd:'Quantidade do ajuste',unidade:'Unidade',grupo:'Grupo',subgrupo:'Subgrupo',custo:'Custo unitário',valor:'Valor do ajuste',estoque:'Estoque do sistema',contagem:'Contagem final',tipo:'Tipo de movimento (E/S)',data:'Data do inventário',documento:'Documento / nome do inventário',constante:'Texto fixo'};
const ERP_NUM=new Set(['qtd','custo','valor','estoque','contagem']);
const ERP_DEF={formato:'csv',sep:';',dec:',',casas:3,cab:true,codif:'utf8',crlf:true,sinal:'positivo',dataFmt:'dd/mm/aaaa',codE:'E',codS:'S',arquivo:'ajuste_{tipo}_{data}',fixoSemVirgula:false,
  colunas:[{c:'codigo',t:'CODIGO',w:14},{c:'ean',t:'EAN',w:14},{c:'descricao',t:'DESCRICAO',w:40},{c:'qtd',t:'QUANTIDADE',w:12},{c:'unidade',t:'UN',w:3}]};
function erpCfg(){ return {...ERP_DEF,...(S.empresa.erp||{}),colunas:((S.empresa.erp&&S.empresa.erp.colunas)||ERP_DEF.colunas).map(c=>({...c}))}; }
function dataFmt(iso,f){ const [y,m,d]=String(iso||new Date().toISOString().slice(0,10)).slice(0,10).split('-'); return ({'dd/mm/aaaa':`${d}/${m}/${y}`,'aaaa-mm-dd':`${y}-${m}-${d}`,'ddmmaaaa':`${d}${m}${y}`,'aaaammdd':`${y}${m}${d}`,'dd.mm.aaaa':`${d}.${m}.${y}`})[f]||`${d}/${m}/${y}`; }
function erpValor(r,col,tipo,cfg){
  const q=Math.abs(r.dif||0);
  switch(col.c){
    case 'codigo': return r.codigo; case 'ean': return r.ean||''; case 'descricao': return r.descricao||''; case 'unidade': return r.unidade||'';
    case 'grupo': return r.grupo||''; case 'subgrupo': return r.subgrupo||'';
    case 'qtd': return (tipo==='S'&&cfg.sinal==='negativo')?-q:q;
    case 'custo': return r.custo||0; case 'valor': return r3(q*(r.custo||0))*((tipo==='S'&&cfg.sinal==='negativo')?-1:1);
    case 'estoque': return r.estoque; case 'contagem': return r.final;
    case 'tipo': return tipo==='E'?cfg.codE:cfg.codS; case 'data': return dataFmt(S.inv.data,cfg.dataFmt);
    case 'documento': return S.inv.nome||''; case 'constante': return col.fixo||'';
  } return '';
}
function erpNum(v,cfg,fixo){ const c=Math.max(0,Math.min(6,+cfg.casas||0)); let s=Number(v||0).toFixed(c); if(fixo&&cfg.fixoSemVirgula) return s.replace('.',''); return cfg.dec===','?s.replace('.',','):s; }
function erpLinhas(lista,tipo,cfg){
  const fixo=cfg.formato==='fixo';
  const sep=cfg.sep==='tab'?'\t':cfg.sep;
  const linhas=[];
  if(cfg.cab && !fixo) linhas.push(cfg.colunas.map(c=>c.t||c.c).join(sep));
  lista.forEach(r=>{
    const cel=cfg.colunas.map(col=>{
      const v=erpValor(r,col,tipo,cfg); const num=ERP_NUM.has(col.c);
      let s=num?erpNum(v,cfg,fixo):String(v??'');
      if(fixo){ const w=+col.w||10; if(num){ const neg=s.startsWith('-'); s=s.replace('-',''); s=(neg?'-':'')+s.padStart(w-(neg?1:0),'0'); } else s=s.padEnd(w,' '); return s.slice(0,w); }
      if(!num && (s.includes(sep)||s.includes('"')||s.includes('\n'))) s='"'+s.replace(/"/g,'""')+'"';
      return s; });
    linhas.push(fixo?cel.join(''):cel.join(sep));
  });
  return linhas;
}
function bytesAnsi(str){ const map={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
  const out=new Uint8Array(str.length); for(let i=0;i<str.length;i++){ const ch=str[i], c=str.charCodeAt(i); out[i]= c<256&&!(c>=0x80&&c<0xA0) ? c : (map[ch]||0x3F); } return out; }

};

async function sha(t){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cultivve:'+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'x'+btoa(t); } }

/* liga este aparelho (usuário anônimo do Firebase) à empresa — as regras do banco só liberam os dados da empresa vinculada */
async function garantirMembro(empresaId,codigo){
  if(Store.mode!=='cloud' || !Store.auth || !Store.auth.currentUser || !codigo) return true;
  const id=Store.auth.currentUser.uid;
  const chave=id+'|'+empresaId+'|'+codigo; if(LS.get('cvinv_mb','')===chave) return true;
  try{ const m=await Store.get('membros',id); if(m && m.empresaId===empresaId && m.codigo===codigo){ LS.set('cvinv_mb',chave); return true; } }catch(e){}
  try{ await Store.fs.collection('membros').doc(id).set({empresaId,codigo,ts:now()}); LS.set('cvinv_mb',chave); return true; }catch(e){ console.warn('membro',e); return false; }
}
async function resolverCodigo(c,idSalvo){
  c=String(c||'').trim().toUpperCase(); if(!c) return {erro:'Digite o código'};
  /* caminho rápido: empresa já usada neste aparelho → abre com a cópia guardada e atualiza em segundo plano */
  if(idSalvo && (adminOk() || (Store.auth&&Store.auth.currentUser&&LS.get('cvinv_mb','')===Store.auth.currentUser.uid+'|'+idSalvo+'|'+c) || Store.mode!=='cloud')){
    const loc=await Store.getLocal('empresas',idSalvo);
    if(loc && loc.status!=='bloqueada' && (adminOk() || loc.codigo===c)){
      LS.set('cvinv_emp',loc.id); LS.set('cvinv_emp_cod',c);
      setTimeout(async()=>{ try{ await garantirMembro(loc.id,c); const r=await Store.get('empresas',loc.id); if(r && S.empresa && S.empresa.id===r.id){ S.empresa=r; if(r.status==='bloqueada'){ toast('O acesso desta empresa está suspenso. Fale com a Cultivve.',true); S.empresa=null; go('acesso',false); } } }catch(e){} },0);
      return {empresa:loc};
    }
  }
  let empId=null;
  const cd=await Store.get('codigos',c).catch(e=>{ console.warn('codigos',e); return null; });
  if(cd && cd.empresaId) empId=cd.empresaId;
  else if(idSalvo && adminOk()) empId=idSalvo;
  else { const r=(await Store.list('empresas','codigo',c).catch(()=>[]))[0]; if(r) empId=r.id; }
  if(!empId) return {erro:'Código não encontrado. Confira com a Cultivve.'};
  await garantirMembro(empId,c);
  const r=await Store.get('empresas',empId).catch(()=>null);
  if(!r) return {erro:'Não foi possível entrar nesta empresa. Fale com a Cultivve.'};
  if(r.status==='bloqueada') return {erro:'O acesso desta empresa está suspenso. Fale com a Cultivve.'};
  LS.set('cvinv_emp',r.id); LS.set('cvinv_emp_cod',c);
  const lista=(LS.get('cvinv_emps',[])||[]).filter(x=>x.id!==r.id); lista.unshift({id:r.id,codigo:c,nome:r.fantasia||r.razao||c,cidade:[r.cidade,r.uf].filter(Boolean).join('/')}); LS.set('cvinv_emps',lista.slice(0,12));
  return {empresa:r};
}
async function entrarCodigo(c,idSalvo){
  const x=await resolverCodigo(c,idSalvo);
  if(x.erro){ toast(x.erro,true); return false; }
  S.empresa=x.empresa; S.stack=[]; await go('inicio',false); return true;
}

async function exportarEmpresa(e){

async function restaurarBackup(file){
  let j; try{ j=JSON.parse(await file.text()); }catch(e){ return toast('Arquivo inválido',true); }
  if(!j||j.tipo!=='cultivve-inventario-backup'||!j.empresa) return toast('Este arquivo não é um backup do Inventário Cultivve',true);
  const nl=j.inventarios.reduce((s,i)=>s+(i._lancamentos||[]).length,0);
  if(!await ask(`Restaurar <b>${esc(j.empresa.fantasia)}</b> (backup de ${dtBR(j.geradoEm)}): ${j.inventarios.length} inventário(s), ${fmt(nl)} lançamento(s).<br><br>Os registros com o mesmo identificador serão sobrescritos.`,{ok:'Restaurar',danger:true,title:'Restaurar backup'})) return;
  try{
    toast('Restaurando…');
    await Store.setMany('empresas',[j.empresa]);
    if(j.empresa.codigo) await Store.set('codigos',j.empresa.codigo,{empresaId:j.empresa.id});
    for(const inv of j.inventarios){ const {_produtos,_lancamentos,_log,...d}=inv; await Store.setMany('inventarios',[d]);
      await Store.setMany('inventarios/'+inv.id+'/produtos',_produtos||[]); await Store.setMany('inventarios/'+inv.id+'/lancamentos',_lancamentos||[]); await Store.setMany('inventarios/'+inv.id+'/log',_log||[]); }
    if(j.historico&&j.historico.length) await Store.setMany('historico',j.historico);
    S.hist=null; toast('Backup restaurado'); V.admin();
  }catch(err){ console.error(err); toast('Erro ao restaurar: '+(err.message||err),true); }
}

const hojeKey=()=>new Date().toLocaleDateString('sv-SE').replace(/-/g,'');
async function usoHoje(){ const d=await Store.get('config','uso_'+hojeKey()).catch(()=>null); return (d&&d.si5)||0; }
async function somaUso(){ const id='uso_'+hojeKey();
  if(Store.mode==='cloud'){ try{ await Store.fs.collection('config').doc(id).set({si5:firebase.firestore.FieldValue.increment(1)},{merge:true}); }catch(e){} }
  else { const n=await usoHoje(); await Store.set('config',id,{si5:n+1}); } }
async function tokenSi5(){ const c=await cfgCultivve(); return c.si5Token||''; }
async function podeConsultar(){ const c=await cfgCultivve(); return (await usoHoje()) < (c.si5Limite||25); }
let SI5_ULT={motivo:'',ok:false};
/* Consulta a SI5. Com "servidor de consulta" (Google Apps Script da Cultivve) a chamada sai do servidor,
   como a SI5 exige; sem ele, tenta direto do navegador (a SI5 costuma bloquear). */
async function chamaSi5(code,tok,proxy){
  const g=String(code).replace(/\D/g,'');
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),proxy?15000:8000);
  try{
    if(proxy){
      const r=await fetch(proxy+(proxy.includes('?')?'&':'?')+'gtin='+encodeURIComponent(g),{signal:ctl.signal,redirect:'follow'});
      clearTimeout(t);
      let j=null; try{ j=await r.json(); }catch(e){ return {status:0,erro:'o servidor de consulta não respondeu em JSON (confira se foi implantado com acesso "Qualquer pessoa")'}; }
      return {status:+j.status||0,j:j.data||null,erro:j.erro||'o servidor de consulta respondeu sem status'};
    }
    const r=await fetch('https://global.si5.com.br/api/produtos/'+encodeURIComponent(g),{headers:{Authorization:'Bearer '+tok,Accept:'application/json'},signal:ctl.signal});
    clearTimeout(t);
    let j=null; try{ j=await r.json(); }catch(e){}
    return {status:r.status,j};
  }catch(e){ clearTimeout(t); return {status:0,erro:e&&e.name==='AbortError'?'tempo esgotado':(proxy?'não conseguiu falar com o servidor de consulta':'a SI5 bloqueou a chamada direta do navegador — configure o servidor de consulta')+' ('+((e&&e.message)||e)+')'}; }
}
/* busca um código: catálogo → SI5 (dentro do limite do dia). Guarda tudo no catálogo, inclusive "não achado".
   forcar=true ignora o "não achado" guardado e consulta a SI5 de novo. */
async function consultaGtin(code,{usarApi=true,forcar=false}={}){
  SI5_ULT={motivo:'',ok:false};
  const k=gtinKey(code); if(k.length<8){ SI5_ULT.motivo='código curto demais para consulta'; return null; }
  let c=null; try{ c=await Promise.race([Store.get('catalogo',k),new Promise(r=>setTimeout(()=>r(null),3000))]); }catch(e){}
  if(c && c.descricao && !c.naoEncontrado) return {...c,fonte:'catálogo Cultivve'};
  if(!forcar && c && c.naoEncontrado && (Date.now()-new Date(c.criadoEm||0).getTime())<7*864e5){ SI5_ULT.motivo='a SI5 já respondeu "não encontrado" em '+new Date(c.criadoEm).toLocaleDateString('pt-BR'); return null; }
  if(!usarApi){ SI5_ULT.motivo='consulta externa desligada'; return null; }
  const cfg=await cfgCultivve(); const tok=cfg.si5Token||''; const proxy=(cfg.si5Proxy||'').trim();
  if(!tok && !proxy){ SI5_ULT.motivo='consulta SI5 não configurada (Cultivve › Catálogo)'; return null; }
  const uso=await usoHoje();
  if(uso>=(cfg.si5Limite||25)){ SI5_ULT.motivo='limite do app atingido hoje ('+uso+'/'+(cfg.si5Limite||25)+')'; return null; }
  const r=await chamaSi5(code,tok,proxy);
  if(r.status) somaUso();
  if(r.status===404){ Store.set('catalogo',k,{gtin:k,naoEncontrado:true,criadoEm:now()}); SI5_ULT.motivo=proxy?'nenhuma fonte tem esse código ('+(r.erro||'404')+')':'a SI5 não tem esse código no catálogo dela (404)'; return null; }
  if(r.status===401||r.status===403){ SI5_ULT.motivo='token da SI5 inválido ou vencido ('+r.status+')'; return null; }
  if(r.status===429){ SI5_ULT.motivo='a SI5 recusou: limite diário do plano atingido (429)'; return null; }
  if(!r.status){ SI5_ULT.motivo='sem resposta da SI5: '+r.erro; return null; }
  if(r.status<200||r.status>=300){ SI5_ULT.motivo=(proxy&&r.erro)?r.erro:'a SI5 respondeu erro '+r.status; return null; }
  const j=r.j; const nome=j&&(j.produto||j.descricao||j.nome);
  if(!nome){ SI5_ULT.motivo='a SI5 respondeu sem nome de produto'; return null; }
  const d={gtin:k,descricao:String(nome).toUpperCase(),marca:j.marca||'',categoria:j.categoria||'',ncm:j.ncm||'',imagem:j.imagem_url||'',origem:j.fonte||'SI5',criadoEm:now(),naoEncontrado:false};
  Store.set('catalogo',k,d); SI5_ULT={motivo:'',ok:true};
  return {...d,fonte:j.fonte||'SI5 Global'};
}
/* As imagens NÃO são gravadas em cada produto (economiza a cota do banco):
   ficam no catálogo da Cultivve e em memória neste aparelho. */
const gtinDe=p=>gtinKey(String((p&&p.ean)||'').split(/[;,\s]+/)[0]);

let imgT=null;

/* associa os produtos do inventário ao catálogo (consulta em lotes de 30 códigos) */
async function carregarImagens(){
  if(!S.inv) return;
  const ks=[...new Set(S.produtos.map(gtinDe).filter(k=>k.length>=8 && !S.imgReq.has(k)))];
  if(!ks.length) return;
  ks.forEach(k=>S.imgReq.add(k));
  try{
    const docs=await Store.listIn('catalogo',ks);
    docs.forEach(d=>{ if(!d.naoEncontrado && d.descricao) S.img.set(d.id,d); });
    if(docs.some(d=>d.imagem)){ if(S.view==='contar') renderFast(); if(S.view==='gestor') V.gestor_refresh(); const L=$('#lsL'); if(L) drawLista(); }
  }catch(e){ ks.forEach(k=>S.imgReq.delete(k)); console.warn('catálogo',e); }
}
const enriquecerInventario=carregarImagens;
/* ao bipar: se o produto ainda não tem imagem, busca agora (catálogo e, se preciso, consulta externa) — a cota diária vai para o que está sendo contado */
async function enriquecerAgora(p){
  const k=gtinDe(p); if(!p || k.length<8 || imgDe(p) || S.imgTent.has(k)) return;
  S.imgTent.add(k);
  const info=await consultaGtin(k);
  if(info){ S.img.set(k,info); if(S.pend && S.pend.p===p) renderFast(); }
}
function statusImagens(){ const c=S.produtos.filter(p=>gtinDe(p).length>=8); return {total:c.length,comImg:c.filter(p=>imgDe(p)).length}; }
const thumb=(p,sz=40)=>imgDe(p)?`<img class="thumb" loading="lazy" src="${esc(imgDe(p))}" alt="" style="width:${sz}px;height:${sz}px" onerror="this.style.visibility='hidden'">`:`<div class="thumb ph" style="width:${sz}px;height:${sz}px">📦</div>`;

/* ---------- CONFIGURAÇÕES ---------- */
V.config = ()=>{
  header('Suporte técnico','Uso exclusivo da Cultivve');
  const cfg=Store.cfg();
  const link = cfg ? location.origin+location.pathname+'#cfg='+btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))) : '';
  $('#app').innerHTML=`<div class="stack">
    <div class="card stack"><div class="row between"><h2>Firebase (vários celulares)</h2><span class="badge ${Store.mode==='cloud'?'b-ok':'b-warn'}">${Store.mode==='cloud'?'Conectado':'Modo local'}</span></div>
      <div class="small muted">Cole aqui o <b>firebaseConfig</b> do seu projeto (Console do Firebase → Configurações do projeto → Seus apps → Web). Pode colar o trecho inteiro do código.</div>
      <textarea class="in" id="cfgT" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", appId: "..." }'>${cfg?esc(JSON.stringify(cfg,null,2)):''}</textarea>
      <div class="row"><button class="btn" id="cfgS">Salvar e reconectar</button>${LS.get('cvinv_fbcfg')?'<button class="btn sec" id="cfgD">Voltar ao modo local</button>':''}</div></div>
    ${cfg?`<div class="card stack"><h2>Conectar outros celulares</h2><div class="small muted">Envie este link aos contadores (WhatsApp). Ao abrir, o celular já fica conectado à mesma base. Depois é só adicionar à tela inicial.</div>
      <input class="in mono" readonly value="${esc(link)}" id="lnk"><button class="btn sec" id="cp">Copiar link</button></div>`:''}
    <div class="card stack"><h2>Instalar no celular</h2>
      <div class="small"><b>iPhone (Safari):</b> toque em Compartilhar ⬆ → “Adicionar à Tela de Início”.<br><b>Android (Chrome):</b> menu ⋮ → “Instalar app” ou “Adicionar à tela inicial”.</div></div>
    <div class="card small muted">Este aparelho: <span class="mono">${DEV}</span> · versão ${APP_VERSION}</div></div>`;
  $('#cfgS').onclick=()=>{ const c=parseCfg($('#cfgT').value); if(!c) return toast('Não reconheci o firebaseConfig (precisa de apiKey e projectId)',true); LS.set('cvinv_fbcfg',c); toast('Salvo. Reiniciando…'); setTimeout(()=>location.reload(),700); };
  const d=$('#cfgD'); if(d) d.onclick=async()=>{ if(await ask('Desconectar deste Firebase e voltar ao modo local neste aparelho?',{ok:'Voltar ao local'})){ LS.del('cvinv_fbcfg'); location.reload(); } };
  const cp=$('#cp'); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText($('#lnk').value); toast('Link copiado'); }catch(e){ $('#lnk').select(); toast('Selecione e copie o link'); } };
};
function parseCfg(txt){
  txt=String(txt||'');
  try{ const j=JSON.parse(txt); if(j.apiKey&&j.projectId) return j; }catch(e){}
  const o={}; ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{ const m=txt.match(new RegExp(k+'\\s*:\\s*["\\\']([^"\\\']+)["\\\']')); if(m) o[k]=m[1]; });
  return o.apiKey&&o.projectId?o:null;
}

/* ---------- acesso de suporte: 5 toques seguidos no rodapé ---------- */
let toques=[];
document.addEventListener('click',async e=>{
  if(!e.target.closest || !(e.target.closest('.foot')||e.target.closest('.top .logo')||e.target.closest('.hero-logo'))) return;
  if(e.target.closest('a,button')) return;
  const t=Date.now(); toques=toques.filter(x=>t-x<3000); toques.push(t);
  if(toques.length>=5){ toques=[]; if(await entrarAdmin()) go('admin'); }
});
/* ---------- instalar o app ---------- */
let promptInstalar=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstalar=e; if(S.view==='inicio'||S.view==='empresas') render(); });
function instalado(){ return window.navigator.standalone===true || matchMedia('(display-mode: standalone)').matches; }
function cardInstalar(){
  if(instalado() || LS.get('cvinv_inst_off')) return '';
  const {ios}=camEnv(); const mobile=ios || /Android/i.test(navigator.userAgent);
  if(!mobile && !promptInstalar) return '';
  return `<div class="card inst"><div class="row"><div style="font-size:30px">📲</div><div style="flex:1;min-width:0"><h3>Instale o app na tela inicial</h3>
    <div class="small muted">${promptInstalar?'Abre mais rápido, em tela cheia, e funciona sem internet.':ios?'No Safari, toque em <b>Compartilhar ⬆</b> e depois em <b>Adicionar à Tela de Início</b>.':'No Chrome, toque no menu <b>⋮</b> e depois em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).'}</div></div></div>
    <div class="row" style="margin-top:10px">${promptInstalar?'<button class="btn" id="bInst">Instalar agora</button>':''}<button class="btn ghost" id="bInstX">Agora não</button></div></div>`;
}
document.addEventListener('click',async e=>{
  if(e.target.id==='bInst' && promptInstalar){ promptInstalar.prompt(); try{ await promptInstalar.userChoice; }catch(x){} promptInstalar=null; render(); }
  if(e.target.id==='bInstX'){ LS.set('cvinv_inst_off',true); const c=e.target.closest('.inst'); if(c) c.remove(); }
});

/* =====================================================================
   INÍCIO
   ===================================================================== */
window.addEventListener('hashchange',()=>{ const m=location.hash.match(/^#e=([A-Za-z0-9]+)/); if(m){ history.replaceState(null,'',location.pathname); entrarCodigo(m[1].toUpperCase()); } });
(async function boot(){
  if(location.hash.startsWith('#cfg=')){
    try{ const c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5))))); if(c.apiKey&&c.projectId){ LS.set('cvinv_fbcfg',c); } }catch(e){ console.warn(e); }
    history.replaceState(null,'',location.pathname);
  }
  const sm=t=>{ const el=$('#splashMsg'); if(el) el.textContent=t; };
  const lento=setTimeout(()=>sm('Conectando ao servidor… (a primeira vez demora um pouco mais)'),2500);
  if(Store.cfg()) sm('Conectando ao servidor…');
  await Store.init();
  sm('Carregando seus dados…');
  const hc=(location.hash.match(/^#e=([A-Za-z0-9]+)/)||[])[1];
  if(hc){ history.replaceState(null,'',location.pathname); const x=await resolverCodigo(hc); if(x.erro) toast(x.erro,true); }
  S.view='acesso';
  // só entra direto numa empresa quando o link traz o código (#e=XXXXXX); senão abre a tela da Cultivve
  // o link de acesso (#e=CÓDIGO) entra direto na empresa só na PRIMEIRA vez neste aparelho; depois (ex.: ícone na tela
  // inicial do iPhone, que guarda o link) abre sempre a página principal, com a empresa na lista "Suas empresas"
  if(hc){ const vistos=LS.get('cvinv_links',[])||[]; if(!vistos.includes(hc.toUpperCase())){ LS.set('cvinv_links',vistos.concat(hc.toUpperCase()).slice(-30));
    const last=LS.get('cvinv_emp'); const e=last?await Store.get('empresas',last).catch(()=>null):null; if(e && e.status!=='bloqueada'){ S.empresa=e; S.view='inicio'; } } }
  clearTimeout(lento);
  render();
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)); }
})();
</script>
