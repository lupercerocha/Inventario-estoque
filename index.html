<style>
:root{
  --teal:#3AA094; --teal2:#00AE9C; --teal-soft:#e3f3f1; --navy:#172334; --ink:#000924;
  --gray:#F2F1F1; --line:#dde2e6; --muted:#5d6b7a; --white:#fff;
  --red:#c8463d; --red-soft:#fbe9e7; --amber:#c98a12; --amber-soft:#fdf3dc; --blue:#2c6fb7; --blue-soft:#e6effa;
  --r:12px; --sh:0 1px 2px rgba(23,35,52,.06),0 4px 14px rgba(23,35,52,.06);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--gray);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Chakra Petch","DM Sans",sans-serif;margin:0;color:var(--navy);letter-spacing:.2px}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
.mono{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:.03em;font-size:.95em}
button,input,select{font:inherit;color:inherit}
a{color:var(--teal)}

/* Header */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px}
.top .back{background:rgba(255,255,255,.08);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
.top .logo{height:20px;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-family:"Chakra Petch";font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:#BACAD3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ic{background:rgba(255,255,255,.08);border:0;color:#fff;height:38px;padding:0 12px;border-radius:10px;cursor:pointer;font-size:13px;flex:none}
.modebar{font-size:12px;padding:5px 16px;text-align:center}
.modebar.local{background:var(--amber-soft);color:#7a5408}
.modebar.cloud{background:var(--teal-soft);color:#1d6b62}

main{width:100%;padding:16px 16px calc(28px + var(--safe-b))}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid #e9ecef}
.card.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.click:active{transform:scale(.99)}
.card .sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.dark{background:var(--navy)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--teal);padding:8px 10px;min-height:auto}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

label.f{display:block;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select{margin-top:4px}
input.in,select.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:44px;font-size:16px}
input.in:focus,select.in:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--teal-soft);color:#1d6b62}
.b-warn{background:var(--amber-soft);color:#7a5408}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:#eceff1;color:#4a5866}

.kpi .card{padding:14px}
.kpi .v{font-family:"Chakra Petch";font-size:26px;color:var(--navy);line-height:1.1;overflow-wrap:anywhere}
.kpi .card{min-width:0}
@media(max-width:600px){.kpi .v{font-size:clamp(19px,6vw,26px)}}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid #e9ecef;background:#fff;box-shadow:var(--sh)}
table.t{width:100%;min-width:680px;border-collapse:collapse;font-size:14px}
table.t th{position:sticky;top:0;background:#f7f8f9;text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid #f0f2f4;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.hl td{background:#fffaf0}
.pos{color:#1d7a46;font-weight:700}.neg{color:var(--red);font-weight:700}

.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Leitor */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px}.chk[hidden],[hidden]{display:none!important}
.cam{position:relative;background:#0d1622;border-radius:var(--r);overflow:hidden;height:36vh;min-height:220px;max-height:420px}
.cam video{width:100%;height:100%;object-fit:cover;display:none}
.cam.live video{display:block}
.cam .guide{position:absolute;left:4%;top:27.5%;width:92%;height:45%;display:none;pointer-events:none;transition:left .16s ease-out,top .16s ease-out,width .16s ease-out,height .16s ease-out}
.guide.lock i{border-color:#7CFFB2;border-width:4px}
.guide.lock .laser{display:none}
.guide.lock{background:rgba(124,255,178,.10);border-radius:10px}
.cam.live .guide{display:block}
.guide i{position:absolute;width:26px;height:26px;border:3px solid var(--teal2)}
.guide i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.guide i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.guide i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.guide i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.laser{position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 10px #ff4d4d;opacity:.85}
.cam.hit .guide i{border-color:#7CFFB2}
.cam.hit::after{content:"";position:absolute;inset:0;background:rgba(0,174,156,.28);animation:fl .3s forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.camtools{position:absolute;top:10px;right:10px;display:none;gap:8px}
.cam.live .camtools{display:flex}
.camtools button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:15px;cursor:pointer;backdrop-filter:blur(4px)}
.camtools button.on{background:var(--teal)}
.caminfo{position:absolute;left:10px;bottom:8px;right:10px;color:#e8f1f4;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.03em;text-shadow:0 1px 2px #000;display:none}
.cam.live .caminfo{display:block}
.camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#BACAD3;text-align:center;padding:18px}
.cam.live .camoff{display:none}
.fast{border:2px solid var(--teal)}
.fast.ok{border-color:#9fd9d1;background:#f4fbfa}
.fast .fd{font-size:16px;display:block}
.qrow{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-top:10px}
.stp{border:1px solid var(--line);background:#fff;border-radius:12px;font-size:28px;font-weight:700;cursor:pointer;color:var(--navy)}
.qty.bump{animation:bp .25s}
@keyframes bp{50%{transform:scale(1.06);background:var(--teal-soft)}}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.ftag{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#5b4a1f;background:#f6efdc;border-radius:6px;padding:1px 7px;letter-spacing:.2px}
.gtag{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#1d6b62;background:var(--teal-soft);border-radius:6px;padding:1px 7px;letter-spacing:.2px}
.res .d .gtag{display:inline-block;color:#1d6b62;font-size:11px;margin-left:0}
.ov.full{align-items:stretch;justify-content:stretch}
.ov.full .md{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0;display:flex;flex-direction:column;padding-top:calc(14px + var(--safe-t))}
.lslist{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.lsh{position:sticky;top:0;z-index:1;background:var(--navy);color:#fff;font-family:"Chakra Petch";font-size:13px;padding:6px 10px;border-radius:8px;margin:10px 0 6px}
.res.done{opacity:.6}
.tabs button small{opacity:.7;font-weight:500}
.task{border:2px solid var(--teal);background:linear-gradient(180deg,#fff,#f3fbfa)}
.round-dot.big{width:54px;height:54px;font-size:20px;border-radius:14px}
.bars{display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding-top:6px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:none}
.bar .bf{width:70%;border-radius:6px 6px 2px 2px;min-height:2px}
.bar .bv{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:3px;white-space:nowrap}
.bar .bl{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.ecol{display:grid;grid-template-columns:minmax(150px,2fr) minmax(90px,1.4fr) 70px minmax(80px,1fr) auto;gap:6px;align-items:center;margin-top:6px}
.ecol.head{margin-top:10px}
.ecol .in{min-height:38px;padding:6px 8px;font-size:14px}
pre.prev{background:#0d1622;color:#cfe;padding:12px;border-radius:10px;overflow:auto;font-size:12px;font-family:"JetBrains Mono",monospace;white-space:pre;margin:8px 0 0}
.adj.ent{border-left:5px solid #1d7a46}.adj.sai{border-left:5px solid var(--red)}
.ptabs button{font-size:14px;padding:9px 14px}
.cadbtn{display:block;width:100%;margin-top:8px;padding:8px 10px;border:1px dashed #b9c4cf;border-radius:10px;background:#f7f9fb;color:var(--navy);font:inherit;font-size:13px;font-weight:600;text-align:left;cursor:pointer}
.cadl{display:grid;gap:4px}.cadv{font-weight:600;font-size:14px}.cadv.vazio{font-weight:500;color:#b0571f;font-size:13px}
tr.cadoff td{opacity:.5}
.etgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.etq{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:12px;text-align:center;break-inside:avoid}
.etq b{display:block;font-size:14px}.etq svg{max-width:100%;height:auto;margin-top:6px}
@media print{ .top,#modebar,.noprint,.toast{display:none!important} body,html{background:#fff} main{padding:0} .etgrid{grid-template-columns:repeat(3,1fr);gap:6px} .etq{border:1px dashed #bbb;border-radius:0;page-break-inside:avoid} }
.inst{border:2px dashed var(--teal);background:#f4fbfa}
.foot{user-select:none;-webkit-user-select:none}
.splash{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center}
.spin{width:38px;height:38px;border:4px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.thumb{flex:none;border-radius:8px;object-fit:contain;background:#fff;border:1px solid #e6e9ec}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-size:16px;background:#f4f6f7;opacity:.55}
.cam .marca{position:absolute;right:10px;bottom:8px;font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.3px;pointer-events:none}
.cam:not(.live) .marca{display:none}
.x.ed{color:var(--navy)}
.pw{position:relative;display:block}
.pw .in{padding-right:48px}
.pw .olho{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:20px;width:40px;height:40px;cursor:pointer;line-height:1}
.top .logo{cursor:default;-webkit-user-select:none;user-select:none}
@media(min-width:700px){ .ov.wide{align-items:center} .ov.wide .md{max-width:none;width:96vw;height:94vh;border-radius:18px} }
.ov.wide .md{max-height:94vh;background:var(--gray);padding:0 20px 0}
.ehead{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:flex-start;background:var(--navy);color:#fff;margin:0 -20px;padding:16px 20px;border-radius:18px 18px 0 0}
.ehead h2{color:#fff;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ehead .muted{color:#BACAD3}
.ehead .x{background:rgba(255,255,255,.12);color:#fff!important}
.ebusca{margin:14px 0}
.ecols{display:flex;flex-direction:column;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s5{grid-column:span 5}.s2x{grid-column:span 2}
.fotobox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fotobox img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff}
#zoomImg{position:fixed;inset:0;z-index:9999;background:rgba(10,16,28,.92);display:flex;align-items:center;justify-content:center;padding:16px;animation:zf .15s ease-out;cursor:zoom-out}
#zoomImg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@keyframes zf{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
img.thumb,.fotobox img{cursor:zoom-in}
.fin{border:1px solid var(--line)}.fin .kpi{margin:0;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.fin .v{white-space:nowrap;font-size:clamp(19px,1.9vw,26px)}.res-neg{background:#fdecec}.res-pos{background:#e7f6f3}
.trocas{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:10px}
.troca{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.troca.ok{border-color:var(--teal);background:#f0faf8}.troca.nao{opacity:.55}
.tr-par{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}.tr-seta{align-self:center;font-size:20px;color:var(--muted)}
.tr-it{display:flex;flex-direction:column;gap:3px;padding:8px;border-radius:8px;background:#fafafa;min-width:0}.tr-it.sai{border-left:3px solid var(--red)}.tr-it.ent{border-left:3px solid var(--teal)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:0}
@media(max-width:600px){.fin .kpi{grid-template-columns:1fr 1fr}.fin .kpi .card:last-child{grid-column:1/-1}.fin .v{font-size:18px}.trocas{grid-template-columns:1fr}.tr-par{grid-template-columns:1fr}.tr-seta{transform:rotate(90deg);justify-self:center}}
.rcols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.rcols>div>.rsec:first-child{margin-top:16px}
.rhist{margin-bottom:12px}.rhist-d{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
@media(max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g12{grid-template-columns:repeat(6,minmax(0,1fr))} .g12 .s5,.g12 .s3{grid-column:span 3} .g12 .s1,.g12 .s2{grid-column:span 2} .rcols{grid-template-columns:1fr} }
.ecol-l{display:flex;flex-direction:column;gap:14px}
.ecols>*,.ecol-l>*{min-width:0}
.rsec{overflow-x:auto}
@media(max-width:699px){ .ov.wide .md{padding:0 12px} .ehead{margin:0 -12px;padding:14px 12px} }
.epanel{background:#fff;border:1px solid #e6e9ec;border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.g{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s2c{grid-column:1/-1}
@media(max-width:600px){ .g2,.g4,.g6,.g12{grid-template-columns:1fr!important} .g .s1,.g .s2,.g .s3,.g .s4,.g .s5,.g .s2x{grid-column:1/-1!important} }
.rgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.rtile{background:var(--gray);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rtile span{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.rtile b{font-size:14px;color:var(--navy);overflow-wrap:anywhere}
.rtile.ok{background:var(--teal-soft)} .rtile.ok b{color:#1d6b62}

const LIBS_URL={xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'],pdf:['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js']};
const libP={};
/* bibliotecas pesadas (Excel e PDF) só são baixadas quando alguém usa — o app abre muito mais rápido */
function lib(n){
  if(n==='xlsx' && window.XLSX) return Promise.resolve();
  if(n==='pdf' && window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();

    .catch(e=>{ delete libP[n]; toast('Sem internet para carregar o gerador. Tente de novo.',true); throw e; }));
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Falha ao carregar '+src)); document.head.appendChild(s); }); }

/* ---------------- modal ---------------- */
function modal(html,{onOpen,dismiss,cls=''}={}){
  closeModal();
  if(dismiss===undefined) dismiss=!/<form|<input|<select|<textarea/i.test(html);
  const ov=document.createElement('div'); ov.className='ov '+cls; ov.id='ov';
  ov.innerHTML=`<div class="md">${html}</div>`;
  let downFora=false;
  ov.addEventListener('pointerdown',e=>{ downFora=(e.target===ov); });
  if(dismiss) ov.addEventListener('click',e=>{ if(e.target===ov && downFora) closeModal(); });
  document.body.appendChild(ov);
  addOlho(ov);
  onOpen && onOpen(ov);
  return ov;
}
let modalCloseCb=null;
function addOlho(root){
  root.querySelectorAll('input[type=password]').forEach(i=>{
    if(i.dataset.olho) return; i.dataset.olho='1';
    const w=document.createElement('span'); w.className='pw'; i.parentNode.insertBefore(w,i); w.appendChild(i);
    const b=document.createElement('button'); b.type='button'; b.className='olho'; b.setAttribute('aria-label','Mostrar senha'); b.textContent='👁';
    b.onclick=()=>{ const v=i.type==='password'; i.type=v?'text':'password'; b.textContent=v?'🙈':'👁'; b.setAttribute('aria-label',v?'Esconder senha':'Mostrar senha'); i.focus(); };
    w.appendChild(b);
  });
}
function closeModal(){ const o=$('#ov'); if(o){ o.remove(); const cb=modalCloseCb; modalCloseCb=null; cb&&cb(); } }
function ask(msg,{ok='Confirmar',danger=false,title='Confirmar'}={}){
  return new Promise(res=>{
    let done=false;
    modal(`<h2>${esc(title)}</h2><p class="muted">${msg}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mNo">Cancelar</button><button class="btn ${danger?'red':''}" id="mOk">${esc(ok)}</button></div>`,
      {onOpen:o=>{ $('#mNo',o).onclick=()=>{done=true;closeModal();res(false)}; $('#mOk',o).onclick=()=>{done=true;closeModal();res(true)}; }});
    modalCloseCb=()=>{ if(!done) res(false); };
  });
}
function askText(title,{label='',value='',type='text',placeholder='',inputmode=''}={}){
  return new Promise(res=>{
    let done=false;
    modal(`<h2>${esc(title)}</h2><label class="f" style="margin-top:12px">${esc(label)}<input class="in" id="mTx" type="${type}" ${inputmode?`inputmode="${inputmode}"`:''} value="${esc(value)}" placeholder="${esc(placeholder)}"></label><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mNo">Cancelar</button><button class="btn" id="mOk">OK</button></div>`,
      {onOpen:o=>{ const i=$('#mTx',o); setTimeout(()=>i.focus(),60);
        const go=()=>{done=true;const v=i.value;closeModal();res(v)};
        i.onkeydown=e=>{ if(e.key==='Enter') go(); };
        $('#mNo',o).onclick=()=>{done=true;closeModal();res(null)}; $('#mOk',o).onclick=go; }});
    modalCloseCb=()=>{ if(!done) res(null); };
  });
}

/* =====================================================================
   CAMADA DE DADOS — Firestore (vários aparelhos) ou local (1 aparelho)
   ===================================================================== */
const Store = {
  mode:'local', fs:null, mem:null, subs:{},
  cfg(){ return LS.get('cvinv_fbcfg') || FIREBASE_CONFIG; },
  async init(){
    const cfg=this.cfg();
    if(cfg && cfg.projectId){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await Promise.all([loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'),
          loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js').catch(e=>console.warn('auth não carregou'))]);
        if(!firebase.apps.length) firebase.initializeApp(cfg);
        if(firebase.auth){ try{
          this.auth=firebase.auth();
          const u=await new Promise(res=>{ const un=this.auth.onAuthStateChanged(x=>{ un(); res(x); }); });
          if(!u) await this.auth.signInAnonymously();
          this.authOk=true;
        }catch(e){ this.authErr=e.code||String(e); console.warn('auth',e); } }
        this.fs=firebase.firestore();
        try{ await this.fs.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('persistência offline',e.code); }
        this.mode='cloud';
      }catch(e){ console.error(e); toast('Sem conexão com o Firebase — usando modo local',true); }
    }
    if(this.mode==='local'){
      window.addEventListener('storage',e=>{ if(e.key==='cvinv_db'){ this.mem=null; Object.keys(this.subs).forEach(c=>this._emit(c)); } });
    }
  },
  _db(){ if(!this.mem){ this.mem=LS.get('cvinv_db',{})||{}; } return this.mem; },
  _save(){ try{ localStorage.setItem('cvinv_db',JSON.stringify(this.mem)); }catch(e){ toast('Memória do aparelho cheia',true); } },
  _rows(col,field,val){ const c=this._db()[col]||{}; let r=Object.entries(c).map(([id,d])=>({id,...d})); if(field) r=r.filter(x=>x[field]===val); return r; },
  _emit(col){ (this.subs[col]||[]).forEach(s=>s.cb(this._rows(col,s.field,s.val))); },
  async list(col,field,val){
    if(this.mode==='cloud'){ let q=this.fs.collection(col); if(field) q=q.where(field,'==',val); const s=await q.get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
    return this._rows(col,field,val);
  },
  async listIn(col,ids){
    if(!ids.length) return [];
    if(this.mode==='cloud'){ const out=[]; const F=firebase.firestore.FieldPath.documentId();
      for(let i=0;i<ids.length;i+=30){ const s=await this.fs.collection(col).where(F,'in',ids.slice(i,i+30)).get(); s.docs.forEach(d=>out.push({id:d.id,...d.data()})); }
      return out; }
    const set=new Set(ids); return this._rows(col).filter(r=>set.has(r.id));
  },
  async updateMany(col,items){
    if(this.mode==='cloud'){ for(let i=0;i<items.length;i+=400){ const b=this.fs.batch(); items.slice(i,i+400).forEach(x=>b.set(this.fs.collection(col).doc(x.id),x.data,{merge:true})); await b.commit(); } return; }
    const db=this._db(); db[col]=db[col]||{}; items.forEach(x=>db[col][x.id]={...(db[col][x.id]||{}),...x.data}); this._save(); this._emit(col);
  },
  async setMany(col,docs){
    if(this.mode==='cloud'){ for(let i=0;i<docs.length;i+=400){ const b=this.fs.batch(); docs.slice(i,i+400).forEach(({id,...d})=>b.set(this.fs.collection(col).doc(id),d)); await b.commit(); } return; }
    const db=this._db(); db[col]=db[col]||{}; docs.forEach(({id,...d})=>db[col][id]=d); this._save(); this._emit(col);
  },
  async get(col,id){
    if(this.mode==='cloud'){ const ref=this.fs.collection(col).doc(id);
      // se a rede travar (comum no iPhone ao voltar do segundo plano), usa a cópia local depois de 8 s
      const d=await Promise.race([ref.get(),new Promise(r=>setTimeout(()=>r(null),5000))]) || await ref.get({source:'cache'}).catch(()=>null);
      if(!d) throw new Error('sem resposta do banco de dados (internet lenta?)');
      return d.exists?{id:d.id,...d.data()}:null; }
    const d=(this._db()[col]||{})[id]; return d?{id,...d}:null;
  },
  /* lê só a cópia guardada no aparelho (instantâneo); null se não houver */
  async getLocal(col,id){
    if(this.mode==='cloud'){ try{ const d=await this.fs.collection(col).doc(id).get({source:'cache'}); return d.exists?{id:d.id,...d.data()}:null; }catch(e){ return null; } }
    return this.get(col,id);
  },
  async set(col,id,data){
    if(this.mode==='cloud'){ this.fs.collection(col).doc(id).set(data,{merge:true}).catch(e=>toast('Erro ao salvar: '+e.code,true)); return id; }
    const db=this._db(); db[col]=db[col]||{}; db[col][id]={...(db[col][id]||{}),...data}; this._save(); this._emit(col); return id;
  },
  async add(col,data){
    if(this.mode==='cloud'){ const ref=this.fs.collection(col).doc(); ref.set(data).catch(e=>toast('Erro ao salvar: '+e.code,true)); return ref.id; } // sem await: funciona offline
    return this.set(col,uid(),data);
  },
  async del(col,id){
    if(this.mode==='cloud'){ this.fs.collection(col).doc(id).delete().catch(e=>toast('Erro ao excluir: '+e.code,true)); return; }
    const db=this._db(); if(db[col]) delete db[col][id]; this._save(); this._emit(col);
  },
  async addMany(col,arr,onProg){
    if(this.mode==='cloud'){
      for(let i=0;i<arr.length;i+=400){ const b=this.fs.batch(); arr.slice(i,i+400).forEach(d=>b.set(this.fs.collection(col).doc(),d)); await b.commit(); onProg&&onProg(Math.min(i+400,arr.length)); }
      return;
    }
    const db=this._db(); db[col]=db[col]||{}; arr.forEach(d=>db[col][uid()]=d); this._save(); this._emit(col);
  },
  async delMany(col,ids){
    if(this.mode==='cloud'){ for(let i=0;i<ids.length;i+=400){ const b=this.fs.batch(); ids.slice(i,i+400).forEach(id=>b.delete(this.fs.collection(col).doc(id))); await b.commit(); } return; }
    const db=this._db(); ids.forEach(id=>{ if(db[col]) delete db[col][id]; }); this._save(); this._emit(col);
  },
  watch(col,cb,field,val){
    if(this.mode==='cloud'){
      let un=null, vivo=true, tent=0;
      const sub=()=>{ let q=this.fs.collection(col); if(field) q=q.where(field,'==',val);
        un=q.onSnapshot({includeMetadataChanges:true},s=>cb(s.docs.map(d=>({id:d.id,...d.data()})),s.docs.filter(d=>d.metadata.hasPendingWrites).length), async e=>{ console.error(e); if(!vivo) return;
          // sem permissão logo ao entrar = vínculo do aparelho com a empresa ainda sendo gravado: refaz o vínculo e tenta de novo, sem assustar o usuário
          if(e.code==='permission-denied' && tent<3 && S.empresa){ tent++; LS.del('cvinv_mb'); try{ await garantirMembro(S.empresa.id,S.empresa.codigo); }catch(x){} setTimeout(()=>{ if(vivo) sub(); },1200*tent); return; }
          toast('Erro de sincronização'+(ehMaster()?': '+e.code:''),true); }); };
      sub(); return ()=>{ vivo=false; if(un) un(); };
    }
    const s={cb,field,val}; (this.subs[col]=this.subs[col]||[]).push(s);
    setTimeout(()=>cb(this._rows(col,field,val)),0);
    return ()=>{ this.subs[col]=(this.subs[col]||[]).filter(x=>x!==s); };
  },
  watchDoc(col,id,cb){
    if(this.mode==='cloud') return this.fs.collection(col).doc(id).onSnapshot(d=>cb(d.exists?{id:d.id,...d.data()}:null));
    const s={cb:rows=>cb(rows.find(r=>r.id===id)||null)}; (this.subs[col]=this.subs[col]||[]).push(s);
    setTimeout(()=>s.cb(this._rows(col)),0);
    return ()=>{ this.subs[col]=(this.subs[col]||[]).filter(x=>x!==s); };
  }
};

const S = {
  view:'empresas', stack:[], empresa:null, inv:null, produtos:[], lanc:[], idxEan:new Map(), idxCod:new Map(),
  unsub:[], contador:LS.get('cvinv_nome',''), rodada:null, scanning:false, img:new Map(), imgReq:new Set(), imgTent:new Set(), pendWrites:0,

function clearSubs(){ S.unsub.forEach(u=>{try{u()}catch(e){}}); S.unsub=[]; }
function go(view,push=true){ if(S.view==='contar' && S.pend) confirmPending(); if(push && S.view!==view){ S.stack.push(S.view); try{history.pushState({v:view},'')}catch(e){} } stopScanner(); S.view=view; const p=render(); window.scrollTo(0,0); return p; }
function backInternal(){ if(S.view==='contar' && S.pend) confirmPending(); stopScanner(); closeModal(); const v=S.stack.pop(); if(!v) return; if(v==='empresas'||v==='inventarios'||v==='inicio'||v==='painel'){ clearSubs(); S.inv=null; lancMode=null; } S.view=v; render(); window.scrollTo(0,0); }

function indexProdutos(){
  S.idxEan=new Map(); S.idxCod=new Map();
  S.produtos.forEach(p=>{ if(p.ean) String(p.ean).split(/[;,\s]+/).forEach(e=>{ if(!e) return; if(/^\d+$/.test(e)){ const k=eanKey(e); if(k) S.idxEan.set(k,p); } else S.idxEan.set('#'+norm(e),p); }); if(p.codigo) S.idxCod.set(norm(p.codigo),p); });
}
function findExact(code){
  const c=String(code||'').trim(); if(!c) return null;
  // QR Code e RFID (EPC) podem ter letras: nesses casos procura pelo código exato, não pelo código de barras
  return (/^[\d\s.-]+$/.test(c)?S.idxEan.get(eanKey(c)):null) || S.idxCod.get(norm(c)) || S.idxEan.get('#'+norm(c)) || null;
}
/* ---------- itens de consulta (estoque zero) ----------
   Em bases grandes (ex.: 35 mil itens, a maioria com estoque zero) só os itens com estoque entram na lista
   de contagem. Os outros ficam guardados em blocos e, se aparecerem na prateleira, entram na hora com
   código, grupo e custo — sem gastar milhares de gravações no banco de dados. */
function carregarReserva(){
  if(!S.inv || !S.inv.reservaN) return Promise.resolve(null);
  if(S.reserva && S.reserva.inv===S.inv.id) return Promise.resolve(S.reserva);
  if(S.reservaP && S.reservaP.inv===S.inv.id) return S.reservaP.p;
  const id=S.inv.id;
  const p=Store.list('inventarios/'+id+'/reserva').then(docs=>{
    const K=['codigo','descricao','ean','unidade','grupo','subgrupo','custo','referencia','marca'];
    const list=[]; docs.forEach(d=>{ try{ JSON.parse(d.itens||'[]').forEach(a=>{ const o={_res:true}; K.forEach((k,i)=>o[k]=a[i]??''); o.custo=Number(o.custo)||0; list.push(o); }); }catch(e){} });
    const idx=new Map(); list.forEach(o=>{ if(o.ean){ const k=eanKey(o.ean); if(k) idx.set(k,o); } idx.set('c:'+norm(o.codigo),o); });
    if(S.inv && S.inv.id===id) S.reserva={inv:id,list,idx};
    return S.reserva;
  }).catch(e=>{ console.warn('reserva',e); S.reservaP=null; return null; });
  S.reservaP={inv:id,p}; return p;
}
function findReserva(code){ const R=S.reserva; if(!R) return null; const c=String(code||'').trim();
  return (/^[\d\s.-]+$/.test(c)?R.idx.get(eanKey(c)):null) || R.idx.get('c:'+norm(c)) || null; }
/* coloca o item de consulta na lista de contagem (id fixo: dois celulares bipando ao mesmo tempo não duplicam) */
function promover(it){
  const ex=S.idxCod.get(norm(it.codigo)); if(ex) return ex;
  const id='r_'+norm(it.codigo).replace(/[^a-z0-9]/g,'_');
  const d={codigo:it.codigo,descricao:it.descricao,ean:it.ean||'',unidade:it.unidade||'UN',grupo:it.grupo||'',subgrupo:it.subgrupo||'',custo:it.custo||0,referencia:it.referencia||'',marca:it.marca||'',estoque:0,novo:false,daConsulta:true};
  Store.set('inventarios/'+S.inv.id+'/produtos',id,d).catch(e=>console.warn(e));
  const p={id,...d}; S.produtos.push(p); indexProdutos(); return p;
}
/* ---------- busca ----------
   Todas as palavras digitadas precisam aparecer (em qualquer ordem, pedaço de palavra vale): "fio sil" acha "FIO 2MM ... SIL".
   Palavra que é o nome de um FABRICANTE coloca os produtos dele no topo, em seção própria; os outros que
   contêm a palavra (SILICONE, SILVER…) vêm logo abaixo. Para ver só um fabricante, use o filtro da lista. */
function marcasSet(){ const k=S.produtos.length+'|'+(S.reserva?S.reserva.list.length:0); if(S._mk&&S._mk.k===k) return S._mk.set;
  const set=new Set(); S.produtos.forEach(p=>{ if(p.marca) set.add(norm(p.marca)); }); if(S.reserva) S.reserva.list.forEach(p=>{ if(p.marca) set.add(norm(p.marca)); });
  S._mk={k,set}; return set; }
function prepBusca(q){ const ws=norm(q).split(/\s+/).filter(Boolean); const mk=marcasSet();
  // nome de fabricante com duas palavras ("3m do brasil", "soldas brasil")
  const fab=[...mk].filter(m=>m.includes(' ')&&norm(q).includes(m));
  let resto=norm(q); fab.forEach(m=>{ resto=resto.replace(m,' '); });
  const words=resto.split(/\s+/).filter(Boolean);
  return {fab:fab.concat(words.filter(w=>mk.has(w))), words:words.filter(w=>!mk.has(w)), todas:ws}; }
const hayDe=p=>p._h || (p._h=norm(p.descricao)+' '+norm(p.codigo)+' '+String(p.ean||'')+' '+norm(p.grupo)+' '+norm(p.subgrupo)+' '+norm(p.marca)+' '+norm(p.referencia));
const tokDe=p=>p._t || (p._t=new Set(norm(p.descricao+' '+(p.referencia||'')).split(/[^a-z0-9]+/).filter(Boolean)));
const daMarca=(p,B)=>B.fab.length>0 && B.fab.some(f=>norm(p.marca)===f);
function bate(p,B){ const h=hayDe(p);
  // nome de fabricante NÃO esconde nada: "sil" traz a SIL primeiro, e depois silicone, silver etc.
  for(const f of B.fab){ if(norm(p.marca)!==f && !h.includes(f)) return false; }
  for(const w of B.words){ if(!h.includes(w)) return false; }
  return true; }
function pontos(p,B){ const t=tokDe(p); let n=0; B.words.forEach(w=>{ if(t.has(w)) n+=2; else if([...t].some(x=>x.startsWith(w))) n+=1; }); B.fab.forEach(f=>{ if(norm(p.marca)===f) n+=10; }); return n; }
function search(q,limit=40){
  const B=prepBusca(q); if(!B.todas.length) return [];
  let out=S.produtos.filter(p=>bate(p,B));
  if(out.length<limit*3 && S.reserva){ const ja=new Set(S.produtos.map(p=>norm(p.codigo)));
    S.reserva.list.forEach(it=>{ if(!ja.has(norm(it.codigo)) && bate(it,B)) out.push(it); }); }
  if(out.length>1) out=out.map((p,i)=>[p,pontos(p,B),i]).sort((a,b)=>b[1]-a[1]||(a[0]._res?1:0)-(b[0]._res?1:0)||a[2]-b[2]).map(x=>x[0]);
  S.ultBusca={fab:B.fab,total:out.length,nFab:out.filter(p=>daMarca(p,B)).length,B};
  return out.slice(0,limit);
}

/* ---------------- cálculo do inventário ---------------- */
const GSEM='SEM GRUPO';
/* marca / fabricante e referência do fabricante, quando vierem da planilha */
/* linha padrão de produto — a mesma em todas as listas do app:
   descrição · Cód. interno · EAN (código de barras) · grupo › subgrupo · 🏭 fabricante/marca · ref. do fabricante */
const idsProd=p=>`<span class="mono ids">${p.ean?`EAN <span class="ean">${esc(String(p.ean).split(/[;,\s]+/).filter(Boolean).map(codFmt).join(' / '))}</span>`:`<span class="semean">s/ cód. barras</span>`} · Cód. ${esc(p.codigo)}</span>`;
const tagsProd=(p,grupo=true)=>`<span class="tags">${grupo?`<span class="gtag">${esc(gLbl(p))}</span>`:''}${fabTag(p)}</span>`;
const infoProd=(p,{check=false,grupo=true,desc=null}={})=>`<div class="d"><b>${check?'✓ ':''}${desc||esc(p.descricao)}</b>${idsProd(p)}${tagsProd(p,grupo)}</div>`;
/* destaca o que muda entre produtos parecidos da mesma lista (cor, modelo, medida, voltagem, referência):
   produtos com as duas primeiras palavras iguais formam uma "família"; a palavra que não está em todos
   os da família fica em destaque — e cor ganha uma bolinha da própria cor. */
const CORES={azul:'#2563eb',verde:'#16a34a',vermelho:'#dc2626',vermelha:'#dc2626',amarelo:'#eab308',amarela:'#eab308',preto:'#111827',preta:'#111827',branco:'#ffffff',branca:'#ffffff',cinza:'#9ca3af',laranja:'#f97316',rosa:'#ec4899',roxo:'#7c3aed',roxa:'#7c3aed',marrom:'#92400e',bege:'#d6c7a1',dourado:'#ca8a04',dourada:'#ca8a04',prata:'#cbd5e1',cromado:'#cbd5e1',inox:'#cbd5e1',transparente:'#e5f3ff',incolor:'#e5f3ff',bronze:'#b45309',grafite:'#4b5563',creme:'#f5ecd7',lilas:'#c084fc',vinho:'#7f1d1d',fosco:'#6b7280'};
function descDif(lista){
  // para cada produto, acha o "gêmeo" mais parecido da mesma lista (mesma primeira palavra)
  // e destaca as palavras que ele tem e o gêmeo não tem
  const out=new Map(); const fam=new Map();
  const pal=d=>String(d||'').trim().split(/\s+/);
  const it=lista.map(p=>{ const w=pal(p.descricao); return {p,w,set:new Set(w.map(norm))}; });
  it.forEach(x=>{ const k=norm(x.w[0]||''); if(!k) return; if(!fam.has(k)) fam.set(k,[]); fam.get(k).push(x); });
  fam.forEach(g=>{ if(g.length<2) return;
    const pequena=g.length<=12;   // família pequena: destaca o que não está em TODOS; grande: compara com o gêmeo mais parecido
    g.forEach(x=>{ let best=null, bj=0;
      g.forEach(y=>{ if(y===x) return; let inter=0; x.set.forEach(t=>{ if(y.set.has(t)) inter++; }); const j=inter/(x.set.size+y.set.size-inter||1); if(j>bj){ bj=j; best=y; } });
      if(!best || bj<0.3) return;
      const comum=n=>pequena?g.every(y=>y.set.has(n)):best.set.has(n);
      const html=x.w.map(w=>{ const n=norm(w); if(comum(n)) return esc(w);
        const cor=CORES[n.replace(/[^a-z]/g,'')]; return `<mark class="dif">${cor?`<i class="cor" style="background:${cor}"></i>`:''}${esc(w)}</mark>`; }).join(' ');
      out.set(String(x.p.codigo),html); }); });
  return out;
}

function calcFrom(produtos,lanc,modo='duas'){
  const map=new Map();
  produtos.forEach(p=>map.set(String(p.codigo),{codigo:String(p.codigo),descricao:p.descricao,ean:p.ean||'',unidade:p.unidade||'',grupo:p.grupo||'',subgrupo:p.subgrupo||'',custo:Number(p.custo)||0,marca:p.marca||'',referencia:p.referencia||'',estoque:Number(p.estoque)||0,novo:!!p.novo,c:[0,0,0],n:[0,0,0]}));
  lanc.forEach(l=>{
    let r=map.get(String(l.codigo));
    if(!r){ r={codigo:String(l.codigo),descricao:l.descricao||'(sem cadastro)',ean:'',unidade:l.unidade||'',grupo:'',subgrupo:'',custo:0,estoque:0,novo:true,c:[0,0,0],n:[0,0,0]}; map.set(r.codigo,r); }
    const i=(l.rodada||1)-1; r.c[i]=r3(r.c[i]+Number(l.qtd||0)); r.n[i]++;
  });
  const rows=[...map.values()].map(r=>{
    const d12= modo==='uma' ? false : modo==='uma_conf' ? !eq(r.c[0],r.estoque) : !eq(r.c[0],r.c[1]);
    let final=null,status;
    if(!d12){ final=r.c[0]; status='ok'; }
    else if(r.n[2]>0){ final=r.c[2]; status='3a'; }
    else status='pendente';
    const dif= final==null?null:r3(final-r.estoque);
    return {...r,d12,final,status,dif};
  }).sort(byGrupo);
  const t={
    itens:rows.length, div12:rows.filter(r=>r.d12).length, pend:rows.filter(r=>r.status==='pendente').length,
    ent:rows.filter(r=>r.dif>0.0004), sai:rows.filter(r=>r.dif<-0.0004), novos:rows.filter(r=>r.novo).length,
    semDif:rows.filter(r=>r.dif!=null && eq(r.dif,0)).length
  };
  t.qEnt=r3(t.ent.reduce((s,r)=>s+r.dif,0)); t.qSai=r3(t.sai.reduce((s,r)=>s-r.dif,0));
  t.vEnt=Math.round(t.ent.reduce((s,r)=>s+r.dif*r.custo,0)*100)/100; t.vSai=Math.round(t.sai.reduce((s,r)=>s-r.dif*r.custo,0)*100)/100;
  return {rows,t};
}

function financeiro(rows,t){
  const tem=rows.some(r=>r.custo);
  const vSis=Math.round(rows.reduce((s,r)=>s+(Number(r.estoque)||0)*(r.custo||0),0)*100)/100;
  const saldo=Math.round((t.vEnt-t.vSai)*100)/100;
  return {tem,vSis,vCont:Math.round((vSis+saldo)*100)/100,vEnt:t.vEnt,vSai:t.vSai,saldo,pct:vSis?saldo/vSis*100:0};
}
/* ---------- possíveis trocas ----------
   Um item com SAÍDA (faltou) e outro com ENTRADA (sobrou) de descrição muito parecida — mesma peça com
   outra cor, modelo, medida ou referência — costuma ser venda/entrada lançada no código errado. */
const STOP=new Set(['de','da','do','das','dos','com','para','p','c','e','em','a','o','x','un','pc','cx']);
const toks=d=>norm(d).replace(/[^a-z0-9,./]+/g,' ').split(' ').filter(w=>w && !STOP.has(w));
function trocasPossiveis(t){
  const ent=t.ent.filter(r=>!r.novo||r.descricao), sai=t.sai;
  if(!ent.length||!sai.length) return [];
  const T=new Map(); [...ent,...sai].forEach(r=>{ if(!T.has(r.codigo)) T.set(r.codigo,toks(r.descricao)); });
  const porTipo=new Map(); ent.forEach(r=>{ const k=(T.get(r.codigo)[0]||''); if(!porTipo.has(k)) porTipo.set(k,[]); porTipo.get(k).push(r); });
  const cand=[];
  sai.forEach(a=>{ const ta=T.get(a.codigo); if(!ta.length) return; const A=new Set(ta);
    (porTipo.get(ta[0])||[]).forEach(b=>{ if(a.codigo===b.codigo) return;
      if(a.unidade && b.unidade && norm(a.unidade)!==norm(b.unidade)) return;
      const B=new Set(T.get(b.codigo)); let inter=0; A.forEach(w=>{ if(B.has(w)) inter++; });
      const uni=A.size+B.size-inter; const jac=uni?inter/uni:0; if(jac<0.5) return;
      const sc=jac+(a.grupo&&a.grupo===b.grupo?0.08:0)+(a.subgrupo&&a.subgrupo===b.subgrupo?0.05:0)+(a.marca&&a.marca===b.marca?0.07:0);
      cand.push({a,b,sc,muda:[[...A].filter(w=>!B.has(w)).join(' '),[...B].filter(w=>!A.has(w)).join(' ')]}); }); });
  cand.sort((x,y)=>y.sc-x.sc);
  const usadoA=new Set(), usadoB=new Set(), out=[];
  cand.forEach(c=>{ if(usadoA.has(c.a.codigo)||usadoB.has(c.b.codigo)) return; usadoA.add(c.a.codigo); usadoB.add(c.b.codigo);
    const qa=-c.a.dif, qb=c.b.dif, q=Math.min(qa,qb);
    out.push({...c,qa,qb,q,vA:qa*(c.a.custo||0),vB:qb*(c.b.custo||0),vComp:q*(c.a.custo||0),key:c.a.codigo+'|'+c.b.codigo}); });
  return out;
}

function openInv(inv,next='invhome'){

async function startCount(r){
  if(!S.produtos.length && r<3){ const ok=await ask('A planilha de estoque ainda não foi importada. Sem ela, todo produto bipado terá que ser cadastrado na hora. Continuar mesmo assim?',{ok:'Continuar'}); if(!ok) return; }

  else { const nome=await askText('Quem está contando?',{label:'Seu nome',value:S.contador,placeholder:'Ex.: Maria'});

    S.contador=nome.trim(); LS.set('cvinv_nome',S.contador); }

}

  my.innerHTML = mine.length ? mine.slice(0,200).map(l=>{ const pp=S.idxCod.get(norm(l.codigo))||{codigo:l.codigo,descricao:l.descricao}; return `<div class="lanc">${thumb(pp)}<div class="d"><b>${esc(l.descricao)}</b><span class="small muted">${idsProd(pp)} · ${new Date(l.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>${tagsProd(pp)}</div><div class="q">${fmt(l.qtd)} <small class="muted">${esc(l.unidade||'')}</small></div><button class="x ed" data-ed="${l.id}" aria-label="Corrigir">✎</button><button class="x" data-del="${l.id}" aria-label="Excluir">✕</button></div>`; }).join('')
    : '<div class="empty small">Nenhum lançamento ainda. Bipe ou busque um produto.</div>';
  my.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>excluirLanc(mine.find(x=>x.id===b.dataset.del)));
  my.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editarLanc(mine.find(x=>x.id===b.dataset.ed)));
  if(r===3){
    const l3=$('#l3'); const div=S.inv.divergentes||[];
    const done=new Set(S.lanc.filter(l=>l.rodada===3 && meu(l)).map(l=>String(l.codigo)));
    $('#c3n').textContent=`${div.filter(c=>done.has(String(c))).length} de ${div.length}`;
    l3.innerHTML = div.map(c=>{ const p=S.idxCod.get(norm(c))||{codigo:c,descricao:'(produto)'}; const ok=done.has(String(c));
      return `<div class="res" data-c3="${esc(c)}" style="${ok?'opacity:.55':''}">${thumb(p)}${infoProd(p,{check:ok})}<button class="btn sec" style="min-height:36px;padding:6px 10px" data-zero="${esc(c)}">Zero</button></div>`; }).join('') || '<div class="empty small">Nenhum item para recontar.</div>';
    l3.querySelectorAll('[data-c3]').forEach(el=>el.onclick=e=>{ if(e.target.dataset.zero!=null) return; const p=S.idxCod.get(norm(el.dataset.c3)); if(p) setPending(p,'tecl'); });
    l3.querySelectorAll('[data-zero]').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const p=S.idxCod.get(norm(b.dataset.zero)); if(p && await ask(`Registrar que <b>${esc(p.descricao)}</b> não foi encontrado (quantidade zero)?`,{ok:'Registrar zero'})) lancar(p,0); });
  }
};

function drawLista(){
  const L=$('#lsL'); if(!L) return;
  const base=baseLista();
  const mine=new Set(S.lanc.filter(l=>l.rodada===S.rodada && meu(l)).map(l=>String(l.codigo)));
  const gs=grupos(base);
  if(S.ls.g && !gs.some(x=>x.g===S.ls.g)){ S.ls.g=''; S.ls.s=''; }
  const cnt=g=>{ const arr=base.filter(p=>(p.grupo||GSEM)===g); return `${arr.filter(p=>mine.has(String(p.codigo))).length}/${arr.length}`; };
  $('#lsG').innerHTML=`<button data-g="" class="${!S.ls.g?'on':''}">Todos (${mine.size}/${base.length})</button>`+gs.map(x=>`<button data-g="${esc(x.g)}" class="${S.ls.g===x.g?'on':''}">${esc(x.g)} <small>${cnt(x.g)}</small></button>`).join('');
  const cur=gs.find(x=>x.g===S.ls.g);

  /* fabricante: campo de texto — nome exato filtra só ele; pedaço filtra os que começam (ou contêm) o texto */
  const mt=norm(S.ls.m||''); let fabOk=null;
  if(mt){ const todos=[...mc.keys()];
    const exato=todos.filter(m=>norm(m)===mt), ini=todos.filter(m=>norm(m).startsWith(mt)), cont=todos.filter(m=>norm(m).includes(mt));

  } else $('#lsMs').innerHTML='';
  $('#lsMs').style.display=$('#lsMs').innerHTML?'':'none';
  $('#lsMs').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ S.ls.m=b.dataset.m; const i=$('#lsM'); if(i) i.value=b.dataset.m; S.ls.lim=300; drawLista(); });
  const mx=$('#lsMx'); if(mx) mx.hidden=!S.ls.m; const mw=$('#lsMw'); if(mw) mw.style.display=mc.size?'':'none';
  const B=prepBusca(S.ls.q);
  let arr=base.filter(p=>(!S.ls.g||(p.grupo||GSEM)===S.ls.g) && (!S.ls.s||p.subgrupo===S.ls.s) && (!fabOk||fabOk.has(String(p.marca||'').trim().toUpperCase())) && (!S.ls.pend||!mine.has(String(p.codigo))));
  if(B.todas.length) arr=arr.filter(p=>bate(p,B));
  arr=[...arr].sort(byGrupo);
  let html='', last=null; const dd=descDif(arr.slice(0,S.ls.lim));
  arr.slice(0,S.ls.lim).forEach(p=>{
    const gl=gLbl(p);
    if(gl!==last){ html+=`<div class="lsh">${esc(gl)}</div>`; last=gl; }
    const ok=mine.has(String(p.codigo));
    html+=`<div class="res${ok?' done':''}" data-c="${esc(p.codigo)}">${thumb(p)}${infoProd(p,{check:ok,desc:dd.get(String(p.codigo))})}<span class="badge b-gray">${esc(p.unidade||'UN')}</span></div>`;
  });
  if(arr.length>S.ls.lim) html+=`<button class="btn sec block" id="lsMore" style="margin:10px 0">Mostrar mais (${arr.length-S.ls.lim} restantes)</button>`;
  L.innerHTML = html || '<div class="empty">Nenhum produto com esses filtros.</div>';
  L.querySelectorAll('.res').forEach(el=>el.onclick=()=>{ const p=S.idxCod.get(norm(el.dataset.c)); closeModal(); setPending(p,'tecl'); });

}

/* ---------- lançamento rápido (sem janela, câmera continua ligada) ---------- */
function jaLancado(p){ return r3(S.lanc.filter(l=>l.rodada===S.rodada && meu(l) && String(l.codigo)===String(p.codigo)).reduce((s,l)=>s+Number(l.qtd||0),0)); }
function setPending(p,src='tecl'){
  if(!p) return;
  if(p._res) p=promover(p);
  if(S.rodada===3 && !(S.inv.divergentes||[]).map(String).includes(String(p.codigo))){ beep(false); toast('Este item não está na lista da '+rn(3).toLowerCase(),true); return; }
  beep(true);
  if(LS.get('cvinv_modo','qtd')==='um'){
    const tot=jaLancado(p)+1;
    Promise.resolve(lancar(p,1,true)).then(id=>{ S.lastUm={p,id,tot}; renderFast(); }); enriquecerAgora(p).then(()=>{ if(S.lastUm&&S.lastUm.p===p) renderFast(); });
    return;
  }
  if(S.pend && String(S.pend.p.codigo)===String(p.codigo)){ S.pend.q=r3(S.pend.q+1); renderFast(); flashQty(); return; }
  if(S.pend){ if(LS.get('cvinv_auto',true)) confirmPending(); else { S.pend=null; } }
  S.pend={p,q:1,ja:jaLancado(p)};
  renderFast(); enriquecerAgora(p);
  if(src!=='cam'){ const f=$('#fQ'); if(f){ f.focus(); f.select(); } }
  else { const el=$('#fast'); if(el && el.getBoundingClientRect().bottom>innerHeight) el.scrollIntoView({block:'nearest'}); }
}
const openQty=p=>setPending(p,'tecl');
function confirmPending(){
  if(!S.pend) return;
  const f=$('#fQ'); if(f && f.value.trim()!=='') S.pend.q=parseNum(f.value);
  const {p,q}=S.pend;
  if(!(q>=0)){ toast('Quantidade inválida',true); return; }
  lancar(p,q); S.pend=null; renderFast();
  if(!Cam.on){ const qq=$('#q'); if(qq) qq.focus(); }
}
function flashQty(){ const f=$('#fQ'); if(f){ f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); } }
function renderFast(){
  const el=$('#fast'); if(!el) return;
  if(S.pend){
    const p=S.pend.p, un=(p.unidade||'UN').toUpperCase();
    el.hidden=false; el.className='card fast';
    el.innerHTML=`<div class="row" style="align-items:flex-start">${thumb(p,64)}<div style="flex:1;min-width:0"><b class="fd">${esc(p.descricao)}</b><div class="small muted">${idsProd(p)}</div>${tagsProd(p)}</div><span class="badge b-gray">${esc(un)}</span>${p.novo?'<span class="badge b-blue">novo</span>':''}</div>
      ${p.novo?'':`<button type="button" class="cadbtn" id="fCadB">✏ ${eansDe(p).length?'Completar ou corrigir cadastro':'Completar cadastro · sem código de barras'}</button>`}
      ${S.pend.ja?`<div class="small muted" style="margin-top:4px">Você já lançou ${fmt(S.pend.ja)} ${esc(un)} deste item nesta contagem — será somado.</div>`:''}
      <div class="qrow"><button class="stp" data-s="-1">−</button><input class="in qty" id="fQ" type="text" inputmode="decimal" autocomplete="off" placeholder="1" value="${S.pend.ed||S.pend.q!==1?esc(fmt(S.pend.q).replace(/\./g,'')):''}"><button class="stp" data-s="1">+</button></div>
      <div class="quick"><button data-a="6">+6</button><button data-a="12">+12</button><button data-a="24">+24</button><button data-a="0">Zerar</button></div>
      <div class="row" style="margin-top:10px"><button class="btn sec" id="fX" style="flex:1">Descartar</button><button class="btn" id="fOk" style="flex:2">Confirmar</button></div>
      ${Cam.on&&LS.get('cvinv_auto',true)?'<div class="small muted" style="text-align:center;margin-top:6px">Bipe o próximo produto para confirmar este automaticamente</div>':''}`;
    const f=$('#fQ',el);
    f.onfocus=()=>setTimeout(()=>f.select(),0);
    f.oninput=()=>{ S.pend.ed=true; S.pend.q=f.value.trim()===''?1:parseNum(f.value); };
    f.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); confirmPending(); } if(e.key==='Escape'){ S.pend=null; renderFast(); } };
    el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.pend.ed=true; S.pend.q=Math.max(0,r3(S.pend.q+Number(b.dataset.s))); f.value=fmt(S.pend.q).replace(/\./g,''); });
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ const a=Number(b.dataset.a); S.pend.q= a===0?0:r3((S.pend.ed?S.pend.q:0)+a); S.pend.ed=true; f.value=fmt(S.pend.q).replace(/\./g,''); });
    $('#fOk',el).onclick=confirmPending;
    $('#fX',el).onclick=()=>{ S.pend=null; renderFast(); };
    const cb=$('#fCadB',el); if(cb) cb.onclick=()=>{ const f2=$('#fQ'); if(f2&&f2.value.trim()!==''){ S.pend.q=parseNum(f2.value); S.pend.ed=true; } completarCadastro(p); };
  } else if(S.lastUm && LS.get('cvinv_modo','qtd')==='um'){
    const {p,tot}=S.lastUm;
    el.hidden=false; el.className='card fast ok';
    el.innerHTML=`<div class="row">${thumb(p,48)}<div class="round-dot">+1</div><div style="flex:1;min-width:0"><b class="fd">${esc(p.descricao)}</b>${fabTag(p)}<div class="small muted">Seu total deste item: <b>${fmt(tot)} ${esc(p.unidade||'UN')}</b></div></div><button class="btn sec" id="fU">Desfazer</button></div>`;
    $('#fU',el).onclick=()=>{ if(S.lastUm && S.lastUm.id){ Store.del('inventarios/'+S.inv.id+'/lancamentos',S.lastUm.id); toast('Último bipe desfeito'); } S.lastUm=null; renderFast(); };
  } else { el.hidden=true; el.innerHTML=''; }
}
function quem(){ return (S.sess&&S.sess.nome)||(S.me&&S.me.nome)||S.contador||'?'; }
function logAcao(acao,detalhe){ if(!S.inv) return; Store.add('inventarios/'+S.inv.id+'/log',{acao,detalhe:detalhe||'',quem:quem(),ts:now(),device:DEV}); }

/* =====================================================================
   COMPLEMENTO DE CADASTRO (contador e gestor)
   - Campo vazio no ERP: quem conta preenche e já vale no app (ex.: código de barras → o próximo bipe reconhece).
   - Campo preenchido e errado: só é apontado; o app continua com o dado do ERP e a correção vai para o
     relatório "Divergências de cadastro" (corrigir no ERP). O gestor confirma ou desconsidera cada uma.
   ===================================================================== */
const CAD_CAMPOS={ean:'Código de barras',descricao:'Descrição',unidade:'Unidade',grupo:'Grupo',subgrupo:'Subgrupo',marca:'Fabricante',referencia:'Referência'};
const CAD_UN=['UN','KG','CX','PCT','FD','L','G','ML','DZ','M','M2','M3','PC','PAR','RL','JG','KIT','SC','BD','GL','LT','TB','BR','CJ'];
function registrarCad(p,campo,de,para,obs,aplicado){
  if(!S.inv) return;
  Store.add('inventarios/'+S.inv.id+'/cadastro',{codigo:String(p.codigo),descricao:p.descricao||'',campo,de:de||'',para:para||'',obs:obs||'',aplicado:!!aplicado,status:'aberta',quem:quem(),ts:now(),device:DEV,rodada:S.rodada||null});
  logAcao(aplicado?'Completou cadastro':'Apontou erro de cadastro',`${p.codigo} · ${CAD_CAMPOS[campo]||'Observação'}: ${de?de+' → ':''}${para||obs||''}`);
}
const eansDe=p=>String(p.ean||'').split(/[;,\s]+/).filter(Boolean);
function eanEmUso(code,p){ const o=/^\d+$/.test(code)?S.idxEan.get(eanKey(code)):S.idxEan.get('#'+norm(code)); return o && String(o.codigo)!==String(p.codigo) ? o : null; }
/* grava um código de barras no produto (se já tiver um, entra como código adicional) */
function gravarEan(p,code){
  code=String(code||'').trim(); if(!code) return false;
  const o=eanEmUso(code,p); if(o){ toast('Esse código de barras já é de: '+o.descricao,true); return false; }
  const atual=eansDe(p); if(atual.some(e=>eanKey(e)===eanKey(code)||e===code)) return true;
  const novo=[...atual,code].join(';');
  if(p.id) Store.set('inventarios/'+S.inv.id+'/produtos',p.id,{ean:novo});
  registrarCad(p,'ean',atual.join(' / '),code,'',true);
  p.ean=novo; indexProdutos(); return true;
}
function completarCadastro(p,{depois}={}){
  if(!p) return;
  const G=ehGestor(S.me);
  const linha=(k)=>{ const v=String(p[k]??'').trim();
    const inp=k==='unidade'
      ? `<select class="in" name="${k}"><option value="">${v?'— está certo —':'— escolher —'}</option>${CAD_UN.filter(u=>u!==v).map(u=>`<option>${u}</option>`).join('')}</select>`
      : `<input class="in" name="${k}" autocomplete="off" ${k==='ean'?'inputmode="numeric"':''} ${['grupo','subgrupo','marca'].includes(k)?'autocapitalize="characters"':''} placeholder="${v?(k==='ean'?'Código adicional (opcional)':'Só preencha se estiver errado'):'Preencher'}">`;
    return `<div class="cadl"><div class="small muted">${CAD_CAMPOS[k]}</div>${v?`<div class="cadv">${esc(k==='ean'?eansDe(p).map(codFmt).join(' / '):v)}</div>`:'<div class="cadv vazio">não informado no ERP</div>'}${inp}</div>`; };
  modal(`<h2>Completar cadastro</h2><div class="small muted mono">${esc(p.codigo)} · ${esc(p.descricao)}</div>
    <p class="small muted" style="margin:8px 0 0">Campo <b>vazio</b>: o que você preencher já vale no app. Campo <b>errado</b>: escreva o correto; ele vai para o relatório de correções do ERP.</p>
    <form id="fCad" class="stack" style="margin-top:10px">
      ${['ean','descricao','unidade','grupo','subgrupo','marca','referencia'].map(linha).join('')}
      <label class="f">Observação para o cadastro<textarea class="in" name="obs" rows="2" placeholder="Ex.: embalagem mudou, vem em caixa com 12"></textarea></label>
      <div class="row"><button type="button" class="btn sec" id="cdC" style="flex:1">Cancelar</button><button class="btn" style="flex:2">Salvar</button></div></form>`,
  {onOpen:o=>{ $('#cdC',o).onclick=closeModal;
    $('#fCad',o).onsubmit=ev=>{ ev.preventDefault();
      const d=Object.fromEntries(new FormData(ev.target).entries()); let n=0; const apl={};
      for(const k of Object.keys(CAD_CAMPOS)){
        let nv=String(d[k]||'').trim(); if(!nv) continue;
        if(['grupo','subgrupo','marca','unidade'].includes(k)) nv=nv.toUpperCase();
        const v=String(p[k]??'').trim();
        if(k==='ean'){ if(!gravarEan(p,nv)) return; n++; continue; }
        if(nv===v) continue;
        if(!v){ apl[k]=nv; registrarCad(p,k,'',nv,'',true); }
        else registrarCad(p,k,v,nv,'',false);
        n++;
      }
      const obs=String(d.obs||'').trim(); if(obs){ registrarCad(p,'outro','','',obs,false); n++; }
      if(Object.keys(apl).length){ if(p.id) Store.set('inventarios/'+S.inv.id+'/produtos',p.id,apl); Object.assign(p,apl); indexProdutos(); }
      closeModal(); if(n) toast('✓ Cadastro registrado'+(G?'':' — o gestor vai conferir')); if(depois) depois(p); else renderFast(); }; }});
}
/* código bipado que não está na planilha: pode ser um produto da planilha que está sem código de barras */
function vincularEan(code,info){
  const semEan=()=>baseLista().filter(p=>!p.novo);
  let soSem=true;
  modal(`<div class="row between"><h2>Qual produto é este?</h2><button class="x" id="vjX" aria-label="Fechar" style="color:var(--navy)">✕</button></div>
    <div class="small muted">Código bipado: <b class="mono">${esc(codFmt(code))}</b>${info&&info.descricao?' · '+esc(info.descricao):''}</div>
    <p class="small muted" style="margin:6px 0 0">Escolha o produto da planilha. O código de barras fica gravado nele e a contagem continua normalmente.</p>
    <input class="in" id="vjQ" placeholder="Nome, código ou fabricante" autocomplete="off" style="margin-top:10px">
    <label class="chk small muted" style="margin:8px 0 4px"><input type="checkbox" id="vjS" checked> Só produtos sem código de barras</label>
    <div id="vjL" class="lslist"></div>`,{cls:'full',onOpen:o=>{
      $('#vjX',o).onclick=closeModal;
      const draw=()=>{ const n=norm($('#vjQ',o).value).split(/\s+/).filter(Boolean);
        const arr=semEan().filter(p=>(!soSem||!eansDe(p).length) && (!n.length||n.every(w=>(norm(p.descricao)+' '+norm(p.codigo)+' '+norm(p.marca||'')+' '+norm(p.referencia||'')).includes(w))));

function cadRows(rows){

  (S.cad||[]).forEach(c=>{ const r=byCod.get(String(c.codigo)); if(r&&r.novo) return;
    out.push({id:c.id,tipo:'reg',codigo:c.codigo,descricao:(r&&r.descricao)||c.descricao,campo:c.campo,acao:acao(c),de:c.de,para:c.campo==='outro'?c.obs:c.para,obs:c.campo==='outro'?'':c.obs,quem:c.quem,ts:c.ts,status:c.status||'aberta',aplicado:c.aplicado}); });
  rows.filter(r=>r.novo && (r.n[0]||r.n[1]||r.n[2])).forEach(r=>out.push({tipo:'novo',codigo:r.codigo,descricao:r.descricao,campo:'novo',acao:'Cadastrar produto novo no ERP',de:'',para:[r.ean&&'EAN '+r.ean,r.unidade,gLbl(r),r.marca].filter(Boolean).join(' · '),quem:'',ts:'',status:'aberta'}));
  if(S.cadSemEan!==false){ const tem=new Set((S.cad||[]).filter(c=>c.campo==='ean').map(c=>String(c.codigo)));
    rows.filter(r=>!r.novo && !r.ean && !tem.has(String(r.codigo)) && (r.n[0]||r.n[1]||r.n[2])).forEach(r=>out.push({tipo:'auto',codigo:r.codigo,descricao:r.descricao,campo:'ean',acao:'Cadastrar código de barras',de:'',para:'(não informado na contagem)',quem:'',ts:'',status:'aberta'})); }

}

   1) Usa o leitor nativo do aparelho (BarcodeDetector / ML Kit no Android).

function qrLigado(){ const e=S.empresa||{}; if(e.lerQr==='sim') return true; if(e.lerQr==='nao') return false; return !!((S.cfgC||{}).qrPadrao); }
const fmtsAtivos=()=>qrLigado()?FORMATS:FORMATS.filter(f=>!F2D.includes(f));

(function(){ const o=console.error; console.error=function(...a){ try{ ZX_ULTIMO=String((a[0]&&a[0].message)||a[0]).slice(0,120); }catch(e){} return o.apply(console,a); }; })();

  const API=window.BarcodeDetectionAPI;

      e.preventDefault(); e.stopPropagation();
      // se a pessoa digitou algo logo antes do bipe, separa o código do que foi digitado
      let c=code, pre='';
      if(!findExact(c)){ for(const n of [13,12,14,8]){ const tail=code.slice(-n); if(code.length>n && gtinOk(tail) && findExact(tail)){ c=tail; pre=code.slice(0,-n); break; } } }
      const tg=WEDGE.target;
      if(tg && 'value' in tg){ tg.value=WEDGE.before+pre; if(tg.id==='fQ' && S.pend && tg.value.trim()!=='') S.pend.q=parseNum(tg.value); }
      handleCode(c,'leitor');
    }
    return;
  }
  if(e.key.length!==1 || e.ctrlKey || e.metaKey || e.altKey) return;
  if(t-WEDGE.t>45 || !WEDGE.buf){ WEDGE.buf=''; WEDGE.target=e.target; WEDGE.before=(e.target && 'value' in e.target)?e.target.value:''; }
  WEDGE.buf+=e.key; WEDGE.t=t;
},true);

/* ---------- IMPORTAR PLANILHA ---------- */
const COLS=[['codigo','Código do produto',/^(cod|codigo|cód|código|id|sku)\b(?!.*(barra|fabric|refer))/],['subgrupo','Subgrupo',/^(sub ?-?grupo|sub ?-?categoria|sub ?-?familia|sub ?-?secao|sub ?-?departamento)/],['grupo','Grupo',/^(grupo|depart|secao|setor|categoria|familia|linha)/],['descricao','Descrição',/desc|produto|nome/],['ean','Código de barras',/barra|ean|gtin|cod.*bar/],['referencia','Referência do fabricante (opcional)',/^(ref|referencia|cod.*fabric)/],['marca','Marca (opcional)',/^(marca|fabricante)/],['estoque','Quantidade em estoque',/estoq|qtd|quant|saldo|qtde/],['custo','Custo unitário (opcional)',/^(custo|preco de custo|preço de custo|vl ?custo|valor custo|custo medio|custo médio|pr\.? ?compra|preco ?(de )?compra|preço ?(de )?compra|custo unit)/],['unidade','Unidade',/^(un|und|unid|unidade|medida|um)\b/]];
/* ---------- leitura de CSV (qualquer separador e acentuação) ---------- */
function lerTexto(buf){ try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ return new TextDecoder('windows-1252').decode(buf); } }
function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,''); const amostra=txt.slice(0,20000);
  const sep=[';',',','\t','|'].map(c=>[c,(amostra.match(new RegExp(c==='|'?'\\|':c,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; continue; }
    if(ch==='"') q=true; else if(ch===sep){ row.push(cell); cell=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim()));
}
/* Relatório de estoque "impresso" pelo ERP (ex.: Inteligence ERP · Listagem de Estoque Gerencial):
   cabeçalho da empresa repetido em cada página, linhas GRUPO:/SUB-GRUPO/SEÇÃO antes dos produtos e
   colunas que às vezes saem deslocadas. Aqui vira uma planilha normal: uma linha por produto. */
function limparRelatorio(rows){
  const isHead=r=>{ const n=r.map(c=>norm(c)); return n.some(x=>/^(cod|codigo)\b/.test(x)) && n.some(x=>/^descri/.test(x)); };
  const hi=rows.findIndex(isHead); if(hi<0) return null;
  const H=rows[hi], assin=H.map(c=>String(c).trim()).join('|');
  const repet=rows.filter(isHead).length;
  const lin0=r=>norm(String(r[0]||'')).replace(/[:\s]+$/,'');
  const temGrupo=rows.some(r=>/^(grupo|sub-?grupo|secao)$/.test(lin0(r)));
  if(hi===0 && repet<2 && !temGrupo) return null;            // planilha comum: segue o caminho normal
  const hc=H.map((c,i)=>[String(c).trim(),i]).filter(x=>x[0]);  // colunas com título
  const hIdx=hc.map(x=>x[1]); const iTot=hc.findIndex(x=>/^total/.test(norm(x[0])));
  const semPref=v=>String(v||'').trim().replace(/^\d+\s*-\s*/,'');
  let g='',sg='',paginas=0; const out=[];
  rows.forEach((r,ix)=>{
    if(ix<hi) return;
    const k=lin0(r);
    if(isHead(r)){ paginas++; return; }
    const vals=r.map((c,i)=>[String(c).trim(),i]).filter(x=>x[0]);
    if(/^grupo$/.test(k)){ g=semPref((vals[1]||[])[0]); sg=''; return; }
    if(/^sub-?grupo$/.test(k)){ sg=semPref((vals[1]||[])[0]); return; }
    if(/^secao$/.test(k)) return;
    if(!String(r[0]||'').trim() || vals.length<3) return;   // cabeçalho de página, rodapé, linhas vazias
    const cel=new Array(hc.length).fill('');
    if(vals.every(([,i])=>hIdx.includes(i))) vals.forEach(([v,i])=>{ cel[hIdx.indexOf(i)]=v; });
    else if(iTot>=0){ // linha deslocada: até o TOTAL vai em ordem; depois do TOTAL, pela distância até ele
      const tPos=vals[iTot]?vals[iTot][1]:null;
      vals.forEach(([v,i],n)=>{ if(n<=iTot) cel[n]=v; else if(tPos!=null){ const off=i-tPos; const j=hc.findIndex(x=>x[1]-hc[iTot][1]===off); if(j>=0) cel[j]=v; else { const livre=cel.findIndex((c,jj)=>jj>iTot&&!c); if(livre>=0) cel[livre]=v; } } });
    } else vals.forEach(([v],n)=>{ if(n<cel.length) cel[n]=v; });
    out.push(cel.concat([g,sg]));
  });
  if(!out.length) return null;
  let head=hc.map(x=>x[0]).concat(['Grupo','Subgrupo']);
  // coluna "REFERÊNCIA" que na maioria é código de barras: separa em código de barras e referência do fabricante
  const iRef=head.findIndex(h=>/^ref/.test(norm(h)));
  if(iRef>=0 && !head.some(h=>/barra|ean|gtin/.test(norm(h)))){
    const ehEan=v=>{ const d=String(v).replace(/\s/g,''); return /^\d{8,14}$/.test(d); };
    const cheios=out.filter(r=>r[iRef]); if(cheios.length && cheios.filter(r=>ehEan(r[iRef])).length/cheios.length>0.5){
      head=head.concat(['Código de barras','Referência do fabricante']);
      out.forEach(r=>{ const v=r[iRef]; const e=ehEan(v); r.push(e?String(v).replace(/\s/g,''):'', e?'':v); });
      head[iRef]='(referência original)';
    }
  }
  return {rows:[head].concat(out),paginas:Math.max(1,paginas)};
}

function mapping(rows,fname,doErp){

  const opts=sel=>`<option value="">— não tem —</option>`+head.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h||'Coluna '+(i+1))}</option>`).join('');
  const box=$('#map');
  box.innerHTML=`<div class="card stack"><h2>Conferir colunas — ${esc(fname)}</h2><div class="small muted">${fmt(rows.length-1)} linhas encontradas. Confirme qual coluna é cada informação.</div>
    <div class="fgrid">${['codigo','descricao','ean','estoque','unidade','grupo','subgrupo','custo','referencia','marca'].map(k=>COLS.find(c=>c[0]===k)).map(([k,l])=>`<label class="f">${l}${k==='codigo'||k==='descricao'?' *':''}<select class="in" data-k="${k}">${opts(auto[k])}</select></label>`).join('')}</div>

    <div id="resOpt"></div>
    ${S.produtos.length?`<div class="stack" style="gap:6px"><label class="chk"><input type="radio" name="modoImp" value="atualizar" checked> Atualizar os produtos existentes e acrescentar os novos</label>
      ${S.lanc.length?'':'<label class="chk"><input type="radio" name="modoImp" value="substituir"> Substituir a lista inteira</label>'}
      <label class="chk small"><input type="checkbox" id="zeraFora"> Zerar o estoque dos produtos que não estão na nova planilha</label></div>`:''}
    <div class="row"><span class="spacer"></span><button class="btn" id="bImp">${S.produtos.length?'Aplicar planilha':'Importar produtos'}</button></div></div>`;
  const get=()=>{ const m={}; box.querySelectorAll('[data-k]').forEach(s=>m[s.dataset.k]=s.value===''?null:+s.value); return m; };
  const build=()=>{ const m=get(); const out=[]; const seen=new Set(); let dup=0, vaz=0;
    rows.slice(1).forEach(r=>{ const cod=m.codigo!=null?codeStr(r[m.codigo]):''; const desc=m.descricao!=null?String(r[m.descricao]).trim():'';
      if(!cod||!desc){ vaz++; return; } const k=norm(cod); if(seen.has(k)){ dup++; return; } seen.add(k);
      out.push({codigo:cod,descricao:desc,ean:m.ean!=null?codeStr(r[m.ean]):'',estoque:m.estoque!=null?r3(parseNum(r[m.estoque])):0,unidade:m.unidade!=null?String(r[m.unidade]).trim().toUpperCase():'UN',grupo:m.grupo!=null?String(r[m.grupo]).trim().toUpperCase():'',subgrupo:m.subgrupo!=null?String(r[m.subgrupo]).trim().toUpperCase():'',custo:m.custo!=null?Math.round(parseNum(r[m.custo])*10000)/10000:0,referencia:m.referencia!=null?String(r[m.referencia]).trim():'',marca:m.marca!=null?String(r[m.marca]).trim().toUpperCase():'',novo:false}); });
    return {out,dup,vaz}; };
  const prev=()=>{ const {out,dup,vaz}=build();
    $('#prev').innerHTML=`<div class="small ${dup||vaz?'warnbox':'hint'}">${fmt(out.length)} produtos válidos${dup?` · ${dup} código(s) repetido(s) ignorado(s)`:''}${vaz?` · ${vaz} linha(s) sem código ou descrição ignorada(s)`:''}</div>
    <div class="tbl-wrap" style="margin-top:8px"><table class="t"><thead><tr><th>Código</th><th>Descrição</th><th>Cód. barras</th><th class="n">Estoque</th><th>Un</th><th>Grupo</th><th>Subgrupo</th><th class="n">Custo (R$)</th></tr></thead><tbody>${out.slice(0,6).map(p=>`<tr><td class="mono">${esc(p.codigo)}</td><td>${esc(p.descricao)}</td><td class="mono">${esc(p.ean)}</td><td class="n">${fmt(p.estoque)}</td><td>${esc(p.unidade)}</td><td>${esc(p.grupo)}</td><td>${esc(p.subgrupo)}</td><td class="n">${p.custo?brl(p.custo):''}</td></tr>`).join('')}</tbody></table></div>`; };
  const resOpt=()=>{ const el=$('#resOpt'); if(!el) return; const {out}=build(); const z=out.filter(p=>!p.estoque).length;

          if(Object.keys(d).length) upd.push({id:p.id,data:d}); });
        if($('#zeraFora')&&$('#zeraFora').checked) S.produtos.forEach(p=>{ if(!vistos.has(norm(p.codigo)) && !p.novo && Number(p.estoque)) upd.push({id:p.id,data:{estoque:0}}); });

        btn.textContent=`Atualizando ${fmt(upd.length)} produto(s)…`; await Store.updateMany(col,upd);
        if(add.length) await Store.addMany(col,add);

      const usaRes=!!($('#usaRes')&&$('#usaRes').checked);

      const rcol='inventarios/'+S.inv.id+'/reserva';

      <td class="n ${r.dif>0?'pos':r.dif<0?'neg':''}">${r.dif==null?'—':fmtS(r.dif)}</td>${F.tem?`<td class="n">${r.custo?brl(r.custo):'—'}</td><td class="n ${r.dif>0?'pos':r.dif<0?'neg':''}">${r.dif&&r.custo?brl(r.dif*r.custo):'—'}</td>`:''}
      <td>${r.status==='pendente'?'<span class="badge b-warn">Pendente</span>':r.dif>0.0004?'<span class="badge b-ok">Entrada</span>':r.dif<-0.0004?'<span class="badge b-red">Saída</span>':'<span class="badge b-gray">OK</span>'}</td></tr>`).join('')||`<tr><td colspan="${F.tem?13:11}" class="empty">Nenhum item</td></tr>`}
    </tbody></table></div>`}
    <div class="hint">Regra: se a 1ª e a 2ª contagens batem, esse é o valor final. Se divergem, vale a 3ª contagem. Produto da base que ninguém encontrou conta como zero (saída de todo o estoque). Diferença = contagem final − estoque do sistema.</div>`;
  b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{ S.tabRes=x.dataset.t; V.resultado_refresh(); });

function blocoTrocas(TR,TRm){
  const lin=x=>{ const st=TRm[x.key]; return `<div class="troca ${st==='ok'?'ok':st==='nao'?'nao':''}">
    <div class="tr-par">
      <div class="tr-it sai"><span class="badge b-red">faltou ${fmt(x.qa)} ${esc(x.a.unidade||'')}</span><b>${esc(x.a.descricao)}</b><span class="mono small">${esc(x.a.codigo)}${x.a.marca?' · '+esc(x.a.marca):''}</span>${x.muda[0]?`<span class="small">só neste: <b>${esc(x.muda[0].toUpperCase())}</b></span>`:''}${x.a.custo?`<span class="small neg">R$ ${brl(x.vA)}</span>`:''}</div>
      <div class="tr-seta">⇄</div>
      <div class="tr-it ent"><span class="badge b-ok">sobrou ${fmt(x.qb)} ${esc(x.b.unidade||'')}</span><b>${esc(x.b.descricao)}</b><span class="mono small">${esc(x.b.codigo)}${x.b.marca?' · '+esc(x.b.marca):''}</span>${x.muda[1]?`<span class="small">só neste: <b>${esc(x.muda[1].toUpperCase())}</b></span>`:''}${x.b.custo?`<span class="small pos">R$ ${brl(x.vB)}</span>`:''}</div>
    </div>
    <div class="row between small" style="margin-top:8px"><span class="muted">Semelhança ${Math.round(Math.min(1,x.sc)*100)}% · ${fmt(x.q)} unidade(s) se compensam${x.a.custo?' · R$ '+brl(x.vComp):''}</span>
      <span class="row" style="gap:6px"><button class="btn sm ${st==='ok'?'':'sec'}" data-tr="${esc(x.key)}" data-v="ok">✓ É troca</button><button class="btn sm ${st==='nao'?'red':'sec'}" data-tr="${esc(x.key)}" data-v="nao">✕ Não é</button></span></div></div>`; };
  const conf=TR.filter(x=>TRm[x.key]==='ok');
  return `<div class="hint">Itens com <b>saída</b> (faltou) e itens com <b>entrada</b> (sobrou) de descrição muito parecida — mesma peça com outra cor, modelo, medida ou referência. Normalmente é venda ou nota lançada no código errado: fisicamente a mercadoria está na loja. Confira na prateleira e marque. ${conf.length?`<br><b>${conf.length} confirmada(s)</b> como troca — R$ ${brl(conf.reduce((s,x)=>s+x.vComp,0))} que não são perda real. Os ajustes de entrada e saída continuam necessários para corrigir os códigos no ERP.`:''}</div>
    <div class="trocas">${TR.map(lin).join('')}</div>`;
}
function resumoGrupos(rows){
  const out=[]; const add=(o,r)=>{ o.itens++; if(r.dif!=null&&eq(r.dif,0)) o.ok++; if(r.d12) o.div++; if(r.status==='pendente') o.pend++; if(r.dif>0.0004){ o.ent++; o.vEnt+=r.dif*(r.custo||0); } if(r.dif<-0.0004){ o.sai++; o.vSai-=r.dif*(r.custo||0); } };
  const z=(g,sub)=>({g,sub,itens:0,ok:0,div:0,pend:0,ent:0,sai:0,vEnt:0,vSai:0});
  grupos(rows).forEach(x=>{ const tot=z(x.g,''); const subs=new Map(x.subs.map(sg=>[sg,z(x.g,sg)]));
    rows.filter(r=>(r.grupo||GSEM)===x.g).forEach(r=>{ add(tot,r); if(r.subgrupo&&subs.has(r.subgrupo)) add(subs.get(r.subgrupo),r); });
    out.push(tot); subs.forEach(v=>out.push(v)); });
  return out;
}
function fileBase(){ return ('inventario_'+(S.empresa.fantasia||'empresa')+'_'+(S.inv.data||'')).replace(/[^\w\-]+/g,'_'); }
function sheet(aoa,widths){ const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=(widths||aoa[0].map((h,i)=>({wch:i===1?44:Math.max(12,String(h).length+2)}))); return ws; }
async function gerarExcel(){ await lib('xlsx');
  const {rows,t}=calc(); const e=S.empresa,i=S.inv;
  const wb=XLSX.utils.book_new();
  const F=financeiro(rows,t), TR=trocasPossiveis(t), TRm=i.trocas||{};
  if(F.tem) XLSX.utils.book_append_sheet(wb,sheet([[`Resultado financeiro — ${i.nome} — ${e.fantasia||e.razao} — ${dBR(i.data)}`],[],['Indicador','Valor (R$)','Observação'],
    ['Estoque no sistema',F.vSis,'quantidade do ERP × custo de compra'],['Estoque contado',F.vCont,'o que de fato está na loja'],
    ['Saídas — perdas',F.vSai,'constava no sistema e não estava na prateleira'],['Entradas — sobras',F.vEnt,'estava na prateleira e não constava no sistema'],
    ['Resultado do inventário',F.saldo,F.saldo<0?'prejuízo':'sem prejuízo'],['% do estoque',Math.round(F.pct*100)/100,''],
    ['Possíveis trocas de código',TR.filter(x=>TRm[x.key]!=='nao').reduce((s,x)=>s+x.vComp,0),`${TR.length} par(es) de itens parecidos`]],[{wch:30},{wch:16},{wch:50}]),'Resumo financeiro');
  const head=['Código','Descrição','Grupo','Subgrupo','Cód. barras','Referência','Marca','Unidade','1ª contagem','2ª contagem','3ª contagem','Contagem final','Estoque sistema','Diferença','Custo unit. (R$)','Valor diferença (R$)','Ação'];
  const acao=r=>r.status==='pendente'?'PENDENTE':r.dif>0.0004?'ENTRADA':r.dif<-0.0004?'SAÍDA':'OK';
  XLSX.utils.book_append_sheet(wb,sheet([[`Inventário: ${i.nome} — ${e.fantasia||e.razao} — ${dBR(i.data)}`],[],head].concat(rows.map(r=>[r.codigo,r.descricao,r.grupo,r.subgrupo,r.ean,r.referencia||'',r.marca||'',r.unidade,r.c[0],r.c[1],r.n[2]?r.c[2]:'',r.final??'',r.estoque,r.dif??'',r.custo||'',r.dif&&r.custo?Math.round(r.dif*r.custo*100)/100:'',acao(r)])),head.map((h,ix)=>({wch:ix===1?44:14}))),'Contagem completa');
  XLSX.utils.book_append_sheet(wb,sheet([['Código','Descrição','Grupo','Subgrupo','Unidade','1ª','2ª','Diferença','3ª']].concat(rows.filter(r=>r.d12).map(r=>[r.codigo,r.descricao,r.grupo,r.subgrupo,r.unidade,r.c[0],r.c[1],r3(r.c[1]-r.c[0]),r.n[2]?r.c[2]:'']))),'Divergências 1x2');
  const mov=a=>[['Código','Descrição','Grupo','Subgrupo','Cód. barras','Unidade','Estoque sistema','Contagem final','Quantidade','Custo unit. (R$)','Valor (R$)']].concat(a.map(r=>[r.codigo,r.descricao,r.grupo,r.subgrupo,r.ean,r.unidade,r.estoque,r.final,Math.abs(r.dif),r.custo||'',r.custo?Math.round(Math.abs(r.dif)*r.custo*100)/100:'']));
  XLSX.utils.book_append_sheet(wb,sheet(mov(t.ent)),'Entradas');
  XLSX.utils.book_append_sheet(wb,sheet(mov(t.sai)),'Saídas');
  if(TR.length) XLSX.utils.book_append_sheet(wb,sheet([['Situação','Semelhança %','FALTOU — código','Descrição','Qtd faltou','Valor faltou (R$)','SOBROU — código','Descrição','Qtd sobrou','Valor sobrou (R$)','Qtd que se compensa','Valor que se compensa (R$)','O que muda']].concat(TR.map(x=>[TRm[x.key]==='ok'?'CONFIRMADA':TRm[x.key]==='nao'?'DESCARTADA':'A CONFERIR',Math.round(Math.min(1,x.sc)*100),x.a.codigo,x.a.descricao,x.qa,Math.round(x.vA*100)/100,x.b.codigo,x.b.descricao,x.qb,Math.round(x.vB*100)/100,x.q,Math.round(x.vComp*100)/100,`${(x.muda[0]||'—').toUpperCase()} → ${(x.muda[1]||'—').toUpperCase()}`]))),'Possíveis trocas');
  XLSX.utils.book_append_sheet(wb,sheet([['Grupo','Subgrupo','Itens','Batem com estoque','Divergências 1x2','Pendentes','Entradas','Saídas']].concat(resumoGrupos(rows).map(x=>[x.g,x.sub||'(total do grupo)',x.itens,x.ok,x.div,x.pend,x.ent,x.sai])),[{wch:26},{wch:26},{wch:8},{wch:18},{wch:16},{wch:10},{wch:10},{wch:10}]),'Resumo por grupo');
  XLSX.utils.book_append_sheet(wb,sheet([['Data/hora','Contagem','Contador','Código','Descrição','Quantidade','Unidade']].concat([...S.lanc].sort((a,b)=>String(a.ts).localeCompare(String(b.ts))).map(l=>[dtBR(l.ts),l.rodada+'ª',l.contador,l.codigo,l.descricao,l.qtd,l.unidade]))),'Lançamentos');
  const CRx=cadRows(rows).filter(x=>x.status!=='descartada');
  if(CRx.length) XLSX.utils.book_append_sheet(wb,sheet([['Código','Descrição','O que fazer no ERP','Como está no ERP','Como deve ficar / observação','Informado por','Data/hora','Situação']].concat(CRx.map(x=>[x.codigo,x.descricao,x.acao,x.de,x.para,x.quem,x.ts?dtBR(x.ts):'',x.status==='confirmada'?'Confirmada':'A conferir']))),'Divergências de cadastro');

function usuarios(e=S.empresa){
  if(e && Array.isArray(e.usuarios) && e.usuarios.length) return e.usuarios;

function carregarMe(){ const id=LS.get(meKey()); S.me = id ? (usuarios().find(u=>u.id===id)||null) : null; if(adminOk() && (!S.me || !ehGestor(S.me))){ S.me=USER_CULTIVVE; S.sess=USER_CULTIVVE; } }
const pinHash=(empId,pin)=>sha(empId+':'+String(pin).trim());
async function migrarPins(){
  const us=usuarios(); if(!S.empresa || !Array.isArray(S.empresa.usuarios) || !us.some(u=>u.pin)) return;

async function pedirPin(titulo,teste,msgSem){
  setTimeout(()=>{ const i=$('#mTx'); if(i) i.maxLength=6; },20);
  const kb='cvinv_pinerr_'+S.empresa.id; const st=LS.get(kb,{n:0,ate:0});
  if(st.ate>Date.now()){ const m=Math.ceil((st.ate-Date.now())/60000); toast(`Muitas tentativas erradas. Tente de novo em ${m} minuto(s).`,true); return null; }
  const pin=await askText(titulo,{label:'Digite seu PIN',type:'password',inputmode:'numeric'});
  if(pin==null) return null;
  const h=await pinHash(S.empresa.id,pin);
  const u=usuarios().find(x=>(x.pinH&&x.pinH===h)||(x.pin&&String(x.pin)===String(pin).trim()));
  if(!u){ const n=(st.ate&&st.ate<=Date.now()?0:st.n)+1;
    if(n>=5){ LS.set(kb,{n:0,ate:Date.now()+5*60000}); toast('5 PINs errados. Este aparelho ficou bloqueado por 5 minutos.',true); }
    else { LS.set(kb,{n,ate:0}); toast(`PIN não encontrado (${n} de 5 tentativas)`,true); }
    return null; }
  LS.del(kb);
  if(String(pin).trim().length!==6){
    toast('Seu PIN agora precisa ter 6 números. Crie um novo.');
    let novo=null;
    for(;;){ novo=await askText('Crie um novo PIN',{label:`${u.nome}, defina um PIN de 6 números`,type:'password',inputmode:'numeric'}); if(novo==null) return null;
      novo=novo.trim(); if(!/^\d{6}$/.test(novo)){ toast('O PIN precisa ter exatamente 6 números',true); continue; }
      const nh=await pinHash(S.empresa.id,novo); if(usuarios().some(x=>x.id!==u.id && x.pinH===nh)){ toast('Esse PIN já é de outro usuário',true); continue; }
      const c=await askText('Confirme o novo PIN',{label:'Digite de novo',type:'password',inputmode:'numeric'}); if(c==null) return null;
      if(c.trim()!==novo){ toast('Os PINs não conferem',true); continue; }
      await salvarUsuarios(usuarios().map(x=>{ if(x.id!==u.id) return x; const y={...x,pinH:nh}; delete y.pin; return y; })); toast('PIN atualizado'); break; }
  }
  if(teste && !teste(u)){ toast(msgSem||(u.nome+' não tem permissão para isso'),true); return null; }
  return u;
}
async function exigir(teste,titulo,msgSem){
  if(adminOk()){ S.sess=USER_CULTIVVE; return USER_CULTIVVE; }
  if(S.me && teste(S.me)) return S.me;
  if(S.sess && teste(S.sess)) return S.sess;

}
